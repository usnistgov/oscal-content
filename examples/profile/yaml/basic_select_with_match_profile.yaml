profile:
  uuid: f554d6c8-4795-4f18-8b30-0cc93f7f1d7b
  metadata:
    title: Sample Security Profile *All Controls* for Demonstration and Testing
    published: "2026-10-21T12:30:00.00000-00:00"
    last-modified: "2026-10-21T02:46:09.00000-00:00"
    version: 1.1.1
    oscal-version: 1.2.3
    remarks: The following document is used in the OSCAL Profile Tutorial and imports the complete sample catalog, including all controls.
  imports:
    - href: ../../catalog/xml/basic_catalog.xml
      include-controls:
        - matching:
            - pattern: s*
      exclude-controls:
        - matching:
            - pattern: s*.2
  merge:
    flat: {}
  modify:
    set-parameters:
      - param-id: s1.1.1-prm_2
        label: a duration (maximum 30 minutes)
    alters:
      - control-id: s1.1.1
        adds:
          - position: after
            by-id: s1.1.1_gdn.3
            parts:
              - id: s1.1.1_gdn.4
                name: assessment-objective
                class: assessment-objective
                prose: 'Users of devices running Gnome may adjust the inactivity timeout using the following link: https://help.gnome.org/admin/system-admin-guide/stable/desktop-lockscreen.html.en'
