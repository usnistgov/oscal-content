              parts:
                - id: MEASURE_4.3_ovw
                  name: overview
                  prose: Measurable performance improvements or declines based on consultations with relevant AI actors including affected communities, and field data about context-relevant risks and trustworthiness characteristics, are identified and documented.
                - id: SA-MEASURE_4.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_4.3-1
                      name: item
                      class: suggested_action
                      prose: Develop baseline quantitative measures for trustworthy characteristics.
                    - id: SA-MEASURE_4.3-2
                      name: item
                      class: suggested_action
                      prose: Delimit and characterize baseline operation values and states.
                    - id: SA-MEASURE_4.3-3
                      name: item
                      class: suggested_action
                      prose: Utilize qualitative approaches to augment and complement quantitative baseline measures, in close coordination with impact assessment, human factors and socio-technical AI actors.
                    - id: SA-MEASURE_4.3-4
                      name: item
                      class: suggested_action
                      prose: Monitor and assess measurements as part of continual improvement to identify potential system adjustments or modifications.
                    - id: SA-MEASURE_4.3-5
                      name: item
                      class: suggested_action
                      prose: Perform and document sensitivity analysis to characterize actual and expected variance in performance after applying system or procedural updates.
                    - id: SA-MEASURE_4.3-6
                      name: item
                      class: suggested_action
                      prose: Document decisions related to the sensitivity analysis and record expected influence on system performance and identified risks.
                - id: A-MEASURE_4.3
                  name: guidance
                  class: about
                  prose: TEVV activities conducted throughout the AI system lifecycle can provide baseline quantitative measures for trustworthy characteristics. When combined with results from measure 2.5 to 2.11 and measure 4.1 and 4.2,TEVV actors can maintain a comprehensive view of system performance. These measures can be augmented through participatory engagement with potentially impacted communities or other forms of stakeholder elicitation about AI systems’ impacts. These sources of information can allow AI actors to explore potential adjustments to system components, adapt operating conditions, or institute performance improvements.
                - id: D-MEASURE_4.3-1
                  name: guidance
                  class: documentation
                  prose: To what extent are the model outputs consistent with the entity's values and principles to foster public trust and equity?
                - id: D-MEASURE_4.3-2
                  name: guidance
                  class: documentation
                  prose: How were sensitive variables (e.g., demographic and socioeconomic categories) that may be subject to regulatory compliance specifically selected or not selected for modeling purposes?
                - id: D-MEASURE_4.3-3
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-MEASURE_4.3-4
                  name: guidance
                  class: documentation
                  prose: How will the accountable human(s) address changes in accuracy and precision due to either an adversary’s attempts to disrupt the AI or unrelated changes in the operational/business environment?
                - id: D-MEASURE_4.3-5
                  name: guidance
                  class: documentation
                  prose: How will user and peer engagement be integrated into the model development process and periodic performance review once deployed?
