              parts:
                - id: MEASURE_2.10_ovw
                  name: overview
                  prose: Privacy risk of the AI system – as identified in the MAP function – is examined and documented.
                - id: SA-MEASURE_2.10
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.10-1
                      name: item
                      class: suggested_action
                      prose: Specify privacy-related values, frameworks, and attributes that are applicable in the context of use through direct engagement with end users and potentially impacted groups and communities.
                    - id: SA-MEASURE_2.10-2
                      name: item
                      class: suggested_action
                      prose: Document collection, use, management, and disclosure of personally sensitive information in datasets, in accordance with privacy and data governance policies
                    - id: SA-MEASURE_2.10-3
                      name: item
                      class: suggested_action
                      prose: Quantify privacy-level data aspects such as the ability to identify individuals or groups (e.g., k-anonymity metrics, l-diversity, t-closeness).
                    - id: SA-MEASURE_2.10-4
                      name: item
                      class: suggested_action
                      prose: Establish and document protocols (authorization, duration, type) and access controls for training sets or production data containing personally sensitive information, in accordance with privacy and data governance policies.
                    - id: SA-MEASURE_2.10-5
                      name: item
                      class: suggested_action
                      prose: Monitor internal queries to production data for detecting patterns that isolate personal records.
                    - id: SA-MEASURE_2.10-6
                      name: item
                      class: suggested_action
                      prose: 'Monitor PSI disclosures and inference of sensitive or legally protected attributes:'
                    - id: SA-MEASURE_2.10-6.1
                      name: item
                      class: suggested_action
                      prose: Assess the risk of manipulation from overly customized content. Evaluate information presented to representative users at various points along axes of difference between individuals (e.g., individuals of different ages, genders, races, political affiliation.).
                    - id: SA-MEASURE_2.10-7
                      name: item
                      class: suggested_action
                      prose: Use privacy-enhancing techniques such as differential privacy, when publicly sharing dataset information.
                    - id: SA-MEASURE_2.10-8
                      name: item
                      class: suggested_action
                      prose: Collaborate with privacy experts, AI end users and operators, and other domain experts to determine optimal differential privacy metrics within contexts of use.
                - id: A-MEASURE_2.10
                  name: guidance
                  class: about
                  prose: Privacy refers generally to the norms and practices that help to safeguard human autonomy, identity, and dignity. These norms and practices typically address freedom from intrusion, limiting observation, or individuals’ agency to consent to disclosure or control of facets of their identities (e.g., body, data, reputation). Privacy values such as anonymity, confidentiality, and control generally should guide choices for AI system design, development, and deployment. Privacy-related risks may influence security, bias, and transparency and come with tradeoffs with these other characteristics. Like safety and security, specific technical features of an AI system may promote or reduce privacy. AI systems can also present new risks to privacy by allowing inference to identify individuals or previously private information about individuals. Privacy-enhancing technologies (“PETs”) for AI, as well as data minimizing methods such as de-identification and aggregation for certain model outputs, can support design for privacy-enhanced AI systems. Under certain conditions such as data sparsity, privacy enhancing techniques can result in a loss in accuracy, impacting decisions about fairness and other values in certain domains.
                - id: D-MEASURE_2.10-1
                  name: guidance
                  class: documentation
                  prose: Did your organization implement accountability-based practices in data management and protection (e.g., the PDPA and OECD Privacy Principles)?
                - id: D-MEASURE_2.10-2
                  name: guidance
                  class: documentation
                  prose: What assessments has the entity conducted on data security and privacy impacts associated with the AI system?
                - id: D-MEASURE_2.10-3
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-MEASURE_2.10-4
                  name: guidance
                  class: documentation
                  prose: Does the dataset contain information that might be considered sensitive or confidential? (e.g., personally identifying information)
                - id: D-MEASURE_2.10-5
                  name: guidance
                  class: documentation
                  prose: If it relates to people, could this dataset expose people to harm or legal action? (e.g., financial, social or otherwise) What was done to mitigator reduce the potential for harm?
