                - href: '#14bd36fb-bf2a-4b75-9d37-5a4ede03beb9'
                  rel: reference
              parts:
                - id: MEASURE_2.2_ovw
                  name: overview
                  prose: Evaluations involving human subjects meet applicable requirements(including human subject protection) and are representative of the relevant population.
                - id: SA-MEASURE_2.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.2-1
                      name: item
                      class: suggested_action
                      prose: Follow human subjects research requirements as established by organizational and disciplinary requirements, including informed consent and compensation, during dataset collection activities.
                    - id: SA-MEASURE_2.2-2
                      name: item
                      class: suggested_action
                      prose: Analyze differences between intended and actual population of users or data subjects, including likelihood for errors, incidents or negative impacts.
                    - id: SA-MEASURE_2.2-3
                      name: item
                      class: suggested_action
                      prose: Utilize disaggregated evaluation methods (e.g., by race, age, gender, ethnicity, ability, region) to improve AI system performance when deployed in real world settings.
                    - id: SA-MEASURE_2.2-4
                      name: item
                      class: suggested_action
                      prose: Establish thresholds and alert procedures for dataset representativeness within the context of use.
                    - id: SA-MEASURE_2.2-5
                      name: item
                      class: suggested_action
                      prose: Construct datasets in close collaboration with experts with knowledge of the context of use.
                    - id: SA-MEASURE_2.2-6
                      name: item
                      class: suggested_action
                      prose: Follow intellectual property and privacy rights related to datasets and their use, including for the subjects represented in the data.
                    - id: SA-MEASURE_2.2-7
                      name: item
                      class: suggested_action
                      prose: Evaluate data representativeness through
                    - id: SA-MEASURE_2.2-7.1
                      name: item
                      class: suggested_action
                      prose: investigating known failure modes,
                    - id: SA-MEASURE_2.2-7.2
                      name: item
                      class: suggested_action
                      prose: assessing data quality and diverse sourcing,
                    - id: SA-MEASURE_2.2-7.3
                      name: item
                      class: suggested_action
                      prose: applying public benchmarks,
                    - id: SA-MEASURE_2.2-7.4
                      name: item
                      class: suggested_action
                      prose: traditional bias testing,
                    - id: SA-MEASURE_2.2-7.5
                      name: item
                      class: suggested_action
                      prose: chaos engineering,
                    - id: SA-MEASURE_2.2-7.6
                      name: item
                      class: suggested_action
                      prose: stakeholder feedback
                    - id: SA-MEASURE_2.2-8
                      name: item
                      class: suggested_action
                      prose: Use informed consent for individuals providing data used in system testing and evaluation.
                - id: A-MEASURE_2.2
                  name: guidance
                  class: about
                  prose: measurement and evaluation of AI systems often involves testing with human subjects or using data captured from human subjects. Protection of human subjects is required by law when carrying out federally funded research and is a domain specific requirement for some disciplines. Standard human subjects protection procedures include protecting the welfare and interests of human subjects, designing evaluations to minimize risks to subjects, and completion of mandatory training regarding legal requirements and expectations. Evaluations of AI system performance that utilize human subjects or human subject data should reflect the population within the context of use. AI system activities utilizing non-representative data may lead to inaccurate assessments or negative and harmful outcomes. It is often difficult – and sometimes impossible, to collect data or perform evaluation tasks that reflect the full operational purview of an AI system. Methods for collecting, annotating, or using these data can also contribute to the challenge. To counteract these challenges, organizations can connect human subjects' data collection, and dataset practices, to AI system contexts and purposes and do so in close collaboration with AI Actors from the relevant domains.
                - id: D-MEASURE_2.2-1
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_2.2-2
                  name: guidance
                  class: documentation
                  prose: How has the entity identified and mitigated potential impacts of bias in the data, including inequitable or discriminatory outcomes?
                - id: D-MEASURE_2.2-3
                  name: guidance
                  class: documentation
                  prose: To what extent are the established procedures effective in mitigating bias, inequity, and other concerns resulting from the system?
                - id: D-MEASURE_2.2-4
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity identified and mitigated potential bias—statistical, contextual, and historical—in the data?
                - id: D-MEASURE_2.2-5
                  name: guidance
                  class: documentation
                  prose: If it relates to people, were they told what the dataset would be used for, and did they consent? What community norms exist for data collected from human communications? If consent was obtained, how? Were the people provided with any mechanism to revoke their consent in the future or for certain uses?
                - id: D-MEASURE_2.2-6
                  name: guidance
                  class: documentation
                  prose: If human subjects were used in the development or testing of the AI system, what protections were put in place to promote their safety and wellbeing?
            - id: MEASURE_2.3
              class: subcategory
              title: MEASURE 2.3
              props:
                - name: sort-id
                  value: 00004.00002.00003
              links:
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
