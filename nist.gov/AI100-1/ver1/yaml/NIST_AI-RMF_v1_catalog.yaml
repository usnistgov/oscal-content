      parts:
        - id: GOVERN_ovw
          name: overview
          prose: A culture of risk management is cultivated and present.
      controls:
        - id: GOVERN_1
          class: category
          title: GOVERN 1
          props:
            - name: sort-id
              value: "00001.00001"
          parts:
            - id: GOVERN_1_smt
              name: statement
              prose: Policies, processes, procedures and practices across the organization related to the mapping, measuring and managing of AI risks are in place, transparent, and implemented effectively.
          controls:
            - id: GOVERN_1.1
              class: subcategory
              title: GOVERN 1.1
              props:
                - name: sort-id
                  value: 00001.00001.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#c4fa67b8-bad5-453e-8ee1-8f578eb4e3da'
                  rel: reference
                - href: '#41d486f2-12fb-4f84-9dfe-5c7f592c58de'
                  rel: reference
                - href: '#ddd77395-e205-44a2-b818-cc442010b5b5'
                  rel: reference
                - href: '#98eef607-b13b-4d5f-b588-cbeedcc6ce47'
                  rel: reference
              parts:
                - id: GOVERN_1.1_ovw
                  name: overview
                  prose: Legal and regulatory requirements involving AI are understood, managed, and documented.
                - id: SA-GOVERN_1.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.1-1
                      name: item
                      class: suggested_action
                      prose: Maintain awareness of the applicable legal and regulatory considerations and requirements specific to industry, sector, and business purpose, as well as the application context of the deployed AI system.
                    - id: SA-GOVERN_1.1-2
                      name: item
                      class: suggested_action
                      prose: Align risk management efforts with applicable legal standards.
                    - id: SA-GOVERN_1.1-3
                      name: item
                      class: suggested_action
                      prose: Maintain policies for training (and re-training) organizational staff about necessary legal or regulatory considerations that may impact AI-related design, development and deployment activities.
                - id: A-GOVERN_1.1
                  name: guidance
                  class: about
                  prose: AI systems may be subject to specific applicable legal and regulatory requirements. Some legal requirements can mandate (e.g., nondiscrimination, data privacy and security controls) documentation, disclosure, and increased AI system transparency. These requirements are complex and may not be applicable or differ across applications and contexts. For example, AI system testing processes for bias measurement, such as disparate impact, are not applied uniformly within the legal context. Disparate impact is broadly defined as a facially neutral policy or practice that disproportionately harms a group based on a protected trait. Notably, some modeling algorithms or debiasing techniques that rely on demographic information, could also come into tension with legal prohibitions on disparate treatment (i.e., intentional discrimination). Additionally, some intended users of AI systems may not have consistent or reliable access to fundamental internet technologies (a phenomenon widely described as the “digital divide”) or may experience difficulties interacting with AI systems due to disabilities or impairments. Such factors may mean different communities experience bias or other negative impacts when trying to access AI systems. Failure to address such design issues may pose legal risks, for example in employment related activities affecting persons with disabilities.
                - id: D-GOVERN_1.1-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity defined and documented the regulatory environment—including minimum requirements in laws and regulations?
                - id: D-GOVERN_1.1-2
                  name: guidance
                  class: documentation
                  prose: Has the system been reviewed for its compliance to applicable laws, regulations, standards, and guidance?
                - id: D-GOVERN_1.1-3
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity defined and documented the regulatory environment—including applicable requirements in laws and regulations?
                - id: D-GOVERN_1.1-4
                  name: guidance
                  class: documentation
                  prose: Has the system been reviewed for its compliance to relevant applicable laws, regulations, standards, and guidance?
            - id: GOVERN_1.2
              class: subcategory
              title: GOVERN 1.2
              props:
                - name: sort-id
                  value: 00001.00001.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
                - href: '#dc5cbec4-53f2-4204-972a-6e882458b06a'
                  rel: reference
                - href: '#1dab0645-031c-478e-acab-432674625733'
                  rel: reference
                - href: '#b391ea51-01a1-4e99-ba53-27f8033e5ff5'
                  rel: reference
                - href: '#cebecb89-e098-48cb-b4da-cbddcbcd7d45'
                  rel: reference
                - href: '#37420397-0ad2-4100-aa59-c68ea5aab187'
                  rel: reference
                - href: '#cf6d5744-4ad8-4467-9bf8-ac9b307f7f50'
                  rel: reference
                - href: '#82d06798-bd3c-4ef1-a6ee-009bae47d25a'
                  rel: reference
                - href: '#a582dbe7-4b34-44b0-9da2-4017829bfc1a'
