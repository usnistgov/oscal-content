              parts:
                - id: MEASURE_4.2_ovw
                  name: overview
                  prose: measurement results regarding AI system trustworthiness in deployment context(s) and across AI lifecycle are informed by input from domain experts and other relevant AI actors to validate whether the system is performing consistently as intended. Results are documented.
                - id: SA-MEASURE_4.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_4.2-1
                      name: item
                      class: suggested_action
                      prose: Integrate feedback from end users, operators, and affected individuals and communities from Map function as inputs to assess AI system trustworthiness characteristics. Ensure both positive and negative feedback is being assessed.
                    - id: SA-MEASURE_4.2-2
                      name: item
                      class: suggested_action
                      prose: Evaluate feedback in connection with AI system trustworthiness characteristics from measure 2.5 to 2.11.
                    - id: SA-MEASURE_4.2-3
                      name: item
                      class: suggested_action
                      prose: Evaluate feedback regarding end user satisfaction with, and confidence in, AI system performance including whether output is considered valid and reliable, and explainable and interpretable.
                    - id: SA-MEASURE_4.2-4
                      name: item
                      class: suggested_action
                      prose: Identify mechanisms to confirm/support AI system output (e.g., recommendations), and end user perspectives about that output.
                    - id: SA-MEASURE_4.2-5
                      name: item
                      class: suggested_action
                      prose: measure frequency of AI systems’ override decisions, evaluate and document results, and feed insights back into continual improvement processes.
                    - id: SA-MEASURE_4.2-6
                      name: item
                      class: suggested_action
                      prose: Consult AI actors in impact assessment, human factors, and socio-technical tasks to assist with analysis and interpretation of results.
                - id: A-MEASURE_4.2
                  name: guidance
                  class: about
                  prose: Feedback captured from relevant AI Actors can be evaluated in combination with output from measure 2.5 to 2.11to determine if the AI system is performing within pre-defined operational limits for validity and reliability, safety, security and resilience, privacy, bias and fairness, explainability and interpretability, and transparency and accountability. This feedback provides an additional layer of insight about AI system performance, including potential misuse or reuse outside of intended settings. Insights based on this type of analysis can inform TEVV-based decisions about metrics and related courses of action.
                - id: D-MEASURE_4.2-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the system/entity consistently measure progress towards stated goals and objectives?
                - id: D-MEASURE_4.2-2
                  name: guidance
                  class: documentation
                  prose: What policies has the entity developed to ensure the use of the AI system is consistent with its stated values and principles?
                - id: D-MEASURE_4.2-3
                  name: guidance
                  class: documentation
                  prose: To what extent are the model outputs consistent with the entity's values and principles to foster public trust and equity?
                - id: D-MEASURE_4.2-4
                  name: guidance
                  class: documentation
                  prose: Given the purpose of the AI, what level of explainability or interpretability is required for how the AI made its determination?
                - id: D-MEASURE_4.2-5
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
            - id: MEASURE_4.3
              class: subcategory
              title: MEASURE 4.3
