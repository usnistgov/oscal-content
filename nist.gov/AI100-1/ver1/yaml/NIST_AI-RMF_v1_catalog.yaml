                - href: '#f49d9b15-78db-4850-a3ce-850b9128e83c'
                  rel: reference
                - href: '#c8fba743-d448-41f6-b35a-e811dd64aa26'
                  rel: reference
                - href: '#64d9bc4f-0f96-410d-b8a0-16cd9d4ddff5'
                  rel: reference
                - href: '#20953eb1-bcc7-4d1a-a858-d4188d94dfd7'
                  rel: reference
              parts:
                - id: MEASURE_2.5_ovw
                  name: overview
                  prose: The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions under which the technology was developed are documented.
                - id: SA-MEASURE_2.5
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.5-1
                      name: item
                      class: suggested_action
                      prose: Define the operating conditions and socio-technical context under which the AI system will be validated.
                    - id: SA-MEASURE_2.5-2
                      name: item
                      class: suggested_action
                      prose: Define and document processes to establish the system’s operational conditions and limits.
                    - id: SA-MEASURE_2.5-3
                      name: item
                      class: suggested_action
                      prose: 'Establish or identify, and document approaches to measure forms of validity, including:'
                    - id: SA-MEASURE_2.5-3.1
                      name: item
                      class: suggested_action
                      prose: construct validity (the test is measuring the concept it claims to measure)
                    - id: SA-MEASURE_2.5-3.2
                      name: item
                      class: suggested_action
                      prose: internal validity (relationship being tested is not influenced by other factors or variables)
                    - id: SA-MEASURE_2.5-3.3
                      name: item
                      class: suggested_action
                      prose: external validity (results are generalizable beyond the training condition)
                    - id: SA-MEASURE_2.5-3.4
                      name: item
                      class: suggested_action
                      prose: the use of experimental design principles and statistical analyses and modeling.
                    - id: SA-MEASURE_2.5-4
                      name: item
                      class: suggested_action
                      prose: Assess and document system variance. Standard approaches include confidence intervals, standard deviation, standard error, bootstrapping, or cross-validation.
                    - id: SA-MEASURE_2.5-5
                      name: item
                      class: suggested_action
                      prose: Establish or identify and document robustness measures.
                    - id: SA-MEASURE_2.5-6
                      name: item
                      class: suggested_action
                      prose: Establish or identify and document reliability measures.
                    - id: SA-MEASURE_2.5-7
                      name: item
                      class: suggested_action
                      prose: Establish practices to specify and document the assumptions underlying measurement models to ensure proxies accurately reflect the concept being measured.
                    - id: SA-MEASURE_2.5-8
                      name: item
                      class: suggested_action
                      prose: Utilize standard software testing approaches (e.g., unit, integration, functional and chaos testing, computer-generated test cases, etc.)
                    - id: SA-MEASURE_2.5-9
                      name: item
                      class: suggested_action
                      prose: Utilize standard statistical methods to test bias, inferential associations, correlation, and covariance in adopted measurement models.
                    - id: SA-MEASURE_2.5-10
                      name: item
                      class: suggested_action
                      prose: Utilize standard statistical methods to test variance and reliability of system outcomes.
                    - id: SA-MEASURE_2.5-11
                      name: item
                      class: suggested_action
                      prose: Monitor operating conditions for system performance outside of defined limits.
                    - id: SA-MEASURE_2.5-12
                      name: item
                      class: suggested_action
                      prose: Identify TEVV approaches for exploring AI system limitations, including testing scenarios that differ from the operational environment. Consult experts with knowledge of specific context of use.
                    - id: SA-MEASURE_2.5-13
                      name: item
                      class: suggested_action
                      prose: 'Define post-alert actions. Possible actions may include:'
                    - id: SA-MEASURE_2.5-13.1
                      name: item
                      class: suggested_action
                      prose: alerting other relevant AI actors before action,
                    - id: SA-MEASURE_2.5-13.2
                      name: item
                      class: suggested_action
                      prose: requesting subsequent human review of action,
                    - id: SA-MEASURE_2.5-13.3
                      name: item
                      class: suggested_action
                      prose: alerting downstream users and stakeholder that the system is operating outside it’s defined validity limits,
                    - id: SA-MEASURE_2.5-13.4
                      name: item
                      class: suggested_action
                      prose: tracking and mitigating possible error propagation
                    - id: SA-MEASURE_2.5-13.5
                      name: item
                      class: suggested_action
                      prose: action logging
                    - id: SA-MEASURE_2.5-14
                      name: item
                      class: suggested_action
                      prose: Log input data and relevant system configuration information whenever there is an attempt to use the system beyond its well-defined range of system validity.
                    - id: SA-MEASURE_2.5-15
                      name: item
                      class: suggested_action
                      prose: Modify the system over time to extend its range of system validity to new operating conditions.
                - id: A-MEASURE_2.5
                  name: guidance
                  class: about
                  prose: An AI system that is not validated or that fails validation may be inaccurate or unreliable or may generalize poorly to data and settings beyond its training, creating and increasing AI risks and reducing trustworthiness. AI Actors can improve system validity by creating processes for exploring and documenting system limitations. This includes broad consideration of purposes and uses for which the system was not designed. Validation risks include the use of proxies or other indicators that are often constructed by AI development teams to operationalize phenomena that are either not directly observable or measurable (e.g., fairness, hireability, honesty, propensity to commit a crime). Teams can mitigate these risks by demonstrating that the indicator is measuring the concept it claims to measure (also known as construct validity). Without this and other types of validation, various negative properties or impacts may go undetected, including the presence of confounding variables, potential spurious correlations, or error propagation and its potential impact on other interconnected systems.
                - id: D-MEASURE_2.5-1
                  name: guidance
                  class: documentation
                  prose: What testing, if any, has the entity conducted on the AI system to identify errors and limitations (i.e., adversarial or stress testing)?
                - id: D-MEASURE_2.5-2
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_2.5-3
                  name: guidance
                  class: documentation
                  prose: How has the entity identified and mitigated potential impacts of bias in the data, including inequitable or discriminatory outcomes?
                - id: D-MEASURE_2.5-4
                  name: guidance
                  class: documentation
                  prose: To what extent are the established procedures effective in mitigating bias, inequity, and other concerns resulting from the system?
                - id: D-MEASURE_2.5-5
                  name: guidance
                  class: documentation
                  prose: What goals and objectives does the entity expect to achieve by designing, developing, and/or deploying the AI system?
            - id: MEASURE_2.6
              class: subcategory
              title: MEASURE 2.6
              props:
                - name: sort-id
                  value: 00004.00002.00006
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#ba9efd8f-547e-47c6-a607-6c3a51e0961a'
                  rel: reference
                - href: '#6c90e20f-9000-4819-bc15-df7cda133ed1'
                  rel: reference
                - href: '#b2e3b617-c50f-4379-b9ee-0a3411488637'
                  rel: reference
                - href: '#66a2d3ec-e29d-4a4c-9d0b-76f38c91a3ad'
                  rel: reference
                - href: '#53a3c21e-1611-437f-a227-36d84b9ab85f'
                  rel: reference
                - href: '#85f95899-c413-4e58-8efb-129d5b54f655'
                  rel: reference
                - href: '#f8de7163-d316-4547-a02f-72167c7d28aa'
                  rel: reference
                - href: '#10d62917-f081-4b07-8811-90ded13bdf12'
                  rel: reference
              parts:
                - id: MEASURE_2.6_ovw
                  name: overview
                  prose: AI system is evaluated regularly for safety risks – as identified in the MAP function. The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the risk tolerance, and can fail safely, particularly if made to operate beyond its knowledge limits. Safety metrics implicate system reliability and robustness, real-time monitoring, and response times for AI system failures.
                - id: SA-MEASURE_2.6
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.6-1
                      name: item
                      class: suggested_action
                      prose: Thoroughly measure system performance in development and deployment contexts, and under stress conditions.
                    - id: SA-MEASURE_2.6-1.1
                      name: item
                      class: suggested_action
                      prose: Employ test data assessments and simulations before proceeding to production testing. Track multiple performance quality and error metrics.
                    - id: SA-MEASURE_2.6-1.2
                      name: item
                      class: suggested_action
                      prose: Stress-test system performance under likely scenarios (e.g., concept drift, high load) and beyond known limitations, in consultation with domain experts.
                    - id: SA-MEASURE_2.6-1.3
                      name: item
                      class: suggested_action
                      prose: Test the system under conditions similar to those related to past known incidents or near-misses and measure system performance and safety characteristics.
                    - id: SA-MEASURE_2.6-1.4
                      name: item
                      class: suggested_action
                      prose: Apply chaos engineering approaches to test systems in extreme conditions and gauge unexpected responses.
                    - id: SA-MEASURE_2.6-1.5
                      name: item
                      class: suggested_action
                      prose: Document the range of conditions under which the system has been tested and demonstrated to fail safely.
                    - id: SA-MEASURE_2.6-2
                      name: item
                      class: suggested_action
                      prose: measure and monitor system performance in real-time to enable rapid response when AI system incidents are detected.
                    - id: SA-MEASURE_2.6-3
                      name: item
                      class: suggested_action
                      prose: Collect pertinent safety statistics (e.g., out-of-range performance, incident response times, system down time, injuries, etc.) in anticipation of potential information sharing with impacted communities or as required by AI system oversight personnel.
                    - id: SA-MEASURE_2.6-4
                      name: item
                      class: suggested_action
                      prose: Align measurement to the goal of continuous improvement. Seek to increase the range of conditions under which the system is able to fail safely through system modifications in response to in-production testing and events.
                    - id: SA-MEASURE_2.6-5
                      name: item
                      class: suggested_action
                      prose: Document, practice and measure incident response plans for AI system incidents, including measuring response and down times.
                    - id: SA-MEASURE_2.6-6
                      name: item
                      class: suggested_action
                      prose: Compare documented safety testing and monitoring information with established risk tolerances on an on-going basis.
                    - id: SA-MEASURE_2.6-7
                      name: item
                      class: suggested_action
                      prose: Consult manage for detailed information related to managing safety risks.
                - id: A-MEASURE_2.6
                  name: guidance
                  class: about
                  prose: Many AI systems are being introduced into settings such as transportation, manufacturing or security, where failures may give rise to various physical or environmental harms. AI systems that may endanger human life, health, property or the environment are tested thoroughly prior to deployment, and are regularly evaluated to confirm the system is safe during normal operations, and in settings beyond its proposed use and knowledge limits. Measuring activities for safety often relate to exhaustive testing in development and deployment contexts, understanding the limits of a system's reliable, robust, and safe behavior, and real-time monitoring of various aspects of system performance. These activities are typically conducted along with other risk mapping, management, and governance tasks such as avoiding past failed designs, establishing and rehearsing incident response plans that enable quick responses to system problems, the instantiation of redundant functionality to cover failures, and transparent and accountable governance. System safety incidents or failures are frequently reported to be related to organizational dynamics and culture. Independent auditors may bring important independent perspectives for reviewing evidence of AI system safety.
                - id: D-MEASURE_2.6-1
                  name: guidance
                  class: documentation
                  prose: What testing, if any, has the entity conducted on the AI system to identify errors and limitations (i.e., adversarial or stress testing)?
                - id: D-MEASURE_2.6-2
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the AI system's development, testing methodology, metrics, and performance outcomes?
                - id: D-MEASURE_2.6-3
                  name: guidance
                  class: documentation
                  prose: Did you establish mechanisms that facilitate the AI system’s auditability(e.g., traceability of the development process, the sourcing of training data and the logging of the AI system’s processes, outcomes, positive and negative impact)?
                - id: D-MEASURE_2.6-4
                  name: guidance
                  class: documentation
                  prose: Did you ensure that the AI system can be audited by independent third parties?
                - id: D-MEASURE_2.6-5
                  name: guidance
                  class: documentation
                  prose: Did you establish a process for third parties (e.g., suppliers, end-users, subjects, distributors/vendors or workers) to report potential vulnerabilities, risks or biases in the AI system?
            - id: MEASURE_2.7
              class: subcategory
              title: MEASURE 2.7
              props:
                - name: sort-id
                  value: 00004.00002.00007
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
