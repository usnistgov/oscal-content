                - href: '#105d77a1-07d1-4e69-b0e9-c4e04711e298'
                  rel: reference
              parts:
                - id: MAP_1.1_ovw
                  name: overview
                  prose: 'Intended purpose, potentially beneficial uses, context-specific laws, norms and expectations, and prospective settings in which the AI system will be deployed are understood and documented. Considerations include: specific set or types of users along with their expectations; potential positive and negative impacts of system uses to individuals, communities, organizations, society, and the planet; assumptions and related limitations about AI system purposes; uses and risks across the development or product AI lifecycle; TEVV and system metrics.'
                - id: SA-MAP_1.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_1.1-1
                      name: item
                      class: suggested_action
                      prose: Maintain awareness of industry, technical, and applicable legal standards.
                    - id: SA-MAP_1.1-2
                      name: item
                      class: suggested_action
                      prose: Examine trustworthiness of AI system design and consider, non-AI solutions.
                    - id: SA-MAP_1.1-3
                      name: item
                      class: suggested_action
                      prose: Consider intended AI system design tasks along with unanticipated purposes in collaboration with human factors and socio-technical domain experts.
                    - id: SA-MAP_1.1-4
                      name: item
                      class: suggested_action
                      prose: Define and document the task, purpose, minimum functionality, and benefits of the AI system to inform considerations about whether the utility of the project or its lack of.
                    - id: SA-MAP_1.1-5
                      name: item
                      class: suggested_action
                      prose: Identify whether there are non-AI or non-technology alternatives that will lead to more trustworthy outcomes.
                    - id: SA-MAP_1.1-6
                      name: item
                      class: suggested_action
                      prose: 'Examine how changes in system performance affect downstream events such as decision-making (e.g.: changes in an AI model objective function create what types of impacts in how many candidates do/do not get a job interview).'
                    - id: SA-MAP_1.1-7
                      name: item
                      class: suggested_action
                      prose: Determine the end user and organizational requirements, including business and technical requirements.
                    - id: SA-MAP_1.1-8
                      name: item
                      class: suggested_action
                      prose: 'Determine and delineate the expected and acceptable AI system context of use, including:'
                    - id: SA-MAP_1.1-8.1
                      name: item
                      class: suggested_action
                      prose: social norms
                    - id: SA-MAP_1.1-8.2
                      name: item
                      class: suggested_action
                      prose: impacted individuals, groups, and communities
                    - id: SA-MAP_1.1-8.3
                      name: item
                      class: suggested_action
                      prose: potential positive and negative impacts to individuals, groups, communities, organizations, and society
                    - id: SA-MAP_1.1-8.4
                      name: item
                      class: suggested_action
                      prose: operational environment
                    - id: SA-MAP_1.1-9
                      name: item
                      class: suggested_action
                      prose: Perform context analysis related to time frame, safety concerns, geographic area, physical environment, ecosystems, social environment, and cultural norms within the intended setting (or conditions that closely approximate the intended setting.
                    - id: SA-MAP_1.1-10
                      name: item
                      class: suggested_action
                      prose: Gain and maintain awareness about evaluating scientific claims related to AI system performance and benefits before launching into system design.
                    - id: SA-MAP_1.1-11
                      name: item
                      class: suggested_action
                      prose: Identify human-AI interaction and/or roles, such as whether the application will support or replace human decision making.
                    - id: SA-MAP_1.1-12
                      name: item
                      class: suggested_action
                      prose: Plan for risks related to human-AI configurations, and document requirements, roles, and responsibilities for human oversight of deployed systems.
                - id: A-MAP_1.1
                  name: guidance
                  class: about
                  prose: 'Highly accurate and optimized systems can cause harm. Relatedly, organizations should expect broadly deployed AI tools to be reused, repurposed, and potentially misused regardless of intentions. AI actors can work collaboratively, and with external parties such as community groups, to help delineate the bounds of acceptable deployment, consider preferable alternatives, and identify principles and strategies to manage likely risks. Context mapping is the first step in this effort, and may include examination of the following: intended purpose and impact of system use. concept of operations. intended, prospective, and actual deployment setting. requirements for system deployment and operation. end user and operator expectations. specific set or types of end users. potential negative impacts to individuals, groups, communities, organizations, and society – or context-specific impacts such as legal requirements or impacts to the environment. unanticipated, downstream, or other unknown contextual factors. how AI system changes connect to impacts. These types of processes can assist AI actors in understanding how limitations, constraints, and other realities associated with the deployment and use of AI technology can create impacts once they are deployed or operate in the real world. When coupled with the enhanced organizational culture resulting from the established policies and procedures in the Govern function, the Map function can provide opportunities to foster and instill new perspectives, activities, and skills for approaching risks and impacts. Context mapping also includes discussion and consideration of non-AI or non-technology alternatives especially as related to whether the given context is narrow enough to manage AI and its potential negative impacts. Non-AI alternatives may include capturing and evaluating information using semi-autonomous or mostly manual methods.'
                - id: D-MAP_1.1-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the plan specifically address risks associated with acquisition, procurement of packaged software from vendors, cybersecurity controls, computational infrastructure, data, data science, deployment mechanics, and system failure?
                - id: D-MAP_1.1-2
                  name: guidance
                  class: documentation
                  prose: Which AI actors are responsible for the decisions of the AI and is this person aware of the intended uses and limitations of the analytic?
                - id: D-MAP_1.1-3
                  name: guidance
                  class: documentation
                  prose: Which AI actors are responsible for maintaining, re-verifying, monitoring, and updating this AI once deployed?
                - id: D-MAP_1.1-4
                  name: guidance
                  class: documentation
                  prose: Who is the person(s) accountable for the ethical considerations across the AI lifecycle?
            - id: MAP_1.2
              class: subcategory
              title: MAP 1.2
              props:
                - name: sort-id
                  value: 00003.00001.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#28d7955e-1de6-491b-ac31-44496fe0a509'
                  rel: reference
                - href: '#ef412b4e-eed2-48b7-9ed0-3f0805e02fad'
                  rel: reference
                - href: '#cc25a3ff-0a73-4f4e-a867-a6737ac8e8ee'
                  rel: reference
                - href: '#fc22b0d5-a0a4-4769-a01f-db9fa655cab5'
                  rel: reference
                - href: '#47c160f8-3183-440b-92d9-85e73f828879'
                  rel: reference
              parts:
                - id: MAP_1.2_ovw
                  name: overview
                  prose: Inter-disciplinary AI actors, competencies, skills and capacities for establishing context reflect demographic diversity and broad domain and user experience expertise, and their participation is documented. Opportunities for interdisciplinary collaboration are prioritized.
                - id: SA-MAP_1.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_1.2-1
                      name: item
                      class: suggested_action
                      prose: Establish interdisciplinary teams to reflect a wide range of skills, competencies, and capabilities for AI efforts. Verify that team membership includes demographic diversity, broad domain expertise, and lived experiences. Document team composition.
                    - id: SA-MAP_1.2-2
                      name: item
                      class: suggested_action
                      prose: Create and empower interdisciplinary expert teams to capture, learn, and engage the interdependencies of deployed AI systems and related terminologies and concepts from disciplines outside of AI practice such as law, sociology, psychology, anthropology, public policy, systems design, and engineering.
                - id: A-MAP_1.2
                  name: guidance
                  class: about
                  prose: Successfully mapping context requires a team of AI actors with a diversity of experience, expertise, abilities and backgrounds, and with the resources and independence to engage in critical inquiry. Having a diverse team contributes to more broad and open sharing of ideas and assumptions about the purpose and function of the technology being designed and developed – making these implicit aspects more explicit. The benefit of a diverse staff in managing AI risks is not the beliefs or presumed beliefs of individual workers, but the behavior that results from a collective perspective. An environment which fosters critical inquiry creates opportunities to surface problems and identify existing and emergent risks.
                - id: D-MAP_1.2-1
                  name: guidance
                  class: documentation
                  prose: To what extent do the teams responsible for developing and maintaining the AI system reflect diverse opinions, backgrounds, experiences, and perspectives?
                - id: D-MAP_1.2-2
                  name: guidance
                  class: documentation
                  prose: Did the entity document the demographics of those involved in the design and development of the AI system to capture and communicate potential biases inherent to the development process, according to forum participants?
                - id: D-MAP_1.2-3
                  name: guidance
                  class: documentation
                  prose: What specific perspectives did stakeholders share, and how were they integrated across the design, development, deployment, assessment, and monitoring of the AI system?
                - id: D-MAP_1.2-4
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity addressed stakeholder perspectives on the potential negative impacts of the AI system on end users and impacted populations?
                - id: D-MAP_1.2-5
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
                - id: D-MAP_1.2-6
                  name: guidance
                  class: documentation
                  prose: Did your organization address usability problems and test whether user interfaces served their intended purposes? Consulting the community or end users at the earliest stages of development to ensure there is transparency on the technology used and how it is deployed.
            - id: MAP_1.3
              class: subcategory
              title: MAP 1.3
              props:
                - name: sort-id
                  value: 00003.00001.00003
              links:
