              parts:
                - id: MEASURE_2.11_ovw
                  name: overview
                  prose: Fairness and bias – as identified in the MAP function – is evaluated and results are documented.
                - id: SA-MEASURE_2.11
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.11-1
                      name: item
                      class: suggested_action
                      prose: 'Conduct fairness assessments to manage computational and statistical forms of bias which include the following steps:'
                    - id: SA-MEASURE_2.11-1.1
                      name: item
                      class: suggested_action
                      prose: Identify types of harms, including allocational, representational, quality of service, stereotyping, or erasure.
                    - id: SA-MEASURE_2.11-1.2
                      name: item
                      class: suggested_action
                      prose: Identify across, within, and intersecting groups that might be harmed.
                    - id: SA-MEASURE_2.11-1.3
                      name: item
                      class: suggested_action
                      prose: Quantify harms using both a general fairness metric, if appropriate(e.g., demographic parity, equalized odds, equal opportunity, statistical hypothesis tests), and custom, context-specific metrics developed in collaboration with affected communities.
                    - id: SA-MEASURE_2.11-1.4
                      name: item
                      class: suggested_action
                      prose: Analyze quantified harms for contextually significant differences across groups, within groups, and among intersecting groups.
                    - id: SA-MEASURE_2.11-1.5
                      name: item
                      class: suggested_action
                      prose: Refine identification of within-group and intersectional group disparities.
                    - id: SA-MEASURE_2.11-1.5.1
                      name: item
                      class: suggested_action
                      prose: Evaluate underlying data distributions and employ sensitivity analysis during the analysis of quantified harms.
                    - id: SA-MEASURE_2.11-1.5.2
                      name: item
                      class: suggested_action
                      prose: Evaluate quality metrics including false positive rates and false negative rates.
                    - id: SA-MEASURE_2.11-1.5.3
                      name: item
                      class: suggested_action
                      prose: Consider biases affecting small groups, within-group or intersectional communities, or single individuals.
                    - id: SA-MEASURE_2.11-2
                      name: item
                      class: suggested_action
                      prose: 'Understand and consider sources of bias in training and TEVV data:'
                    - id: SA-MEASURE_2.11-2.1
                      name: item
                      class: suggested_action
                      prose: Differences in distributions of outcomes across and within groups, including intersecting groups.
                    - id: SA-MEASURE_2.11-2.2
                      name: item
                      class: suggested_action
                      prose: Completeness, representativeness and balance of data sources.
                    - id: SA-MEASURE_2.11-2.3
                      name: item
                      class: suggested_action
                      prose: Identify input data features that may serve as proxies for demographic group membership (i.e., credit score, ZIP code) or otherwise give rise to emergent bias within AI systems.
                    - id: SA-MEASURE_2.11-2.4
                      name: item
                      class: suggested_action
                      prose: Forms of systemic bias in images, text (or word embeddings),audio or other complex or unstructured data.
                    - id: SA-MEASURE_2.11-3
                      name: item
                      class: suggested_action
                      prose: Leverage impact assessments to identify and classify system impacts and harms to end users, other individuals, and groups with input from potentially impacted communities.
                    - id: SA-MEASURE_2.11-4
                      name: item
                      class: suggested_action
                      prose: Identify the classes of individuals, groups, or environmental ecosystems which might be impacted through direct engagement with potentially impacted communities.
                    - id: SA-MEASURE_2.11-5
                      name: item
                      class: suggested_action
                      prose: Evaluate systems in regard to disability inclusion, including consideration of disability status in bias testing, and discriminatory screen out processes that may arise from non-inclusive design or deployment decisions.
                    - id: SA-MEASURE_2.11-6
                      name: item
                      class: suggested_action
                      prose: Develop objective functions in consideration of systemic biases, in-group/out-group dynamics.
                    - id: SA-MEASURE_2.11-7
                      name: item
                      class: suggested_action
                      prose: Use context-specific fairness metrics to examine how system performance varies across groups, within groups, and/or for intersecting groups. Metrics may include statistical parity, error-rate equality, statistical parity difference, equal opportunity difference, average absolute odds difference, standardized mean difference, percentage point differences.
                    - id: SA-MEASURE_2.11-8
                      name: item
                      class: suggested_action
                      prose: Customize fairness metrics to specific context of use to examine how system performance and potential harms vary within contextual norms.
                    - id: SA-MEASURE_2.11-9
                      name: item
                      class: suggested_action
                      prose: Define acceptable levels of difference in performance in accordance with established organizational governance policies, business requirements, regulatory compliance, legal frameworks, and ethical standards within the context of use.
                    - id: SA-MEASURE_2.11-10
                      name: item
                      class: suggested_action
                      prose: Define the actions to be taken if disparity levels rise above acceptable levels.
                    - id: SA-MEASURE_2.11-11
                      name: item
                      class: suggested_action
                      prose: Identify groups within the expected population that may require disaggregated analysis, in collaboration with impacted communities.
                    - id: SA-MEASURE_2.11-12
                      name: item
                      class: suggested_action
                      prose: Leverage experts with knowledge in the specific context of use to investigate substantial measurement differences and identify root causes for those differences.
                    - id: SA-MEASURE_2.11-13
                      name: item
                      class: suggested_action
                      prose: Monitor system outputs for performance or bias issues that exceed established tolerance levels.
                    - id: SA-MEASURE_2.11-14
                      name: item
                      class: suggested_action
                      prose: Ensure periodic model updates; test and recalibrate with updated and more representative data to stay within acceptable levels of difference.
                    - id: SA-MEASURE_2.11-15
                      name: item
                      class: suggested_action
                      prose: Apply pre-processing data transformations to address factors related to demographic balance and data representativeness.
                    - id: SA-MEASURE_2.11-16
                      name: item
                      class: suggested_action
                      prose: Apply in-processing to balance model performance quality with bias considerations.
                    - id: SA-MEASURE_2.11-17
                      name: item
                      class: suggested_action
                      prose: Apply post-processing mathematical/computational techniques to model results in close collaboration with impact assessors, socio-technical experts, and other AI actors with expertise in the context of use.
                    - id: SA-MEASURE_2.11-18
                      name: item
                      class: suggested_action
                      prose: Apply model selection approaches with transparent and deliberate consideration of bias management and other trustworthy characteristics.
                    - id: SA-MEASURE_2.11-19
                      name: item
                      class: suggested_action
                      prose: Collect and share information about differences in outcomes for the identified groups.
                    - id: SA-MEASURE_2.11-20
                      name: item
                      class: suggested_action
                      prose: Consider mediations to mitigate differences, especially those that can be traced to past patterns of unfair or biased human decision-making.
                    - id: SA-MEASURE_2.11-21
                      name: item
                      class: suggested_action
                      prose: Utilize human-centered design practices to generate deeper focus on societal impacts and counter human-cognitive biases within the AI lifecycle.
                    - id: SA-MEASURE_2.11-22
                      name: item
                      class: suggested_action
                      prose: Evaluate practices along the lifecycle to identify potential sources of human-cognitive bias such as availability, observational, and confirmation bias, and to make implicit decision-making processes more explicit and open to investigation.
                    - id: SA-MEASURE_2.11-23
                      name: item
                      class: suggested_action
                      prose: Work with human factors experts to evaluate biases in the presentation of system output to end users, operators and practitioners.
                    - id: SA-MEASURE_2.11-24
                      name: item
                      class: suggested_action
                      prose: Utilize processes to enhance contextual awareness, such as diverse internal staff and stakeholder engagement.
                - id: A-MEASURE_2.11
                  name: guidance
                  class: about
                  prose: 'Fairness in AI includes concerns for equality and equity by addressing issues such as harmful bias and discrimination. Standards of fairness can be complex and difficult to define because perceptions of fairness differ among cultures and may shift depending on application. Organizations’ risk management efforts will be enhanced by recognizing and considering these differences. Systems in which harmful biases are mitigated are not necessarily fair. For example, systems in which predictions are somewhat balanced across demographic groups may still be inaccessible to individuals with disabilities or affected by the digital divide or may exacerbate existing disparities or systemic biases. Bias is broader than demographic balance and data representativeness. NIST has identified three major categories of AI bias to be considered and managed: systemic, computational and statistical, and human-cognitive. Each of these can occur in the absence of prejudice, partiality, or discriminatory intent. Systemic bias can be present in AI datasets, the organizational norms, practices, and processes across the AI lifecycle, and the broader society that uses AI systems. Computational and statistical biases can be present in AI datasets and algorithmic processes, and often stem from systematic errors due ton on-representative samples. Human-cognitive biases relate to how an individual or group perceives AI system information to make a decision or fill in missing information, or how humans think about purposes and functions of an AI system. Human-cognitive biases are omnipresent in decision-making processes across the AI lifecycle and system use, including the design, implementation, operation, and maintenance of AI. Bias exists in many forms and can become ingrained in the automated systems that help make decisions about our lives. While bias is not always a negative phenomenon, AI systems can potentially increase the speed and scale of biases and perpetuate and amplify harms to individuals, groups, communities, organizations, and society.'
                - id: D-MEASURE_2.11-1
                  name: guidance
                  class: documentation
                  prose: To what extent are the established procedures effective in mitigating bias, inequity, and other concerns resulting from the system?
                - id: D-MEASURE_2.11-2
                  name: guidance
                  class: documentation
                  prose: If it relates to people, does it unfairly advantage or disadvantage a particular social group? In what ways? How was this mitigated?
                - id: D-MEASURE_2.11-3
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_2.11-4
                  name: guidance
                  class: documentation
                  prose: How has the entity identified and mitigated potential impacts of bias in the data, including inequitable or discriminatory outcomes?
                - id: D-MEASURE_2.11-5
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity identified and mitigated potential bias—statistical, contextual, and historical—in the data?
                - id: D-MEASURE_2.11-6
                  name: guidance
                  class: documentation
                  prose: 'Were adversarial machine learning approaches considered or used for measuring bias (e.g.: prompt engineering, adversarial models)'
            - id: MEASURE_2.12
              class: subcategory
              title: MEASURE 2.12
              props:
                - name: sort-id
                  value: 00004.00002.00012
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#73fa0d5d-1728-4d45-8110-4c8ab287de37'
                  rel: reference
                - href: '#51066e1d-2c8e-4f98-8e4f-0933f57a51c9'
                  rel: reference
                - href: '#b614abf5-e960-4f5e-b941-95ef7914df9d'
                  rel: reference
                - href: '#65c0b26e-83d6-4c93-98ee-dc76da9820d7'
                  rel: reference
                - href: '#6236958f-61ea-4436-a4fc-977c6f5c042b'
                  rel: reference
                - href: '#08189a89-79e8-479a-93bf-46162d9e46ef'
                  rel: reference
              parts:
                - id: MEASURE_2.12_ovw
                  name: overview
                  prose: Environmental impact and sustainability of AI model training and management activities – as identified in the MAP function – are assessed and documented.
                - id: SA-MEASURE_2.12
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.12-1
                      name: item
                      class: suggested_action
                      prose: Include environmental impact indicators in AI system design and development plans, including reducing consumption and improving efficiencies.
                    - id: SA-MEASURE_2.12-2
                      name: item
                      class: suggested_action
                      prose: Identify and implement key indicators of AI system energy and water consumption and efficiency, and/or GHG emissions.
                    - id: SA-MEASURE_2.12-3
                      name: item
                      class: suggested_action
                      prose: Establish measurable baselines for sustainable AI system operation in accordance with organizational policies, regulatory compliance, legal frameworks, and environmental protection and sustainability norms.
                    - id: SA-MEASURE_2.12-4
                      name: item
                      class: suggested_action
                      prose: Assess tradeoffs between AI system performance and sustainable operations in accordance with organizational principles and policies, regulatory compliance, legal frameworks, and environmental protection and sustainability norms.
                    - id: SA-MEASURE_2.12-5
                      name: item
                      class: suggested_action
                      prose: Identify and establish acceptable resource consumption and efficiency, and GHG emissions levels, along with actions to be taken if indicators rise above acceptable levels.
                    - id: SA-MEASURE_2.12-6
                      name: item
                      class: suggested_action
                      prose: Estimate AI system emissions levels throughout the AI lifecycle via carbon calculators or similar process.
                - id: A-MEASURE_2.12
                  name: guidance
                  class: about
                  prose: Large-scale, high-performance computational resources used by AI systems for training and operation can contribute to environmental impacts. Direct negative impacts to the environment from these processes are related to energy consumption, water consumption, and greenhouse gas (GHG) emissions. The OECD has identified metrics for each type of negative direct impact. Indirect negative impacts to the environment reflect the complexity of interactions between human behavior, socio-economic systems, and the environment and can include induced consumption and “rebound effects\", where efficiency gains are offset by accelerated resource consumption. Other AI related environmental impacts can arise from the production of computational equipment and networks (e.g., mining and extraction of raw materials), transporting hardware, and electronic waste recycling or disposal.
                - id: D-MEASURE_2.12-1
                  name: guidance
                  class: documentation
                  prose: Are greenhouse gas emissions, and energy and water consumption and efficiency tracked within the organization?
                - id: D-MEASURE_2.12-2
                  name: guidance
                  class: documentation
                  prose: Are deployed AI systems evaluated for potential upstream and downstream environmental impacts (e.g., increased consumption, increased emissions, etc.)?
                - id: D-MEASURE_2.12-3
                  name: guidance
                  class: documentation
                  prose: Could deployed AI systems cause environmental incidents, e.g., air or water pollution incidents, toxic spills, fires or explosions?
            - id: MEASURE_2.13
              class: subcategory
              title: MEASURE 2.13
              props:
                - name: sort-id
                  value: 00004.00002.00013
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#2ad62114-3f1c-4028-8f0b-abfb924dabc5'
                  rel: reference
                - href: '#b40a7a2f-d028-49f3-b903-77f714435d98'
                  rel: reference
                - href: '#24666da5-553c-4aef-813b-64270d466d62'
                  rel: reference
                - href: '#c4725173-537f-4fa8-8b33-5d0e52bd6d40'
                  rel: reference
              parts:
                - id: MEASURE_2.13_ovw
                  name: overview
                  prose: Effectiveness of the employed TEVV metrics and processes in the measure function are evaluated and documented.
                - id: SA-MEASURE_2.13
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.13-1
                      name: item
                      class: suggested_action
                      prose: Review selected system metrics and associated TEVV processes to determine if they are able to sustain system improvements, including the identification and removal of errors.
                    - id: SA-MEASURE_2.13-2
                      name: item
                      class: suggested_action
                      prose: Regularly evaluate system metrics for utility and consider descriptive approaches in place of overly complex methods.
                    - id: SA-MEASURE_2.13-3
                      name: item
                      class: suggested_action
                      prose: Review selected system metrics for acceptability within the end user and impacted community of interest.
                    - id: SA-MEASURE_2.13-4
                      name: item
                      class: suggested_action
                      prose: Assess effectiveness of metrics for identifying and measuring risks.
                - id: A-MEASURE_2.13
                  name: guidance
                  class: about
                  prose: The development of metrics is a process often considered to be objective but, as a human and organization driven endeavor, can reflect implicit and systemic biases, and may inadvertently reflect factors unrelated to the target function. measurement approaches can be oversimplified, gamed, lack critical nuance, become used and relied upon in unexpected ways, fail to account for differences in affected groups and contexts. Revisiting the metrics chosen in measure 2.1 through 2.12 in a process of continual improvement can help AI actors to evaluate and document metric effectiveness and make necessary course corrections.
                - id: D-MEASURE_2.13-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the system/entity consistently measure progress towards stated goals and objectives?
                - id: D-MEASURE_2.13-2
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_2.13-3
                  name: guidance
                  class: documentation
                  prose: What corrective actions has the entity taken to enhance the quality, accuracy, reliability, and representativeness of the data?
                - id: D-MEASURE_2.13-4
                  name: guidance
                  class: documentation
                  prose: To what extent are the model outputs consistent with the entity's values and principles to foster public trust and equity?
                - id: D-MEASURE_2.13-5
                  name: guidance
                  class: documentation
                  prose: How will the accuracy or appropriate performance metrics be assessed?
        - id: MEASURE_3
          class: category
          title: MEASURE 3
          props:
            - name: sort-id
              value: "00004.00003"
          parts:
            - id: MEASURE_3_smt
              name: statement
              prose: Mechanisms for tracking identified AI risks over time are in place.
          controls:
            - id: MEASURE_3.1
              class: subcategory
              title: MEASURE 3.1
              props:
                - name: sort-id
                  value: 00004.00003.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#df5155d6-eeb0-4684-b594-1a6bb8fe3936'
                  rel: reference
                - href: '#f8de7163-d316-4547-a02f-72167c7d28aa'
                  rel: reference
              parts:
                - id: MEASURE_3.1_ovw
                  name: overview
                  prose: Approaches, personnel, and documentation are in place to regularly identify and track existing, unanticipated, and emergent AI risks based on factors such as intended and actual performance in deployed contexts.
                - id: SA-MEASURE_3.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_3.1-1
                      name: item
                      class: suggested_action
                      prose: 'Compare AI system risks with:'
                    - id: SA-MEASURE_3.1-1.1
                      name: item
                      class: suggested_action
                      prose: simpler or traditional models
                    - id: SA-MEASURE_3.1-1.2
                      name: item
                      class: suggested_action
                      prose: human baseline performance
                    - id: SA-MEASURE_3.1-1.3
                      name: item
                      class: suggested_action
                      prose: other manual performance benchmarks
                    - id: SA-MEASURE_3.1-2
                      name: item
                      class: suggested_action
                      prose: Compare end user and community feedback about deployed AI systems to internal measures of system performance.
                    - id: SA-MEASURE_3.1-3
                      name: item
                      class: suggested_action
                      prose: Assess effectiveness of metrics for identifying and measuring emergent risks.
                    - id: SA-MEASURE_3.1-4
                      name: item
                      class: suggested_action
                      prose: measure error response times and track response quality.
                    - id: SA-MEASURE_3.1-5
                      name: item
                      class: suggested_action
                      prose: 'Elicit and track feedback from AI actors in user support roles about the type of metrics, explanations and other system information required for fulsome resolution of system issues. Consider:'
                    - id: SA-MEASURE_3.1-5.1
                      name: item
                      class: suggested_action
                      prose: Instances where explanations are insufficient for investigating possible error sources or identifying responses.
                    - id: SA-MEASURE_3.1-5.2
                      name: item
                      class: suggested_action
                      prose: System metrics, including system logs and explanations, for identifying and diagnosing sources of system error.
                    - id: SA-MEASURE_3.1-6
                      name: item
                      class: suggested_action
                      prose: Elicit and track feedback from AI actors in incident response and support roles about the adequacy of staffing and resources to perform their duties in an effective and timely manner.
                - id: A-MEASURE_3.1
                  name: guidance
                  class: about
                  prose: For trustworthy AI systems, regular system monitoring is carried out in accordance with organizational governance policies, AI actor roles and responsibilities, and within a culture of continual improvement. If and when emergent or complex risks arise, it may be necessary to adapt internal risk management procedures, such as regular monitoring, to stay on course. Documentation, resources, and training are part of an overall strategy to support AI actors as they investigate and respond to AI system errors, incidents or negative impacts.
                - id: D-MEASURE_3.1-1
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-MEASURE_3.1-2
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MEASURE_3.1-3
                  name: guidance
                  class: documentation
                  prose: What metrics has the entity developed to measure performance of the AI system, including error logging?
                - id: D-MEASURE_3.1-4
                  name: guidance
                  class: documentation
                  prose: To what extent do the metrics provide accurate and useful measure of performance?
            - id: MEASURE_3.2
              class: subcategory
              title: MEASURE 3.2
              props:
                - name: sort-id
                  value: 00004.00003.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#df5155d6-eeb0-4684-b594-1a6bb8fe3936'
                  rel: reference
                - href: '#916ba38f-168c-4d1c-bf71-d6f91f6f4b2a'
                  rel: reference
                - href: '#b628a338-c9ea-4e9d-b660-24fd61919274'
                  rel: reference
                - href: '#b2e44d38-e0c9-4b1f-9678-3a69744bdccf'
                  rel: reference
                - href: '#34255142-1a23-44db-af39-c898ea640714'
                  rel: reference
                - href: '#5a266cfb-5ddf-4ba8-84b6-7752f3c54404'
                  rel: reference
                - href: '#ef412b4e-eed2-48b7-9ed0-3f0805e02fad'
                  rel: reference
                - href: '#a988fcec-e452-4949-b995-4b362a5d1190'
                  rel: reference
              parts:
                - id: MEASURE_3.2_ovw
                  name: overview
                  prose: Risk tracking approaches are considered for settings where AI risks are difficult to assess using currently available measurement techniques or where metrics are not yet available.
                - id: SA-MEASURE_3.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_3.2-1
                      name: item
                      class: suggested_action
                      prose: 'Establish processes for tracking emergent risks that may not be measurable with current approaches. Some processes may include:'
                    - id: SA-MEASURE_3.2-1.1
                      name: item
                      class: suggested_action
                      prose: Recourse mechanisms for faulty AI system outputs.
                    - id: SA-MEASURE_3.2-1.2
                      name: item
                      class: suggested_action
                      prose: Bug bounties.
                    - id: SA-MEASURE_3.2-1.3
                      name: item
                      class: suggested_action
                      prose: Human-centered design approaches.
                    - id: SA-MEASURE_3.2-1.4
                      name: item
                      class: suggested_action
                      prose: User-interaction and experience research.
                    - id: SA-MEASURE_3.2-1.5
                      name: item
                      class: suggested_action
                      prose: Participatory stakeholder engagement with affected or potentially impacted individuals and communities.
                    - id: SA-MEASURE_3.2-2
                      name: item
                      class: suggested_action
                      prose: Identify AI actors responsible for tracking emergent risks and inventory methods.
                    - id: SA-MEASURE_3.2-3
                      name: item
                      class: suggested_action
                      prose: 'Determine and document the rate of occurrence and severity level for complex or difficult-to-measure risks when:'
                    - id: SA-MEASURE_3.2-3.1
                      name: item
                      class: suggested_action
                      prose: Prioritizing new measurement approaches for deployment tasks.
                    - id: SA-MEASURE_3.2-3.2
                      name: item
                      class: suggested_action
                      prose: Allocating AI system risk management resources.
                    - id: SA-MEASURE_3.2-3.3
                      name: item
                      class: suggested_action
                      prose: Evaluating AI system improvements.
                    - id: SA-MEASURE_3.2-3.4
                      name: item
                      class: suggested_action
                      prose: Making go/no-go decisions for subsequent system iterations.
                - id: A-MEASURE_3.2
                  name: guidance
                  class: about
                  prose: Risks identified in the Map function may be complex, emerge over time, or difficult to measure. Systematic methods for risk tracking, including novel measurement approaches, can be established as part of regular monitoring and improvement processes.
                - id: D-MEASURE_3.2-1
                  name: guidance
                  class: documentation
                  prose: Who is ultimately responsible for the decisions of the AI and is this person aware of the intended uses and limitations of the analytic?
                - id: D-MEASURE_3.2-2
                  name: guidance
                  class: documentation
                  prose: Who will be responsible for maintaining, re-verifying, monitoring, and updating this AI once deployed?
                - id: D-MEASURE_3.2-3
                  name: guidance
                  class: documentation
                  prose: To what extent does the entity communicate its AI strategic goals and objectives to the community of stakeholders?
                - id: D-MEASURE_3.2-4
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_3.2-5
                  name: guidance
                  class: documentation
                  prose: If anyone believes that the AI no longer meets this ethical framework, who will be responsible for receiving the concern and as appropriate investigating and remediating the issue? Do they have authority to modify, limit, or stop the use of the AI?
            - id: MEASURE_3.3
              class: subcategory
              title: MEASURE 3.3
              props:
                - name: sort-id
                  value: 00004.00003.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#d6c37059-db3e-4d3e-8a92-ce93d9b6b18e'
                  rel: reference
                - href: '#c3939608-3984-402a-abfe-6b70c631cde8'
                  rel: reference
                - href: '#cc25a3ff-0a73-4f4e-a867-a6737ac8e8ee'
                  rel: reference
                - href: '#981a87bb-ad94-4fcb-8f1f-331fff8ffa8c'
                  rel: reference
                - href: '#fae003b6-37f3-4bbf-abd9-b4d7178665a0'
                  rel: reference
                - href: '#42c97349-7288-4c54-afb3-caa80fedf7ab'
                  rel: reference
                - href: '#33c50208-4113-461e-89a1-fd67445b04e0'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#2d03d2fe-8983-49ec-bf65-f48835ada17f'
                  rel: reference
              parts:
                - id: MEASURE_3.3_ovw
                  name: overview
                  prose: Feedback processes for end users and impacted communities to report problems and appeal system outcomes are established and integrated into AI system evaluation metrics.
                - id: SA-MEASURE_3.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_3.3-1
                      name: item
                      class: suggested_action
                      prose: measure efficacy of end user and operator error reporting processes.
                    - id: SA-MEASURE_3.3-2
                      name: item
                      class: suggested_action
                      prose: Categorize and analyze type and rate of end user appeal requests and results.
                    - id: SA-MEASURE_3.3-3
                      name: item
                      class: suggested_action
                      prose: measure feedback activity participation rates and awareness of feedback activity availability.
                    - id: SA-MEASURE_3.3-4
                      name: item
                      class: suggested_action
                      prose: Utilize feedback to analyze measurement approaches and determine subsequent courses of action.
                    - id: SA-MEASURE_3.3-5
                      name: item
                      class: suggested_action
                      prose: Evaluate measurement approaches to determine efficacy for enhancing organizational understanding of real-world impacts.
                    - id: SA-MEASURE_3.3-6
                      name: item
                      class: suggested_action
                      prose: Analyze end user and community feedback in close collaboration with domain experts.
                - id: A-MEASURE_3.3
                  name: guidance
                  class: about
                  prose: Assessing impact is a two-way effort. Many AI system outcomes and impacts may not be visible or recognizable to AI actors across the development and deployment dimensions of the AI lifecycle, and may require direct feedback about system outcomes from the perspective of end users and impacted groups. Feedback can be collected indirectly, via systems that are mechanized to collect errors and other feedback from end users and operators. Metrics and insights developed in this sub-category feed into manage 4.1 and 4.2.
                - id: D-MEASURE_3.3-1
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MEASURE_3.3-2
                  name: guidance
                  class: documentation
                  prose: Did your organization address usability problems and test whether user interfaces served their intended purposes?
                - id: D-MEASURE_3.3-3
                  name: guidance
                  class: documentation
                  prose: How easily accessible and current is the information available to external stakeholders?
                - id: D-MEASURE_3.3-4
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
        - id: MEASURE_4
          class: category
          title: MEASURE 4
          props:
            - name: sort-id
              value: "00004.00004"
          parts:
            - id: MEASURE_4_smt
              name: statement
              prose: Feedback about efficacy of measurement is gathered and assessed.
          controls:
