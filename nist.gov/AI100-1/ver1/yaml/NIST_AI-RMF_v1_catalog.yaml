              parts:
                - id: MANAGE_2.2_ovw
                  name: overview
                  prose: Mechanisms are in place and applied to sustain the value of deployed AI systems.
                - id: SA-MANAGE_2.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_2.2-1
                      name: item
                      class: suggested_action
                      prose: 'Establish risk controls considering trustworthiness characteristics, including:'
                    - id: SA-MANAGE_2.2-2
                      name: item
                      class: suggested_action
                      prose: Data management, quality, and privacy (e.g., minimization, rectification or deletion requests) controls as part of organizational data governance policies.
                    - id: SA-MANAGE_2.2-3
                      name: item
                      class: suggested_action
                      prose: Machine learning and end-point security countermeasures (e.g., robust models, differential privacy, authentication, throttling).
                    - id: SA-MANAGE_2.2-4
                      name: item
                      class: suggested_action
                      prose: Business rules that augment, limit or restrict AI system outputs within certain contexts.
                    - id: SA-MANAGE_2.2-5
                      name: item
                      class: suggested_action
                      prose: 'Establish risk controls considering trustworthiness characteristics, including:'
                    - id: SA-MANAGE_2.2-6
                      name: item
                      class: suggested_action
                      prose: Data management, quality, and privacy (e.g., minimization, rectification or deletion requests) controls as part of organizational data governance policies.
                    - id: SA-MANAGE_2.2-7
                      name: item
                      class: suggested_action
                      prose: Machine learning and end-point security countermeasures (e.g., robust models, differential privacy, authentication, throttling).
                    - id: SA-MANAGE_2.2-8
                      name: item
                      class: suggested_action
                      prose: Business rules that augment, limit or restrict AI system outputs within certain contexts.
                    - id: SA-MANAGE_2.2-9
                      name: item
                      class: suggested_action
                      prose: Utilizing domain expertise related to deployment context for continuous improvement and TEVV across the AI lifecycle.
                    - id: SA-MANAGE_2.2-10
                      name: item
                      class: suggested_action
                      prose: Development and regular tracking of human-AI teaming configurations.
                    - id: SA-MANAGE_2.2-11
                      name: item
                      class: suggested_action
                      prose: Model assessment and test, evaluation, validation and verification(TEVV) protocols.
                    - id: SA-MANAGE_2.2-12
                      name: item
                      class: suggested_action
                      prose: Use of standardized documentation and transparency mechanisms.
                    - id: SA-MANAGE_2.2-13
                      name: item
                      class: suggested_action
                      prose: Software quality assurance practices across AI lifecycle.
                    - id: SA-MANAGE_2.2-14
                      name: item
                      class: suggested_action
                      prose: Mechanisms to explore system limitations and avoid past failed designs or deployments.
                    - id: SA-MANAGE_2.2-15
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms to capture feedback from system end users and potentially impacted groups.
                    - id: SA-MANAGE_2.2-16
                      name: item
                      class: suggested_action
                      prose: Review insurance policies, warranties, or contracts for legal or oversight requirements for risk transfer procedures.
                    - id: SA-MANAGE_2.2-17
                      name: item
                      class: suggested_action
                      prose: Document risk tolerance decisions and risk acceptance procedures.
                - id: A-MANAGE_2.2
                  name: guidance
                  class: about
                  prose: System performance and trustworthiness may evolve and shift over time, once an AI system is deployed and put into operation. This phenomenon, generally known as drift, can degrade the value of the AI system to the organization and increase the likelihood of negative impacts. Regular monitoring of AI systems’ performance and trustworthiness enhances organizations’ ability to detect and respond to drift, and thus sustain an AI system's value once deployed. Processes and mechanisms for regular monitoring address system functionality and behavior - as well as impacts and alignment with the values and norms within the specific context of use. For example, considerations regarding impacts on personal or public safety or privacy may include limiting high speeds when operating autonomous vehicles or restricting illicit content recommendations for minors. Regular monitoring activities can enable organizations to systematically and proactively identify emergent risks and respond according to established protocols and metrics. Options for organizational responses include 1) avoiding the risk, 2) accepting the risk, 3) mitigating the risk, or4) transferring the risk. Each of these actions require planning and resources. Organizations are encouraged to establish risk management protocols with consideration of the trustworthiness characteristics, the deployment context, and real-world impacts.
                - id: D-MANAGE_2.2-1
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MANAGE_2.2-2
                  name: guidance
                  class: documentation
                  prose: Could the AI system expose people to harm or negative impacts? What was done to mitigate or reduce the potential for harm?
                - id: D-MANAGE_2.2-3
                  name: guidance
                  class: documentation
                  prose: How will the accountable human(s) address changes in accuracy and precision due to either an adversary’s attempts to disrupt the AI or unrelated changes in the operational or business environment?
            - id: MANAGE_2.3
              class: subcategory
              title: MANAGE 2.3
              props:
                - name: sort-id
                  value: 00002.00002.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#ba9efd8f-547e-47c6-a607-6c3a51e0961a'
                  rel: reference
                - href: '#6c90e20f-9000-4819-bc15-df7cda133ed1'
                  rel: reference
                - href: '#c2e48105-51c8-484c-b3ac-ad04fc204ab0'
                  rel: reference
                - href: '#6a912f3f-7ea9-440e-8e1c-44d2b356d65c'
                  rel: reference
                - href: '#f30ddf15-5a33-4ae5-91d6-2db9303953d9'
                  rel: reference
                - href: '#53a3c21e-1611-437f-a227-36d84b9ab85f'
                  rel: reference
              parts:
                - id: MANAGE_2.3_ovw
                  name: overview
                  prose: Procedures are followed to respond to and recover from a previously unknown risk when it is identified.
                - id: SA-MANAGE_2.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_2.3-1
                      name: item
                      class: suggested_action
                      prose: Protocols, resources, and metrics are in place for continual monitoring of AI systems’ performance, trustworthiness, and alignment with contextual norms and values.
                    - id: SA-MANAGE_2.3-2
                      name: item
                      class: suggested_action
                      prose: Establish and regularly review treatment and response plans for incidents, negative impacts, or outcomes.
                    - id: SA-MANAGE_2.3-3
                      name: item
                      class: suggested_action
                      prose: Establish and maintain procedures to regularly monitor system components for drift, decontextualization, or other AI system behavior factors,
                    - id: SA-MANAGE_2.3-4
                      name: item
                      class: suggested_action
                      prose: Establish and maintain procedures for capturing feedback about negative impacts.
                    - id: SA-MANAGE_2.3-5
                      name: item
                      class: suggested_action
                      prose: Verify contingency processes to handle any negative impacts associated with mission-critical AI systems, and to deactivate systems.
                    - id: SA-MANAGE_2.3-6
                      name: item
                      class: suggested_action
                      prose: Enable preventive and post-hoc exploration of AI system limitations by relevant AI actor groups.
                    - id: SA-MANAGE_2.3-7
                      name: item
                      class: suggested_action
                      prose: Decommission systems that exceed risk tolerances.
                - id: A-MANAGE_2.3
                  name: guidance
                  class: about
                  prose: AI systems – like any technology – can demonstrate non-functionality or failure or unexpected and unusual behavior. They also can be subject to attacks, incidents, or other misuse or abuse – which their sources are not always known a-priori. Organizations can establish, document, communicate and maintain treatment procedures to recognize and counter, mitigate and manage risks that were not previously identified.
                - id: D-MANAGE_2.3-1
                  name: guidance
                  class: documentation
                  prose: Who will be responsible for maintaining, re-verifying, monitoring, and updating this AI once deployed?
                - id: D-MANAGE_2.3-2
                  name: guidance
                  class: documentation
                  prose: Are the responsibilities of the personnel involved in the various AI governance processes clearly defined? (Including responsibilities to decommission the AI system.)
                - id: D-MANAGE_2.3-3
                  name: guidance
                  class: documentation
                  prose: What processes exist for data generation, acquisition/collection, ingestion, staging/storage, transformations, security, maintenance, and dissemination?
                - id: D-MANAGE_2.3-4
                  name: guidance
                  class: documentation
                  prose: How will the appropriate performance metrics, such as accuracy, of the AI be monitored after the AI is deployed?
            - id: MANAGE_2.4
              class: subcategory
              title: MANAGE 2.4
              props:
                - name: sort-id
                  value: 00002.00002.00004
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#b80ae6a5-0da4-4e78-b5f1-1d6dcc7c4d27'
                  rel: reference
                - href: '#957aa26c-41db-4be5-9210-3f2e0b8329ac'
                  rel: reference
              parts:
                - id: MANAGE_2.4_ovw
                  name: overview
                  prose: Mechanisms are in place and applied, responsibilities are assigned and understood to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use.
                - id: SA-MANAGE_2.4
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_2.4-1
                      name: item
                      class: suggested_action
                      prose: Regularly review established procedures for AI system bypass actions, including plans for redundant or backup systems to ensure continuity of operational and/or business functionality.
                    - id: SA-MANAGE_2.4-2
                      name: item
                      class: suggested_action
                      prose: Regularly review Identify system incident thresholds for activating bypass or deactivation responses.
                    - id: SA-MANAGE_2.4-3
                      name: item
                      class: suggested_action
                      prose: Apply change management processes to understand the upstream and downstream consequences of bypassing or deactivating an AI system or AI system components.
                    - id: SA-MANAGE_2.4-4
                      name: item
                      class: suggested_action
                      prose: Apply protocols, resources and metrics for decisions to supersede, bypass or deactivate AI systems or AI system components.
                    - id: SA-MANAGE_2.4-5
                      name: item
                      class: suggested_action
                      prose: Preserve materials for forensic, regulatory, and legal review.
                    - id: SA-MANAGE_2.4-6
                      name: item
                      class: suggested_action
                      prose: Conduct internal root cause analysis and process reviews of bypass or deactivation events.
                    - id: SA-MANAGE_2.4-7
                      name: item
                      class: suggested_action
                      prose: Decommission and preserve system components that cannot be updated to meet criteria for redeployment.
                    - id: SA-MANAGE_2.4-8
                      name: item
                      class: suggested_action
                      prose: Establish criteria for redeploying updated system components, in consideration of trustworthy characteristics.
                - id: A-MANAGE_2.4
                  name: guidance
                  class: about
                  prose: 'Performance inconsistent with intended use does not always increase risk or lead to negative impacts. Rigorous TEVV practices are useful for protecting against negative impacts regardless of intended use. When negative impacts do arise, superseding (bypassing), disengaging, or deactivating/decommissioning a model, AI system component(s), or the entire AI system may be necessary, such as when: a system reaches the end of its lifetime detected or identified risks exceed tolerance thresholds adequate system mitigation actions are beyond the organization’s capacity feasible system mitigation actions do not meet regulatory, legal, norms or standards impending risk is detected during continual monitoring, for which feasible mitigation cannot be identified or implemented in a timely fashion Safely removing AI systems from operation, either temporarily or permanently, under these scenarios requires standard protocols that minimize operational disruption and downstream negative impacts. Protocols can involve redundant or backup systems that are developed in alignment with established system governance policies (see GOVERN 1.7), regulatory compliance, legal frameworks, business requirements and norms and l standards within the application context of use. Decision thresholds and metrics for actions to bypass or deactivate system components are part of continual monitoring procedures. Incidents that result in a bypass/deactivate decision require documentation and review to understand root causes, impacts, and potential opportunities for mitigation and redeployment. Organizations are encouraged to develop risk and change management protocols that consider and anticipate upstream and downstream consequences of both temporary and/or permanent decommissioning, and provide contingency options.'
                - id: D-MANAGE_2.4-1
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-MANAGE_2.4-2
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-MANAGE_2.4-3
                  name: guidance
                  class: documentation
                  prose: What testing, if any, has the entity conducted on the AI system to identify errors and limitations (i.e., adversarial or stress testing)?
                - id: D-MANAGE_2.4-4
                  name: guidance
                  class: documentation
                  prose: To what extent does the entity have established procedures for retiring the AI system, if it is no longer needed?
                - id: D-MANAGE_2.4-5
                  name: guidance
                  class: documentation
                  prose: How did the entity use assessments and/or evaluations to determine if the system can be scaled up, continue, or be decommissioned?
        - id: MANAGE_3
          class: category
          title: MANAGE 3
          props:
            - name: sort-id
              value: "00002.00003"
          parts:
            - id: MANAGE_3_smt
              name: statement
              prose: AI risks and benefits from third-party entities are managed.
          controls:
            - id: MANAGE_3.1
              class: subcategory
              title: MANAGE 3.1
              props:
                - name: sort-id
                  value: 00002.00003.00001
              links:
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#eed92d1a-3479-4d3b-a106-a5771c0b5af3'
                  rel: reference
              parts:
                - id: MANAGE_3.1_ovw
                  name: overview
                  prose: AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented.
                - id: SA-MANAGE_3.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_3.1-1
                      name: item
                      class: suggested_action
                      prose: Have legal requirements been addressed?
                    - id: SA-MANAGE_3.1-2
                      name: item
                      class: suggested_action
                      prose: Apply organizational risk tolerance to third-party AI systems.
                    - id: SA-MANAGE_3.1-3
                      name: item
                      class: suggested_action
                      prose: Apply and document organizational risk management plans and practices to third-party AI technology, personnel, or other resources.
                    - id: SA-MANAGE_3.1-4
                      name: item
                      class: suggested_action
                      prose: Identify and maintain documentation for third-party AI systems and components.
                    - id: SA-MANAGE_3.1-5
                      name: item
                      class: suggested_action
                      prose: Establish testing, evaluation, validation and verification processes for third-party AI systems which address the needs for transparency without exposing proprietary algorithms.
                    - id: SA-MANAGE_3.1-6
                      name: item
                      class: suggested_action
                      prose: Establish processes to identify beneficial use and risk indicators in third-party systems or components, such as inconsistent software release schedule, sparse documentation, and incomplete software change management (e.g., lack of forward or backward compatibility).
                    - id: SA-MANAGE_3.1-7
                      name: item
                      class: suggested_action
                      prose: Organizations can establish processes for third parties to report known and potential vulnerabilities, risks or biases in supplied resources.
                    - id: SA-MANAGE_3.1-8
                      name: item
                      class: suggested_action
                      prose: Verify contingency processes for handling negative impacts associated with mission-critical third-party AI systems.
                    - id: SA-MANAGE_3.1-9
                      name: item
                      class: suggested_action
                      prose: Monitor third-party AI systems for potential negative impacts and risks associated with trustworthiness characteristics.
                    - id: SA-MANAGE_3.1-10
                      name: item
                      class: suggested_action
                      prose: Decommission third-party systems that exceed risk tolerances.
                - id: A-MANAGE_3.1
                  name: guidance
                  class: about
                  prose: AI systems may depend on external resources and associated processes, including third-party data, software or hardware systems. Third parties’ supplying organizations with components and services, including tools, software, and expertise for AI system design, development, deployment or use can improve efficiency and scalability. It can also increase complexity and opacity, and, in-turn, risk. Documenting third-party technologies, personnel, and resources that were employed can help manage risks. Focusing first and foremost on risks involving physical safety, legal liabilities, regulatory compliance, and negative impacts on individuals, groups, or society is recommended.
                - id: D-MANAGE_3.1-1
                  name: guidance
                  class: documentation
                  prose: If a third party created the AI system or some of its components, how will you ensure a level of explainability or interpretability? Is there documentation?
                - id: D-MANAGE_3.1-2
                  name: guidance
                  class: documentation
                  prose: If your organization obtained datasets from a third party, did your organization assess and manage the risks of using such datasets?
                - id: D-MANAGE_3.1-3
                  name: guidance
                  class: documentation
                  prose: Did you establish a process for third parties (e.g., suppliers, end users, subjects, distributors/vendors or workers) to report potential vulnerabilities, risks or biases in the AI system?
                - id: D-MANAGE_3.1-4
                  name: guidance
                  class: documentation
                  prose: Have legal requirements been addressed?
            - id: MANAGE_3.2
              class: subcategory
              title: MANAGE 3.2
              props:
                - name: sort-id
                  value: 00002.00003.00002
              links:
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#f8de7163-d316-4547-a02f-72167c7d28aa'
                  rel: reference
              parts:
                - id: MANAGE_3.2_ovw
                  name: overview
                  prose: Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance.
                - id: SA-MANAGE_3.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_3.2-1
                      name: item
                      class: suggested_action
                      prose: Identify pre-trained models within AI system inventory for risk tracking.
                    - id: SA-MANAGE_3.2-2
                      name: item
                      class: suggested_action
                      prose: Establish processes to independently and continually monitor performance and trustworthiness of pre-trained models, and as part of third-party risk tracking.
                    - id: SA-MANAGE_3.2-3
                      name: item
                      class: suggested_action
                      prose: Monitor performance and trustworthiness of AI system components connected to pre-trained models, and as part of third-party risk tracking.
                    - id: SA-MANAGE_3.2-4
                      name: item
                      class: suggested_action
                      prose: Identify, document and remediate risks arising from AI system components and pre-trained models per organizational risk management procedures, and as part of third-party risk tracking.
                    - id: SA-MANAGE_3.2-5
                      name: item
                      class: suggested_action
                      prose: Decommission AI system components and pre-trained models which exceed risk tolerances, and as part of third-party risk tracking.
                - id: A-MANAGE_3.2
                  name: guidance
                  class: about
                  prose: A common approach in AI development is transfer learning, whereby an existing pre-trained model is adapted for use in a different, but related application. AI actors in development tasks often use pre-trained models from third-party entities for tasks such as image classification, language prediction, and entity recognition, because the resources to build such models may not be readily available to most organizations. Pre-trained models are typically trained to address various classification or prediction problems, using exceedingly large datasets and computationally intensive resources. The use of pre-trained models can make it difficult to anticipate negative system outcomes or impacts. Lack of documentation or transparency tools increases the difficulty and general complexity when deploying pre-trained models and hinders root cause analyses.
                - id: D-MANAGE_3.2-1
                  name: guidance
                  class: documentation
                  prose: How has the entity documented the AI system’s data provenance, including sources, origins, transformations, augmentations, labels, dependencies, constraints, and metadata?
                - id: D-MANAGE_3.2-2
                  name: guidance
                  class: documentation
                  prose: Does this dataset collection/processing procedure achieve the motivation for creating the dataset stated in the first section of this datasheet?
                - id: D-MANAGE_3.2-3
                  name: guidance
                  class: documentation
                  prose: How does the entity ensure that the data collected are adequate, relevant, and not excessive in relation to the intended purpose? If the dataset becomes obsolete how will this be communicated?
        - id: MANAGE_4
          class: category
          title: MANAGE 4
          props:
            - name: sort-id
              value: "00002.00004"
          parts:
            - id: MANAGE_4_smt
              name: statement
              prose: Risk treatments including response and recovery, and communication plans to the identified and measured AI risks are documented and monitored regularly.
          controls:
            - id: MANAGE_4.1
              class: subcategory
              title: MANAGE 4.1
              props:
                - name: sort-id
                  value: 00002.00004.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#984312cb-537f-4183-b6a9-2c26aaee664f'
                  rel: reference
              parts:
                - id: MANAGE_4.1_ovw
                  name: overview
                  prose: Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management.
                - id: SA-MANAGE_4.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_4.1-1
                      name: item
                      class: suggested_action
                      prose: Establish and maintain procedures to monitor AI system performance for risks and negative and positive impacts associated with trustworthiness characteristics.
                    - id: SA-MANAGE_4.1-2
                      name: item
                      class: suggested_action
                      prose: Perform post-deployment TEVV tasks to evaluate AI system validity and reliability, bias and fairness, privacy, and security and resilience.
                    - id: SA-MANAGE_4.1-3
                      name: item
                      class: suggested_action
                      prose: Evaluate AI system trustworthiness in conditions similar to deployment context of use, and prior to deployment.
                    - id: SA-MANAGE_4.1-4
                      name: item
                      class: suggested_action
                      prose: Establish and implement red-teaming exercises at a prescribed cadence and evaluate their efficacy.
                    - id: SA-MANAGE_4.1-5
                      name: item
                      class: suggested_action
                      prose: Establish procedures for tracking dataset modifications such as data deletion or rectification requests.
                    - id: SA-MANAGE_4.1-6
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms for regular communication and feedback between relevant AI actors and internal or external stakeholders to capture information about system performance, trustworthiness and impact.
                    - id: SA-MANAGE_4.1-7
                      name: item
                      class: suggested_action
                      prose: Share information about errors, near-misses, and attack patterns with incident databases, other organizations with similar systems, and system users and stakeholders.
                    - id: SA-MANAGE_4.1-8
                      name: item
                      class: suggested_action
                      prose: Respond to and document detected or reported negative impacts or issues in AI system performance and trustworthiness.
                    - id: SA-MANAGE_4.1-9
                      name: item
                      class: suggested_action
                      prose: Decommission systems that exceed establish risk tolerances.
                - id: A-MANAGE_4.1
                  name: guidance
                  class: about
                  prose: AI system performance and trustworthiness can change due to a variety of factors. Regular AI system monitoring can help deployers identify performance degradations, adversarial attacks, unexpected and unusual behavior, near-misses, and impacts. Including pre- and post-deployment external feedback about AI system performance can enhance organizational awareness about positive and negative impacts, and reduce the time to respond to risks and harms.
                - id: D-MANAGE_4.1-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the post-deployment AI system’s testing methodology, metrics, and performance outcomes?
                - id: D-MANAGE_4.1-2
                  name: guidance
                  class: documentation
                  prose: How easily accessible and current is the information available to external stakeholders?
            - id: MANAGE_4.2
              class: subcategory
              title: MANAGE 4.2
              props:
                - name: sort-id
                  value: 00002.00004.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#924aa810-02df-49ed-89bf-d60b29d62543'
                  rel: reference
                - href: '#a42175dc-4784-4347-8349-5938212dfb4c'
                  rel: reference
                - href: '#f37a4c68-386f-4d65-8250-207d97666ca0'
                  rel: reference
              parts:
                - id: MANAGE_4.2_ovw
                  name: overview
                  prose: Measurable activities for continual improvements are integrated into AI system updates and include regular engagement with interested parties, including relevant AI actors.
                - id: SA-MANAGE_4.2
                  name: statement
                  class: suggested_action
                - id: A-MANAGE_4.2-1
                  name: guidance
                  class: about
                  prose: Regular monitoring processes enable system updates to enhance performance and functionality in accordance with regulatory and legal frameworks, and organizational and contextual values and norms. These processes also facilitate analyses of root causes, system degradation, drift, near-misses, and failures, and incident response and documentation. AI actors across the lifecycle have many opportunities to capture and incorporate external feedback about system performance, limitations, and impacts, and implement continuous improvements. Improvements may not always be to model pipeline or system processes, and may instead be based on metrics beyond accuracy or other quality performance measures. In these cases, improvements may entail adaptations to business or organizational procedures or practices. Organizations are encouraged to develop improvements that will maintain traceability and transparency for developers, end users, auditors, and relevant AI actors.
                - id: A-MANAGE_4.2-2
                  name: guidance
                  class: about
                  prose: Integrate trustworthiness characteristics into protocols and metrics used for continual improvement.
                - id: A-MANAGE_4.2-3
                  name: guidance
                  class: about
                  prose: Establish processes for evaluating and integrating feedback into AI system improvements.
                - id: A-MANAGE_4.2-4
                  name: guidance
                  class: about
                  prose: Assess and evaluate alignment of proposed improvements with relevant regulatory and legal frameworks.
                - id: A-MANAGE_4.2-5
                  name: guidance
                  class: about
                  prose: Assess and evaluate alignment of proposed improvements connected to the values and norms within the context of use.
                - id: A-MANAGE_4.2-6
                  name: guidance
                  class: about
                  prose: Document the basis for decisions made relative to tradeoffs between trustworthy characteristics, system risks, and system opportunities.
                - id: D-MANAGE_4.2-1
                  name: guidance
                  class: documentation
                  prose: How will user and other forms of stakeholder engagement be integrated into the model development process and regular performance review once deployed?
                - id: D-MANAGE_4.2-2
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MANAGE_4.2-3
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity defined and documented the regulatory environment—including minimum requirements in laws and regulations?
            - id: MANAGE_4.3
              class: subcategory
              title: MANAGE 4.3
              props:
                - name: sort-id
                  value: 00002.00004.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#86cf33d4-fb84-497d-9bd2-7e73b73c65e0'
                  rel: reference
                - href: '#dd496287-e047-4bfc-8d67-69277a76be0d'
                  rel: reference
                - href: '#8aa34995-f799-43d8-ac18-5af42f33d34e'
                  rel: reference
              parts:
                - id: MANAGE_4.3_ovw
                  name: overview
                  prose: Incidents and errors are communicated to relevant AI actors including affected communities. Processes for tracking, responding to, and recovering from incidents and errors are followed and documented.
                - id: SA-MANAGE_4.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_4.3-1
                      name: item
                      class: suggested_action
                      prose: Establish procedures to regularly share information about errors, incidents and negative impacts with relevant stakeholders, operators, practitioners and users, and impacted parties.
                    - id: SA-MANAGE_4.3-2
                      name: item
                      class: suggested_action
                      prose: Maintain a database of reported errors, near-misses, incidents and negative impacts including date reported, number of reports, assessment of impact and severity, and responses.
                    - id: SA-MANAGE_4.3-3
                      name: item
                      class: suggested_action
                      prose: Maintain a database of system changes, reason for change, and details of how the change was made, tested and deployed.
                    - id: SA-MANAGE_4.3-4
                      name: item
                      class: suggested_action
                      prose: Maintain version history information and metadata to enable continuous improvement processes.
                    - id: SA-MANAGE_4.3-5
                      name: item
                      class: suggested_action
                      prose: Verify that relevant AI actors responsible for identifying complex or emergent risks are properly resourced and empowered.
                - id: A-MANAGE_4.3
                  name: guidance
                  class: about
                  prose: 'Regularly documenting an accurate and transparent account of identified and reported errors can enhance AI risk management activities., Examples include: how errors were identified, incidents related to the error, whether the error has been repaired, and how repairs can be distributed to all impacted stakeholders and users.'
                - id: D-MANAGE_4.3-1
                  name: guidance
                  class: documentation
                  prose: What corrective actions has the entity taken to enhance the quality, accuracy, reliability, and representativeness of the data?
                - id: D-MANAGE_4.3-2
                  name: guidance
                  class: documentation
                  prose: To what extent does the entity communicate its AI strategic goals and objectives to the community of stakeholders? How easily accessible and current is the information available to external stakeholders?
                - id: D-MANAGE_4.3-3
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
    - id: MAP
      class: function
      title: MAP
      props:
        - name: sort-id
          value: "00003"
      parts:
        - id: MAP_ovw
          name: overview
          prose: Context is recognized and risks related to context are identified.
      controls:
