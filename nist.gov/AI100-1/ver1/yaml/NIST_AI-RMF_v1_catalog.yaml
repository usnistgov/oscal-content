              parts:
                - id: MEASURE_4.1_ovw
                  name: overview
                  prose: measurement approaches for identifying AI risks are connected to deployment context(s) and informed through consultation with domain experts and other end users. Approaches are documented.
                - id: SA-MEASURE_4.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_4.1-1
                      name: item
                      class: suggested_action
                      prose: 'Support mechanisms for capturing feedback from system end users(including domain experts, operators, and practitioners). Successful approaches are:'
                    - id: SA-MEASURE_4.1-1.1
                      name: item
                      class: suggested_action
                      prose: conducted in settings where end users are able to openly share their doubts and insights about AI system output, and in connection to their specific context of use (including setting and task-specific lines of inquiry)
                    - id: SA-MEASURE_4.1-1.2
                      name: item
                      class: suggested_action
                      prose: developed and implemented by human-factors and socio-technical domain experts and researchers
                    - id: SA-MEASURE_4.1-1.3
                      name: item
                      class: suggested_action
                      prose: designed to ensure control of interviewer and end user subjectivity and biases
                    - id: SA-MEASURE_4.1-2
                      name: item
                      class: suggested_action
                      prose: 'Identify and document approaches:'
                    - id: SA-MEASURE_4.1-2.1
                      name: item
                      class: suggested_action
                      prose: for evaluating and integrating elicited feedback from system end users
                    - id: SA-MEASURE_4.1-2.2
                      name: item
                      class: suggested_action
                      prose: in collaboration with human-factors and socio-technical domain experts,
                    - id: SA-MEASURE_4.1-2.3
                      name: item
                      class: suggested_action
                      prose: to actively inform a process of continual improvement.
                    - id: SA-MEASURE_4.1-3
                      name: item
                      class: suggested_action
                      prose: Evaluate feedback from end users alongside evaluated feedback from impacted communities (measure 3.3).
                    - id: SA-MEASURE_4.1-4
                      name: item
                      class: suggested_action
                      prose: Utilize end user feedback to investigate how selected metrics and measurement approaches interact with organizational and operational contexts.
                    - id: SA-MEASURE_4.1-5
                      name: item
                      class: suggested_action
                      prose: Analyze and document system-internal measurement processes in comparison to collected end user feedback.
                    - id: SA-MEASURE_4.1-6
                      name: item
                      class: suggested_action
                      prose: Identify and implement approaches to measure effectiveness and satisfaction with end user elicitation techniques, and document results.
                - id: A-MEASURE_4.1
                  name: guidance
                  class: about
                  prose: AI Actors carrying out TEVV tasks may have difficulty evaluating impacts within the system context of use. AI system risks and impacts are often best described by end users and others who may be affected by output and subsequent decisions. AI Actors can elicit feedback from impacted individuals and communities via participatory engagement processes established in Govern 5.1 and 5.2, and carried out in Map 1.6, 5.1, and 5.2. Activities described in the measure function enable AI actors to evaluate feedback from impacted individuals and communities. To increase awareness of insights, feedback can be evaluated in close collaboration with AI actors responsible for impact assessment, human-factors, and governance and oversight tasks, as well as with other socio-technical domain experts and researchers. To gain broader expertise for interpreting evaluation outcomes, organizations may consider collaborating with advocacy groups and civil society organizations. Insights based on this type of analysis can inform TEVV-based decisions about metrics and related courses of action.
                - id: D-MEASURE_4.1-1
                  name: guidance
                  class: documentation
                  prose: Did your organization address usability problems and test whether user interfaces served their intended purposes?
                - id: D-MEASURE_4.1-2
                  name: guidance
                  class: documentation
                  prose: How will user and peer engagement be integrated into the model development process and periodic performance review once deployed?
                - id: D-MEASURE_4.1-3
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MEASURE_4.1-4
                  name: guidance
                  class: documentation
                  prose: To what extent are the established procedures effective in mitigating bias, inequity, and other concerns resulting from the system?
            - id: MEASURE_4.2
              class: subcategory
              title: MEASURE 4.2
              props:
                - name: sort-id
