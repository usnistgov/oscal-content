                - href: '#9b428b8c-5268-4627-9723-25737362c53d'
                  rel: reference
                - href: '#936cd2ef-328b-4313-9bb2-e4b18647ee9a'
                  rel: reference
              parts:
                - id: GOVERN_1.2_ovw
                  name: overview
                  prose: The characteristics of trustworthy AI are integrated into organizational policies, processes, and procedures.
                - id: SA-GOVERN_1.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.2-1
                      name: item
                      class: suggested_action
                      prose: Define key terms and concepts related to AI systems and the scope of their purposes and intended uses.
                    - id: SA-GOVERN_1.2-2
                      name: item
                      class: suggested_action
                      prose: Connect AI governance to existing organizational governance and risk controls.
                    - id: SA-GOVERN_1.2-3
                      name: item
                      class: suggested_action
                      prose: Align to broader data governance policies and practices, particularly the use of sensitive or otherwise risky data.
                    - id: SA-GOVERN_1.2-4
                      name: item
                      class: suggested_action
                      prose: Detail standards for experimental design, data quality, and model training.
                    - id: SA-GOVERN_1.2-5
                      name: item
                      class: suggested_action
                      prose: Outline and document risk mapping and measurement processes and standards.
                    - id: SA-GOVERN_1.2-6
                      name: item
                      class: suggested_action
                      prose: Detail model testing and validation processes.
                    - id: SA-GOVERN_1.2-7
                      name: item
                      class: suggested_action
                      prose: Detail review processes for legal and risk functions.
                    - id: SA-GOVERN_1.2-8
                      name: item
                      class: suggested_action
                      prose: Establish the frequency of and detail for monitoring, auditing and review processes.
                    - id: SA-GOVERN_1.2-9
                      name: item
                      class: suggested_action
                      prose: Outline change management requirements.
                    - id: SA-GOVERN_1.2-10
                      name: item
                      class: suggested_action
                      prose: Outline processes for internal and external stakeholder engagement.
                    - id: SA-GOVERN_1.2-11
                      name: item
                      class: suggested_action
                      prose: Establish whistleblower policies to facilitate reporting of serious AI system concerns.
                    - id: SA-GOVERN_1.2-12
                      name: item
                      class: suggested_action
                      prose: Detail and test incident response plans.
                    - id: SA-GOVERN_1.2-13
                      name: item
                      class: suggested_action
                      prose: Verify that formal AI risk management policies align to existing legal standards, and industry best practices and norms.
                    - id: SA-GOVERN_1.2-14
                      name: item
                      class: suggested_action
                      prose: Establish AI risk management policies that broadly align to AI system trustworthy characteristics.
                    - id: SA-GOVERN_1.2-15
                      name: item
                      class: suggested_action
                      prose: Verify that formal AI risk management policies include currently deployed and third-party AI systems.
                - id: A-GOVERN_1.2
                  name: guidance
                  class: about
                  prose: Policies, processes, and procedures are central components of effective AI risk management and fundamental to individual and organizational accountability. All stakeholders benefit from policies, processes, and procedures which require preventing harm by design and default. Organizational policies and procedures will vary based on available resources and risk profiles but can help systematize AI actor roles and responsibilities throughout the AI lifecycle. Without such policies, risk management can be subjective across the organization, and exacerbate rather than minimize risks over time. Polices, or summaries thereof, are understandable to relevant AI actors. Policies reflect an understanding of the underlying metrics, measurements, and tests that are necessary to support policy and AI system design, development, deployment and use. Lack of clear information about responsibilities and chains of command will limit the effectiveness of risk management.
                - id: D-GOVERN_1.2-1
                  name: guidance
                  class: documentation
                  prose: To what extent do these policies foster public trust and confidence in the use of the AI system?
                - id: D-GOVERN_1.2-2
                  name: guidance
                  class: documentation
                  prose: What policies has the entity developed to ensure the use of the AI system is consistent with its stated values and principles?
                - id: D-GOVERN_1.2-3
                  name: guidance
                  class: documentation
                  prose: What policies and documentation has the entity developed to encourage the use of its AI system as intended?
                - id: D-GOVERN_1.2-4
                  name: guidance
                  class: documentation
                  prose: To what extent are the model outputs consistent with the entity’s values and principles to foster public trust and equity?
            - id: GOVERN_1.3
              class: subcategory
              title: GOVERN 1.3
              props:
                - name: sort-id
                  value: 00001.00001.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#d97c1447-ebc5-40ff-8a8f-65c7829be747'
                  rel: reference
                - href: '#eb301bbf-8cdd-4658-87c8-2d7968b5326e'
                  rel: reference
                - href: '#ad15b47a-bc3e-4c34-89b0-8678ccf6ca28'
                  rel: reference
              parts:
                - id: GOVERN_1.3_ovw
                  name: overview
                  prose: Processes and procedures are in place to determine the needed level of risk management activities based on the organization's risk tolerance.
                - id: SA-GOVERN_1.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.3-1
                      name: item
                      class: suggested_action
                      prose: Establish policies to define mechanisms for measuring or understanding an AI system’s potential impacts, e.g., via regular impact assessments at key stages in the AI lifecycle, connected to system impacts and frequency of system updates.
                    - id: SA-GOVERN_1.3-2
                      name: item
                      class: suggested_action
                      prose: Establish policies to define mechanisms for measuring or understanding the likelihood of an AI system’s impacts and their magnitude at key stages in the AI lifecycle.
                    - id: SA-GOVERN_1.3-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that define assessment scales for measuring potential AI system impact. Scales may be qualitative, such as red-amber-green (RAG), or may entail simulations or econometric approaches.
                    - id: SA-GOVERN_1.3-4
                      name: item
                      class: suggested_action
                      prose: Establish policies for assigning an overall risk measurement approach for an AI system, or its important components, e.g., via multiplication or combination of a mapped risk’s impact and likelihood (risk ˜ impact x likelihood).
                    - id: SA-GOVERN_1.3-5
                      name: item
                      class: suggested_action
                      prose: Establish policies to assign systems to uniform risk scales that are valid across the organization’s AI portfolio (e.g., documentation templates) and acknowledge risk tolerance and risk levels may change over the lifecycle of an AI system.
                - id: A-GOVERN_1.3
                  name: guidance
                  class: about
                  prose: Risk management resources are finite in any organization. Adequate AI governance policies delineate the mapping, measurement, and prioritization of risks to allocate resources toward the most material issues for an AI system to ensure effective risk management. Policies may specify systematic processes for assigning mapped and measured risks to standardized risk scales. AI risk tolerances range from negligible to critical – from, respectively, almost no risk to risks that can result in irredeemable human, reputational, financial, or environmental losses. Risk tolerance rating policies consider different sources of risk, (e.g., financial, operational, safety and wellbeing, business, reputational, or model risks). A typical risk measurement approach entails the multiplication, or qualitative combination, of measured or estimated impact and likelihood of impacts into a risk score (risk ˜ impact x likelihood). This score is then placed on a risk scale. Scales for risk may be qualitative, such as red-amber-green (RAG), or may entail simulations or econometric approaches. Impact assessments are a common tool for understanding the severity of mapped risks. In the most fulsome AI risk management approaches, all models are assigned to a risk level.
                - id: D-GOVERN_1.3-1
                  name: guidance
                  class: documentation
                  prose: How do system performance metrics inform risk tolerance decisions?
                - id: D-GOVERN_1.3-2
                  name: guidance
                  class: documentation
                  prose: What policies has the entity developed to ensure the use of the AI system is consistent with organizational risk tolerance?
                - id: D-GOVERN_1.3-3
                  name: guidance
                  class: documentation
                  prose: How do the entity’s data security and privacy assessments inform risk tolerance decisions?
            - id: GOVERN_1.4
              class: subcategory
              title: GOVERN 1.4
              props:
                - name: sort-id
                  value: 00001.00001.00004
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
