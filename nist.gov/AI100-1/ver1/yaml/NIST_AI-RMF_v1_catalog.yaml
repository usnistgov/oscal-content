                - href: '#e9dd11ac-4b80-406a-8203-f1313d1b9ee9'
                  rel: reference
                - href: '#8b4ec757-6d6a-4eb4-9c2c-c661b77053b6'
                  rel: reference
                - href: '#c551b0eb-c051-431b-bc70-baeb012bbffd'
                  rel: reference
                - href: '#51bf9cae-63b6-4c4a-83ae-282ff9654390'
                  rel: reference
                - href: '#ae58f91b-35a0-4543-a861-6376961d2e2c'
                  rel: reference
                - href: '#3cfa3478-2eab-47ed-8d01-47152ba865e4'
                  rel: reference
                - href: '#17e95970-7549-4e4f-b056-3d944e6c08bf'
                  rel: reference
                - href: '#b40bdb7d-20b8-47dc-9b01-9ce97e5197ef'
                  rel: reference
              parts:
                - id: MEASURE_2.7_ovw
                  name: overview
                  prose: AI system security and resilience – as identified in the MAP function – are evaluated and documented.
                - id: SA-MEASURE_2.7
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.7-1
                      name: item
                      class: suggested_action
                      prose: Establish and track AI system security tests and metrics (e.g., red-teaming activities, frequency and rate of anomalous events, system down-time, incident response times, time-to-bypass, etc.).
                    - id: SA-MEASURE_2.7-2
                      name: item
                      class: suggested_action
                      prose: Use red-team exercises to actively test the system under adversarial or stress conditions, measure system response, assess failure modes or determine if system can return to normal function after an unexpected adverse event.
                    - id: SA-MEASURE_2.7-3
                      name: item
                      class: suggested_action
                      prose: Document red-team exercise results as part of continuous improvement efforts, including the range of security test conditions and results.
                    - id: SA-MEASURE_2.7-4
                      name: item
                      class: suggested_action
                      prose: Use red-teaming exercises to evaluate potential mismatches between claimed and actual system performance.
                    - id: SA-MEASURE_2.7-4.1
                      name: item
                      class: suggested_action
                      prose: Use countermeasures (e.g., authentication, throttling, differential privacy, robust ML approaches) to increase the range of security conditions under which the system is able to return to normal function.
                    - id: SA-MEASURE_2.7-4.2
                      name: item
                      class: suggested_action
                      prose: Modify system security procedures and countermeasures to increase robustness and resilience to attacks in response to testing and events experienced in production.
                    - id: SA-MEASURE_2.7-4.3
                      name: item
                      class: suggested_action
                      prose: Verify that information about errors and attack patterns is shared with incident databases, other organizations with similar systems, and system users and stakeholders (manage-4.1).
                    - id: SA-MEASURE_2.7-4.4
                      name: item
                      class: suggested_action
                      prose: Develop and maintain information sharing practices with AI actors from other organizations to learn from common attacks.
                    - id: SA-MEASURE_2.7-5
                      name: item
                      class: suggested_action
                      prose: Verify that third party AI resources and personnel undergo security audits and screenings. Risk indicators may include failure of third parties to provide relevant security information.
                    - id: SA-MEASURE_2.7-6
                      name: item
                      class: suggested_action
                      prose: Utilize watermarking technologies as a deterrent to data and model extraction attacks.
                - id: A-MEASURE_2.7
                  name: guidance
                  class: about
                  prose: AI systems, as well as the ecosystems in which they are deployed, may be said to be resilient if they can withstand unexpected adverse events or unexpected changes in their environment or use – or if they can maintain their functions and structure in the face of internal and external change and degrade safely and gracefully when this is necessary. Common security concerns relate to adversarial examples, data poisoning, and the exfiltration of models, training data, or other intellectual property through AI system endpoints. AI systems that can maintain confidentiality, integrity, and availability through protection mechanisms that prevent unauthorized access and use may be said to be secure. Security and resilience are related but distinct characteristics. While resilience is the ability to return to normal function after an unexpected adverse event, security includes resilience but also encompasses protocols to avoid, protect against, respond to, or recover from attacks. Resilience relates to robustness and encompasses unexpected or adversarial use (or abuse or misuse) of the model or data.
                - id: D-MEASURE_2.7-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the plan specifically address risks associated with acquisition, procurement of packaged software from vendors, cybersecurity controls, computational infrastructure, data, data science, deployment mechanics, and system failure?
                - id: D-MEASURE_2.7-2
                  name: guidance
                  class: documentation
                  prose: What assessments has the entity conducted on data security and privacy impacts associated with the AI system?
                - id: D-MEASURE_2.7-3
                  name: guidance
                  class: documentation
                  prose: What processes exist for data generation, acquisition/collection, security, maintenance, and dissemination?
                - id: D-MEASURE_2.7-4
                  name: guidance
                  class: documentation
                  prose: What testing, if any, has the entity conducted on the AI system to identify errors and limitations (i.e. adversarial or stress testing)?
                - id: D-MEASURE_2.7-5
                  name: guidance
                  class: documentation
                  prose: If a third party created the AI, how will you ensure a level of explainability or interpretability?
            - id: MEASURE_2.8
              class: subcategory
              title: MEASURE 2.8
              props:
                - name: sort-id
                  value: 00004.00002.00008
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#098d48c3-32fa-4425-b9c7-ffeb377eb04a'
                  rel: reference
                - href: '#6793bb6a-fdd3-4922-924e-44f506a7a16e'
                  rel: reference
                - href: '#c4fa67b8-bad5-453e-8ee1-8f578eb4e3da'
                  rel: reference
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#465852ad-a464-4315-9b5e-d9f231506dd7'
                  rel: reference
                - href: '#2e843fd3-0043-42dc-90e1-3490af0f5047'
                  rel: reference
              parts:
                - id: MEASURE_2.8_ovw
                  name: overview
                  prose: Risks associated with transparency and accountability – as identified in the MAP function – are examined and documented.
                - id: SA-MEASURE_2.8
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.8-1
                      name: item
                      class: suggested_action
                      prose: Instrument the system for measurement and tracking, e.g., by maintaining histories, audit logs and other information that can be used by AI actors to review and evaluate possible sources of error, bias, or vulnerability.
                    - id: SA-MEASURE_2.8-2
                      name: item
                      class: suggested_action
                      prose: Calibrate controls for users in close collaboration with experts in user interaction and user experience (UI/UX), human computer interaction(HCI), and/or human-AI teaming.
                    - id: SA-MEASURE_2.8-3
                      name: item
                      class: suggested_action
                      prose: Test provided explanations for calibration with different audiences including operators, end users, decision makers and decision subjects(individuals for whom decisions are being made), and to enable recourse for consequential system decisions that affect end users or subjects.
                    - id: SA-MEASURE_2.8-4
                      name: item
                      class: suggested_action
                      prose: 'measure and document human oversight of AI systems:'
                    - id: SA-MEASURE_2.8-4.1
                      name: item
                      class: suggested_action
                      prose: Document the degree of oversight that is provided by specified AI actors regarding AI system output.
                    - id: SA-MEASURE_2.8-4.2
                      name: item
                      class: suggested_action
                      prose: Maintain statistics about downstream actions by end users and operators such as system overrides.
                    - id: SA-MEASURE_2.8-4.3
                      name: item
                      class: suggested_action
                      prose: Maintain statistics about and document reported errors or complaints, time to respond, and response types.
                    - id: SA-MEASURE_2.8-4.4
                      name: item
                      class: suggested_action
                      prose: Maintain and report statistics about adjudication activities.
                    - id: SA-MEASURE_2.8-5
                      name: item
                      class: suggested_action
                      prose: Track, document, and measure organizational accountability regarding AI systems via policy exceptions and escalations, and document “go \"and “no/go” decisions made by accountable parties.
                    - id: SA-MEASURE_2.8-6
                      name: item
                      class: suggested_action
                      prose: 'Track and audit the effectiveness of organizational mechanisms related to AI risk management, including:'
                    - id: SA-MEASURE_2.8-6.1
                      name: item
                      class: suggested_action
                      prose: Lines of communication between AI actors, executive leadership, users and impacted communities.
                    - id: SA-MEASURE_2.8-6.2
                      name: item
                      class: suggested_action
                      prose: Roles and responsibilities for AI actors and executive leadership.
                    - id: SA-MEASURE_2.8-6.3
                      name: item
                      class: suggested_action
                      prose: Organizational accountability roles, e.g., chief model risk officers, AI oversight committees, responsible or ethical AI directors, etc.
                - id: A-MEASURE_2.8
                  name: guidance
                  class: about
                  prose: Transparency enables meaningful visibility into entire AI pipelines, workflows, processes or organizations and decreases information asymmetry between AI developers and operators and other AI Actors and impacted communities. Transparency is a central element of effective AI risk management that enables insight into how an AI system is working, and the ability to address risks if and when they emerge. The ability for system users, individuals, or impacted communities to seek redress for incorrect or problematic AI system outcomes is one control for transparency and accountability. Higher level recourse processes are typically enabled by lower level implementation efforts directed at explainability and interpretability functionality. See measure 2.9. Transparency and accountability across organizations and processes is crucial to reducing AI risks. Accountable leadership – whether individuals or groups – and transparent roles, responsibilities, and lines of communication foster and incentivize quality assurance and risk management activities within organizations. Lack of transparency complicates measurement of trustworthiness and whether AI systems or organizations are subject to effects of various individual and group biases and design blindspots and could lead to diminished user, organizational and community trust, and decreased overall system value. Enstating accountable and transparent organizational structures along with documenting system risks can enable system improvement and risk management efforts, allowing AI actors along the lifecycle to identify errors, suggest improvements, and figure out new ways to contextualize and generalize AI system features and outcomes.
                - id: D-MEASURE_2.8-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clarified the roles, responsibilities, and delegated authorities to relevant stakeholders?
                - id: D-MEASURE_2.8-2
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-MEASURE_2.8-3
                  name: guidance
                  class: documentation
                  prose: Who is accountable for the ethical considerations during all stages of the AI lifecycle?
                - id: D-MEASURE_2.8-4
                  name: guidance
                  class: documentation
                  prose: Who will be responsible for maintaining, re-verifying, monitoring, and updating this AI once deployed?
                - id: D-MEASURE_2.8-5
                  name: guidance
                  class: documentation
                  prose: Are the responsibilities of the personnel involved in the various AI governance processes clearly defined?
            - id: MEASURE_2.9
              class: subcategory
