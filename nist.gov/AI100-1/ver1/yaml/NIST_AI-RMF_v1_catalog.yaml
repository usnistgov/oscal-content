              parts:
                - id: MEASURE_2.9_ovw
                  name: overview
                  prose: The AI model is explained, validated, and documented, and an AI system output is interpreted within its context – as identified in the MAP function –and to inform responsible use and governance.
                - id: SA-MEASURE_2.9
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.9-1
                      name: item
                      class: suggested_action
                      prose: Verify systems are developed to produce explainable models, post-hoc explanations and audit logs.
                    - id: SA-MEASURE_2.9-2
                      name: item
                      class: suggested_action
                      prose: When possible or available, utilize approaches that are inherently explainable, such as traditional and penalized generalized linear models, decision trees, nearest-neighbor and prototype-based approaches, rule-based models, generalized additive models, explainable boosting machines and neural additive models.
                    - id: SA-MEASURE_2.9-3
                      name: item
                      class: suggested_action
                      prose: Test explanation methods and resulting explanations prior to deployment to gain feedback from relevant AI actors, end users, and potentially impacted individuals or groups about whether explanations are accurate, clear, and understandable.
                    - id: SA-MEASURE_2.9-4
                      name: item
                      class: suggested_action
                      prose: Document AI model details including model type (e.g., convolutional neural network, reinforcement learning, decision tree, random forest, etc.) data features, training algorithms, proposed uses, decision thresholds, training data, evaluation data, and ethical considerations.
                    - id: SA-MEASURE_2.9-5
                      name: item
                      class: suggested_action
                      prose: Establish, document, and report performance and error metrics across demographic groups and other segments relevant to the deployment context.
                    - id: SA-MEASURE_2.9-6
                      name: item
                      class: suggested_action
                      prose: Explain systems using a variety of methods, e.g., visualizations, model extraction, feature importance, and others. Since explanations may not accurately summarize complex systems, test explanations according to properties such as fidelity, consistency, robustness, and interpretability.
                    - id: SA-MEASURE_2.9-7
                      name: item
                      class: suggested_action
                      prose: Assess the characteristics of system explanations according to properties such as fidelity (local and global), ambiguity, interpretability, interactivity, consistency, and resilience to attack/manipulation.
                    - id: SA-MEASURE_2.9-8
                      name: item
                      class: suggested_action
                      prose: Test the quality of system explanations with end-users and other groups.
                    - id: SA-MEASURE_2.9-9
                      name: item
                      class: suggested_action
                      prose: Secure model development processes to avoid vulnerability to external manipulation such as gaming explanation processes.
                    - id: SA-MEASURE_2.9-10
                      name: item
                      class: suggested_action
                      prose: Test for changes in models over time, including for models that adjust in response to production data.
                    - id: SA-MEASURE_2.9-11
                      name: item
                      class: suggested_action
                      prose: Use transparency tools such as data statements and model cards to document explanatory and validation information.
                - id: A-MEASURE_2.9
                  name: guidance
                  class: about
                  prose: Explain ability and interpretability assist those operating or overseeing an AI system, as well as users of an AI system, to gain deeper insights into the functionality and trustworthiness of the system, including its outputs. Explainable and interpretable AI systems offer information that help end users understand the purposes and potential impact of an AI system. Risk from lack of explain ability may be managed by describing how AI systems function, with descriptions tailored to individual differences such as the user's role, knowledge, and skill level. Explainable systems can be debugged and monitored more easily, and they lend themselves to more thorough documentation, audit, and governance. Risks to interpretability often can be addressed by communicating a description of why an AI system made a particular prediction or recommendation. Transparency, explain ability, and interpretability are distinct characteristics that support each other. Transparency can answer the question of “what happened”. Explain ability can answer the question of “how” a decision was made in the system. Interpretability can answer the question of “why” a decision was made by the system and its meaning or context to the user.
                - id: D-MEASURE_2.9-1
                  name: guidance
                  class: documentation
                  prose: Given the purpose of the AI, what level of explain ability or interpretability is required for how the AI made its determination?
                - id: D-MEASURE_2.9-2
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_2.9-3
                  name: guidance
                  class: documentation
                  prose: How has the entity documented the AI system’s data provenance, including sources, origins, transformations, augmentations, labels, dependencies, constraints, and metadata?
                - id: D-MEASURE_2.9-4
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
