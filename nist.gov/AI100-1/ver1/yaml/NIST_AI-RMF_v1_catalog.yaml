              parts:
                - id: MAP_2.3_ovw
                  name: overview
                  prose: Scientific integrity and TEVV considerations are identified and documented, including those related to experimental design, data collection and selection(e.g., availability, representativeness, suitability), system trustworthiness, and construct validation.
                - id: SA-MAP_2.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_2.3-1
                      name: item
                      class: suggested_action
                      prose: Identify and document experiment design and statistical techniques that are valid for testing complex socio-technical systems like AI, which involve human factors, emergent properties, and dynamic context(s) of use.
                    - id: SA-MAP_2.3-2
                      name: item
                      class: suggested_action
                      prose: Develop and apply TEVV protocols for models, system and its subcomponents, deployment, and operation.
                    - id: SA-MAP_2.3-3
                      name: item
                      class: suggested_action
                      prose: Demonstrate and document that AI system performance and validation metrics are interpretable and unambiguous for downstream decision making tasks and take socio-technical factors such as context of use into consideration.
                    - id: SA-MAP_2.3-4
                      name: item
                      class: suggested_action
                      prose: Identify and document assumptions, techniques, and metrics used for testing and evaluation throughout the AI lifecycle including experimental design techniques for data collection, selection, and management practices in accordance with data governance policies established in GOVERN.
                    - id: SA-MAP_2.3-5
                      name: item
                      class: suggested_action
                      prose: Identify testing modules that can be incorporated throughout the AI lifecycle and verify that processes enable corroboration by independent evaluators.
                    - id: SA-MAP_2.3-6
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms for regular communication and feedback among relevant AI actors and internal or external stakeholders related to the validity of design and deployment assumptions.
                    - id: SA-MAP_2.3-7
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms for regular communication and feedback between relevant AI actors and internal or external stakeholders related to the development of TEVV approaches throughout the lifecycle to detect and assess potentially harmful impacts
                    - id: SA-MAP_2.3-8
                      name: item
                      class: suggested_action
                      prose: 'Document assumptions made and techniques used in data selection, curation, preparation and analysis, including:'
                    - id: SA-MAP_2.3-8.1
                      name: item
                      class: suggested_action
                      prose: identification of constructs and proxy targets,
                    - id: SA-MAP_2.3-8.2
                      name: item
                      class: suggested_action
                      prose: development of indices – especially those operationalizing concepts that are inherently unobservable (e.g., “hireability,”“criminality,” “lendability”).
                    - id: SA-MAP_2.3-9
                      name: item
                      class: suggested_action
                      prose: Map adherence to policies that address data and construct validity, bias, privacy and security for AI systems and verify documentation, oversight, and processes.
                    - id: SA-MAP_2.3-10
                      name: item
                      class: suggested_action
                      prose: Identify and document transparent methods (e.g., causal discovery methods) for inferring causal relationships between constructs being modeled and dataset attributes or proxies.
                    - id: SA-MAP_2.3-11
                      name: item
                      class: suggested_action
                      prose: Identify and document processes to understand and trace test and training data lineage and its metadata resources for mapping risks.
                    - id: SA-MAP_2.3-12
                      name: item
                      class: suggested_action
                      prose: Document known limitations, risk mitigation efforts associated with, and methods used for, training data collection, selection, labeling, cleaning, and analysis (e.g., treatment of missing, spurious, or outlier data; biased estimators).
                    - id: SA-MAP_2.3-13
                      name: item
                      class: suggested_action
                      prose: Establish and document practices to check for capabilities that are in excess of those that are planned for, such as emergent properties, and to revisit prior risk management steps in light of any new capabilities.
                    - id: SA-MAP_2.3-14
                      name: item
                      class: suggested_action
                      prose: Establish processes to test and verify that design assumptions about the set of deployment contexts continue to be accurate and sufficiently complete.
                    - id: SA-MAP_2.3-15
                      name: item
                      class: suggested_action
                      prose: 'Work with domain experts and other external AI actors to:'
                    - id: SA-MAP_2.3-15.1
                      name: item
                      class: suggested_action
                      prose: Gain and maintain contextual awareness and knowledge about how human behavior, organizational factors and dynamics, and society influence, and are represented in, datasets, processes, models, and system output.
                    - id: SA-MAP_2.3-15.2
                      name: item
                      class: suggested_action
                      prose: Identify participatory approaches for responsible Human-AI configurations and oversight tasks, taking into account sources of cognitive bias.
                    - id: SA-MAP_2.3-15.3
                      name: item
                      class: suggested_action
                      prose: Identify techniques to manage and mitigate sources of bias(systemic, computational, human- cognitive) in computational models and systems, and the assumptions and decisions in their development.
                    - id: SA-MAP_2.3-16
                      name: item
                      class: suggested_action
                      prose: Investigate and document potential negative impacts due related to the full product lifecycle and associated processes that may conflict with organizational values and principles.
                - id: A-MAP_2.3
                  name: guidance
                  class: about
                  prose: Standard testing and evaluation protocols provide a basis to confirm assurance in a system that it is operating as designed and claimed. AI systems’ complexities create challenges for traditional testing and evaluation methodologies, which tend to be designed for static or isolated system performance. Opportunities for risk continue well beyond design and deployment, into system operation and application of system-enabled decisions. Testing and evaluation methodologies and metrics therefore address a continuum of activities. TEVV is enhanced when key metrics for performance, safety, and reliability are interpreted in a socio-technical context and not confined to the boundaries of the AI system pipeline. Other challenges for managing AI risks relate to dependence on largescale datasets, which can impact data quality and validity concerns. The difficulty of finding the “right” data may lead AI actors to select datasets based more on accessibility and availability than on suitability for operationalizing the phenomenon that the AI system intends to support or inform. Such decisions could contribute to an environment where the data used in processes is not fully representative of the populations or phenomena that are being modeled, introducing downstream risks. Practices such as dataset reuse may also lead to disconnect from the social contexts and time periods of their creation. This contributes to issues of validity of the underlying dataset for providing proxies, measures, or predictors within the model.
                - id: D-MAP_2.3-1
                  name: guidance
                  class: documentation
                  prose: Are there any known errors, sources of noise, or redundancies in the data?
                - id: D-MAP_2.3-2
                  name: guidance
                  class: documentation
                  prose: Over what timeframe was the data collected? Does the collection timeframe match the creation time frame
                - id: D-MAP_2.3-3
                  name: guidance
                  class: documentation
                  prose: What is the variable selection and evaluation process?
                - id: D-MAP_2.3-4
                  name: guidance
                  class: documentation
                  prose: How was the data collected? Who was involved in the data collection process? If the dataset relates to people (e.g., their attributes) or was generated by people, were they informed about the data collection?(e.g., datasets that collect writing, photos, interactions, transactions, etc.)
                - id: D-MAP_2.3-5
                  name: guidance
                  class: documentation
                  prose: As time passes and conditions change, is the training data still representative of the operational environment?
                - id: D-MAP_2.3-6
                  name: guidance
                  class: documentation
                  prose: Why was the dataset created? (e.g., were there specific tasks in mind, or a specific gap that needed to be filled?)
                - id: D-MAP_2.3-7
                  name: guidance
                  class: documentation
                  prose: How does the entity ensure that the data collected are adequate, relevant, and not excessive in relation to the intended purpose?
        - id: MAP_3
          class: category
          title: MAP 3
          props:
            - name: sort-id
              value: "00003.00003"
          parts:
            - id: MAP_3_smt
              name: statement
              prose: AI capabilities, targeted usage, goals, and expected benefits and costs compared with appropriate benchmarks are understood.
          controls:
            - id: MAP_3.1
              class: subcategory
              title: MAP 3.1
              props:
                - name: sort-id
                  value: 00003.00003.00001
              links:
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#57bbca56-7854-4405-98b8-a631464bd893'
                  rel: reference
                - href: '#85fceb5b-98d8-4ca5-a661-4124ea59aac4'
                  rel: reference
                - href: '#9b4ead39-9033-4f04-8233-97c02c8dcd90'
                  rel: reference
                - href: '#aec942cb-8f94-4f6a-955e-02e194bbca53'
                  rel: reference
                - href: '#b12412bc-b13d-4a1a-8fb8-725e9acb2d92'
                  rel: reference
              parts:
                - id: MAP_3.1_ovw
                  name: overview
                  prose: Potential benefits of intended AI system functionality and performance are examined and documented.
                - id: SA-MAP_3.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_3.1-1
                      name: item
                      class: suggested_action
                      prose: Utilize participatory approaches and engage with system end users to understand and document AI systems’ potential benefits, efficacy and interpretability of AI task output.
                    - id: SA-MAP_3.1-2
                      name: item
                      class: suggested_action
                      prose: Maintain awareness and documentation of the individuals, groups, or communities who make up the system’s internal and external stakeholders.
                    - id: SA-MAP_3.1-3
                      name: item
                      class: suggested_action
                      prose: Verify that appropriate skills and practices are available in-house for carrying out participatory activities such as eliciting, capturing, and synthesizing user, operator and external feedback, and translating it for AI design and development functions.
                    - id: SA-MAP_3.1-4
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms for regular communication and feedback between relevant AI actors and internal or external stakeholders related to system design or deployment decisions.
                    - id: SA-MAP_3.1-5
                      name: item
                      class: suggested_action
                      prose: Consider performance to human baseline metrics or other standard benchmarks.
                    - id: SA-MAP_3.1-6
                      name: item
                      class: suggested_action
                      prose: Incorporate feedback from end users, and potentially impacted individuals and communities about perceived system benefits .
                - id: A-MAP_3.1
                  name: guidance
                  class: about
                  prose: AI systems have enormous potential to improve quality of life, enhance economic prosperity and security costs. Organizations are encouraged to define and document system purpose and utility, and its potential positive impacts. benefits beyond current known performance benchmarks. It is encouraged that risk management and assessment of benefits and impacts include processes for regular and meaningful communication with potentially affected groups and communities. These stakeholders can provide valuable input related to systems’ benefits and possible limitations. Organizations may differ in the types and number of stakeholders with which they engage. Other approaches such as human-centered design (HCD) and value-sensitive design (VSD) can help AI teams to engage broadly with individuals and communities. This type of engagement can enable AI teams to learn about how a given technology may cause positive or negative impacts, that were not originally considered or intended.
                - id: D-MAP_3.1-1
                  name: guidance
                  class: documentation
                  prose: Have the benefits of the AI system been communicated to end users?
                - id: D-MAP_3.1-2
                  name: guidance
                  class: documentation
                  prose: Have the appropriate training material and disclaimers about how to adequately use the AI system been provided to end users?
                - id: D-MAP_3.1-3
                  name: guidance
                  class: documentation
                  prose: Has your organization implemented a risk management system to address risks involved in deploying the identified AI system (e.g., personnel risk or changes to commercial objectives)?
            - id: MAP_3.2
              class: subcategory
              title: MAP 3.2
              props:
                - name: sort-id
                  value: 00003.00003.00002
              links:
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#a870e88b-842b-46ea-b9aa-51f717be0403'
                  rel: reference
                - href: '#a988fcec-e452-4949-b995-4b362a5d1190'
                  rel: reference
                - href: '#35b6a0f9-e361-4e84-bdbc-bc60d7947b4b'
                  rel: reference
                - href: '#636ed69e-eca2-4da6-aedd-1718a4c43547'
                  rel: reference
                - href: '#e143fec0-1db9-40a6-97b5-81514cb09741'
                  rel: reference
                - href: '#b9166920-88de-45d5-a426-7b01ceab7559'
                  rel: reference
              parts:
                - id: MAP_3.2_ovw
                  name: overview
                  prose: Potential costs, including non-monetary costs, which result from expected or realized AI errors or system functionality and trustworthiness - as connected to organizational risk tolerance - are examined and documented.
                - id: SA-MAP_3.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_3.2-1
                      name: item
                      class: suggested_action
                      prose: 'Perform context analysis to map potential negative impacts arising from not integrating trustworthiness characteristics. When negative impacts are not direct or obvious, AI actors can engage with stakeholders external to the team that developed or deployed the AI system, and potentially impacted communities, to examine and document:'
                    - id: SA-MAP_3.2-1.1
                      name: item
                      class: suggested_action
                      prose: Who could be harmed?
                    - id: SA-MAP_3.2-1.2
                      name: item
                      class: suggested_action
                      prose: What could be harmed?
                    - id: SA-MAP_3.2-1.3
                      name: item
                      class: suggested_action
                      prose: When could harm arise?
                    - id: SA-MAP_3.2-1.4
                      name: item
                      class: suggested_action
                      prose: How could harm arise?
                    - id: SA-MAP_3.2-2
                      name: item
                      class: suggested_action
                      prose: Identify and implement procedures for regularly evaluating the qualitative and quantitative costs of internal and external AI system failures. Develop actions to prevent, detect, and/or correct potential risks and related impacts. Regularly evaluate failure costs to inform go/no-go deployment decisions throughout the AI system lifecycle.
                - id: A-MAP_3.2
                  name: guidance
                  class: about
                  prose: Anticipating negative impacts of AI systems is a difficult task. Negative impacts can be due to many factors, such as system non-functionality or use outside of its operational limits, and may range from minor annoyance to serious injury, financial losses, or regulatory enforcement actions. AI actors can work with a broad set of stakeholders to improve their capacity for understanding systems’ potential impacts – and subsequently –systems’ risks.
                - id: D-MAP_3.2-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the system/entity consistently measure progress towards stated goals and objectives?
                - id: D-MAP_3.2-2
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MAP_3.2-3
                  name: guidance
                  class: documentation
                  prose: Have you documented and explained that machine errors may differ from human errors?
            - id: MAP_3.3
              class: subcategory
              title: MAP 3.3
              props:
                - name: sort-id
                  value: 00003.00003.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#ed7f872a-aad7-4d6c-9a4b-8a80b53efed3'
                  rel: reference
                - href: '#a44eb7d6-c7f7-4bf3-bcaf-795e1447290a'
                  rel: reference
                - href: '#55cc6ee2-d3d4-4e3a-8e43-fee14d51e902'
                  rel: reference
                - href: '#39f185e0-4b3c-4ccf-a733-c9f292f538b8'
                  rel: reference
              parts:
                - id: MAP_3.3_ovw
                  name: overview
                  prose: Targeted application scope is specified and documented based on the system's capability, established context, and AI system categorization.
                - id: SA-MAP_3.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_3.3-1
                      name: item
                      class: suggested_action
                      prose: 'Consider narrowing contexts for system deployment, including factors related to: - How outcomes may directly or indirectly affect users, groups, communities and the environment. - Length of time the system is deployed in between re-trainings. - Geographical regions in which the system operates. - Dynamics related to community standards or likelihood of system misuse or abuses (either purposeful or unanticipated). - How AI system features and capabilities can be utilized within other applications, or in place of other existing processes.'
                    - id: SA-MAP_3.3-2
                      name: item
                      class: suggested_action
                      prose: Engage AI actors from legal and procurement functions when specifying target application scope.
                - id: A-MAP_3.3
                  name: guidance
                  class: about
                  prose: Systems that function in a narrow scope tend to enable better mapping, measurement, and management of risks in the learning or decision-making tasks and the system context. A narrow application scope also helps ease TEVV functions and related resources within an organization. For example, large language models or open-ended chatbot systems that interact with the public on the internet have a large number of risks that may be difficult to map, measure, and manage due to the variability from both the decision-making task and the operational context. Instead, a task-specific chatbot utilizing templated responses that follow a defined “user journey” is a scope that can be more easily mapped, measured and managed.
                - id: D-MAP_3.3-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clearly defined technical specifications and requirements for the AI system?
                - id: D-MAP_3.3-2
                  name: guidance
                  class: documentation
                  prose: How do the technical specifications and requirements align with the AI system's goals and objectives?
            - id: MAP_3.4
              class: subcategory
              title: MAP 3.4
              props:
                - name: sort-id
                  value: 00003.00003.00004
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#098d48c3-32fa-4425-b9c7-ffeb377eb04a'
                  rel: reference
                - href: '#3c0dca69-3b5e-4d49-8ca8-f44c4bef4ac4'
                  rel: reference
                - href: '#66806ab2-e029-4e31-9593-f6f58e191ae7'
                  rel: reference
                - href: '#82cdc7ef-83f9-4bea-9654-d3991aca6e29'
                  rel: reference
                - href: '#651d32e3-76f7-4512-9401-784ecf28fc06'
                  rel: reference
                - href: '#802b68be-feb5-4a10-a076-26faa620f58b'
                  rel: reference
                - href: '#11f43ea2-38b6-4293-9eea-f531188dbf85'
                  rel: reference
                - href: '#90c4634b-d2a7-4219-81fe-33e2659c778b'
                  rel: reference
                - href: '#28990599-944c-469f-a0d7-f1f78a8bd23c'
                  rel: reference
                - href: '#1c4b072d-d759-485a-ad43-5401079cfbf9'
                  rel: reference
              parts:
                - id: MAP_3.4_ovw
                  name: overview
                  prose: Processes for operator and practitioner proficiency with AI system performance and trustworthiness – and relevant technical standards and certifications – are defined, assessed and documented.
                - id: SA-MAP_3.4
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_3.4-1
                      name: item
                      class: suggested_action
                      prose: Identify and declare AI system features and capabilities that may affect downstream AI actors’ decision-making in deployment and operational settings for example how system features and capabilities may activate known risks in various human-AI configurations, such as selective adherence.
                    - id: SA-MAP_3.4-2
                      name: item
                      class: suggested_action
                      prose: Identify skills and proficiency requirements for operators, practitioners and other domain experts that interact with AI systems, Develop AI system operational documentation for AI actors in deployed and operational environments, including information about known risks, mitigation criteria, and trustworthy characteristics enumerated in Map-1.
                    - id: SA-MAP_3.4-3
                      name: item
                      class: suggested_action
                      prose: Define and develop training materials for proposed end users, practitioners and operators about AI system use and known limitations.
                    - id: SA-MAP_3.4-4
                      name: item
                      class: suggested_action
                      prose: Define and develop certification procedures for operating AI systems within defined contexts of use, and information about what exceeds operational boundaries.
                    - id: SA-MAP_3.4-5
                      name: item
                      class: suggested_action
                      prose: Include operators, practitioners and end users in AI system prototyping and testing activities to help inform operational boundaries and acceptable performance. Conduct testing activities under scenarios similar to deployment conditions.
                    - id: SA-MAP_3.4-6
                      name: item
                      class: suggested_action
                      prose: Verify model output provided to AI system operators, practitioners and end users is interactive, and specified to context and user requirements defined in MAP-1.
                    - id: SA-MAP_3.4-7
                      name: item
                      class: suggested_action
                      prose: Verify AI system output is interpretable and unambiguous for downstream decision-making tasks.
                    - id: SA-MAP_3.4-8
                      name: item
                      class: suggested_action
                      prose: Design AI system explanation complexity to match the level of problem and context complexity.
                    - id: SA-MAP_3.4-9
                      name: item
                      class: suggested_action
                      prose: Verify that design principles are in place for safe operation by AI actors in decision-making environments.
                    - id: SA-MAP_3.4-10
                      name: item
                      class: suggested_action
                      prose: Develop approaches to track human-AI configurations, operator, and practitioner outcomes for integration into continual improvement.
                - id: A-MAP_3.4
                  name: guidance
                  class: about
                  prose: 'Human-AI configurations can span from fully autonomous to fully manual. AI systems can autonomously make decisions, defer decision-making to a human expert, or be used by a human decision-maker as an additional opinion. In some scenarios, professionals with expertise in a specific domain work in conjunction with an AI system towards a specific end goal—for example, a decision about another individual(s). Depending on the purpose of the system, the expert may interact with the AI system but is rarely part of the design or development of the system itself. These experts are not necessarily familiar with machine learning, data science, computer science, or other fields traditionally associated with AI design or development and - depending on the application - will likely not require such familiarity. For example, for AI systems that are deployed in healthcare delivery the experts are the physicians and bring their expertise about medicine—not data science, data modeling and engineering, or other computational factors. The challenge in these settings is not educating the end user about AI system capabilities, but rather leveraging, and not replacing, practitioner domain expertise. Questions remain about how to configure humans and automation for managing AI risks. Risk management is enhanced when organizations that design, develop or deploy AI systems for use by professional operators and practitioners: are aware of these knowledge limitations and strive to identify risks inhuman-AI interactions and configurations across all contexts, and the potential resulting impacts, define and differentiate the various human roles and responsibilities when using or interacting with AI systems, and determine proficiency standards for AI system operation in proposed context of use, as enumerated in MAP-1 and established in GOVERN-3.2.'
                - id: D-MAP_3.4-1
                  name: guidance
                  class: documentation
                  prose: What policies has the entity developed to ensure the use of the AI system is consistent with its stated values and principles?
                - id: D-MAP_3.4-2
                  name: guidance
                  class: documentation
                  prose: How will the accountable human(s) address changes in accuracy and precision due to either an adversary’s attempts to disrupt the AI or unrelated changes in operational/business environment, which may impact the accuracy of the AI?
                - id: D-MAP_3.4-3
                  name: guidance
                  class: documentation
                  prose: How does the entity assess whether personnel have the necessary skills, training, resources, and domain knowledge to fulfill their assigned responsibilities?
                - id: D-MAP_3.4-4
                  name: guidance
                  class: documentation
                  prose: Are the relevant staff dealing with AI systems properly trained to interpret AI model output and decisions as well as to detect and manage bias in data?
                - id: D-MAP_3.4-5
                  name: guidance
                  class: documentation
                  prose: What metrics has the entity developed to measure performance of various components?
            - id: MAP_3.5
              class: subcategory
              title: MAP 3.5
              props:
                - name: sort-id
                  value: 00003.00003.00005
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#a20568ac-25f3-4781-90fa-145a40610815'
                  rel: reference
                - href: '#b094b778-b331-47cb-9524-a8c430cd028f'
                  rel: reference
                - href: '#1bcb86e3-d1cf-4bb4-8a53-eef967143fe7'
                  rel: reference
                - href: '#75e90bf9-792b-4487-a59b-48a2f0d59b99'
                  rel: reference
                - href: '#802b68be-feb5-4a10-a076-26faa620f58b'
                  rel: reference
                - href: '#11158ef1-ae33-4c0b-acbb-5a41af843f4b'
                  rel: reference
              parts:
                - id: MAP_3.5_ovw
                  name: overview
                  prose: Processes for human oversight are defined, assessed, and documented in accordance with organizational policies from GOVERN function.
                - id: SA-MAP_3.5
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_3.5-1
                      name: item
                      class: suggested_action
                      prose: Identify and document AI systems’ features and capabilities that require human oversight, in relation to operational and societal contexts, trustworthy characteristics, and risks identified in MAP-1.
                    - id: SA-MAP_3.5-2
                      name: item
                      class: suggested_action
                      prose: Establish practices for AI systems’ oversight in accordance with policies developed in GOVERN-1.
                    - id: SA-MAP_3.5-3
                      name: item
                      class: suggested_action
                      prose: Define and develop training materials for relevant AI Actors about AI system performance, context of use, known limitations and negative impacts, and suggested warning labels.
                    - id: SA-MAP_3.5-4
                      name: item
                      class: suggested_action
                      prose: Include relevant AI Actors in AI system prototyping and testing activities. Conduct testing activities under scenarios similar to deployment conditions.
                    - id: SA-MAP_3.5-5
                      name: item
                      class: suggested_action
                      prose: Evaluate AI system oversight practices for validity and reliability. When oversight practices undergo extensive updates or adaptations, retest, evaluate results, and course correct as necessary.
                    - id: SA-MAP_3.5-6
                      name: item
                      class: suggested_action
                      prose: Verify that model documents contain interpretable descriptions of system mechanisms, enabling oversight personnel to make informed, risk-based decisions about system risks.
                - id: A-MAP_3.5
                  name: guidance
                  class: about
                  prose: As AI systems have evolved in accuracy and precision, computational systems have moved from being used purely for decision support—or for explicit use by and under the control of a human operator—to automated decision making with limited input from humans. Computational decision support systems augment another, typically human, system in making decisions. These types of configurations increase the likelihood of outputs being produced with little human involvement. Defining and differentiating various human roles and responsibilities for AI systems’ governance, and differentiating AI system overseers and those using or interacting with AI systems can enhance AI risk management activities. In critical systems, high-stakes settings, and systems deemed high-risk itis of vital importance to evaluate risks and effectiveness of oversight procedures before an AI system is deployed. Ultimately, AI system oversight is a shared responsibility, and attempts to properly authorize or govern oversight practices will not be effective without organizational buy-in and accountability mechanisms, for example those suggested in the GOVERN function.
                - id: D-MAP_3.5-1
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-MAP_3.5-2
                  name: guidance
                  class: documentation
                  prose: How does the entity assess whether personnel have the necessary skills, training, resources, and domain knowledge to fulfill their assigned responsibilities?
                - id: D-MAP_3.5-3
                  name: guidance
                  class: documentation
                  prose: Are the relevant staff dealing with AI systems properly trained to interpret AI model output and decisions as well as to detect and manage bias in data?
                - id: D-MAP_3.5-4
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the AI system's development, testing methodology, metrics, and performance outcomes?
        - id: MAP_4
          class: category
          title: MAP 4
          props:
            - name: sort-id
              value: "00003.00004"
          parts:
            - id: MAP_4_smt
              name: statement
              prose: Risks and benefits are mapped for all components of the AI system including third-party software and data.
          controls:
            - id: MAP_4.1
              class: subcategory
              title: MAP 4.1
              props:
                - name: sort-id
                  value: 00003.00004.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#b7e5a472-6c6d-4da2-b05e-5c5fd8819688'
                  rel: reference
                - href: '#1a06ffd2-6c94-43e3-80db-6d50574437de'
                  rel: reference
                - href: '#5bd3aab2-8a2c-42ef-8a9d-86edd655f6f5'
                  rel: reference
                - href: '#59f905af-7275-488f-98e5-29021f5376ca'
                  rel: reference
                - href: '#da8fab2f-fb48-4bb7-ac66-bc913a327e8d'
                  rel: reference
                - href: '#00a4e89e-dfc2-4b29-a4a2-d53ad369737e'
                  rel: reference
              parts:
                - id: MAP_4.1_ovw
                  name: overview
                  prose: Approaches for mapping AI technology and legal risks of its components –including the use of third-party data or software – are in place, followed, and documented, as are risks of infringement of a third-party’s intellectual property or other rights.
                - id: SA-MAP_4.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_4.1-1
                      name: item
                      class: suggested_action
                      prose: Review audit reports, testing results, product roadmaps, warranties, terms of service, end user license agreements, contracts, and other documentation related to third-party entities to assist in value assessment and risk management activities.
                    - id: SA-MAP_4.1-2
                      name: item
                      class: suggested_action
                      prose: Review third-party software release schedules and software change management plans (hotfixes, patches, updates, forward- and backward- compatibility guarantees) for irregularities that may contribute to AI system risks.
                    - id: SA-MAP_4.1-3
                      name: item
                      class: suggested_action
                      prose: Inventory third-party material (hardware, open-source software, foundation models, open-source data, proprietary software, proprietary data, etc.) required for system implementation and maintenance.
                    - id: SA-MAP_4.1-4
                      name: item
                      class: suggested_action
                      prose: Review redundancies related to third-party technology and personnel to assess potential risks due to lack of adequate support.
                - id: A-MAP_4.1
                  name: guidance
                  class: about
                  prose: Technologies and personnel from third parties are another potential sources of risk to consider during AI risk management activities. Such risks may be difficult to map since risk priorities or tolerances may not be the same as the deployer organization. For example, the use of pre-trained models, which tend to rely on large uncurated dataset or often have undisclosed origins, has raised concerns about privacy, bias, and unanticipated effects along with possible introduction of increased levels of statistical uncertainty, difficulty with reproducibility, and issues with scientific validity.
                - id: D-MAP_4.1-1
                  name: guidance
                  class: documentation
                  prose: Did you establish a process for third parties (e.g., suppliers, end users, subjects, distributors/vendors or workers) to report potential vulnerabilities, risks or biases in the AI system?
                - id: D-MAP_4.1-2
                  name: guidance
                  class: documentation
                  prose: If your organization obtained datasets from a third party, did your organization assess and manage the risks of using such datasets?
                - id: D-MAP_4.1-3
                  name: guidance
                  class: documentation
                  prose: How will the results be independently verified?
            - id: MAP_4.2
              class: subcategory
              title: MAP 4.2
              props:
                - name: sort-id
                  value: 00003.00004.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
                - href: '#eed92d1a-3479-4d3b-a106-a5771c0b5af3'
                  rel: reference
                - href: '#8ccbc7a0-6e30-4468-9b0a-b600b4f4530a'
                  rel: reference
              parts:
                - id: MAP_4.2_ovw
                  name: overview
                  prose: Internal risk controls for components of the AI system including third-party AI technologies are identified and documented.
                - id: SA-MAP_4.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_4.2-1
                      name: item
                      class: suggested_action
                      prose: Track third parties preventing or hampering risk-mapping as indications of increased risk.
                    - id: SA-MAP_4.2-2
                      name: item
                      class: suggested_action
                      prose: Supply resources such as model documentation templates and software safelists to assist in third-party technology inventory and approval activities.
                    - id: SA-MAP_4.2-3
                      name: item
                      class: suggested_action
                      prose: Review third-party material (including data and models) for risks related to bias, data privacy, and security vulnerabilities.
                    - id: SA-MAP_4.2-4
                      name: item
                      class: suggested_action
                      prose: Apply traditional technology risk controls – such as procurement, security, and data privacy controls – to all acquired third-party technologies.
                - id: A-MAP_4.2
                  name: guidance
                  class: about
                  prose: In the course of their work, AI actors often utilize open-source, or otherwise freely available, third-party technologies – some of which may have privacy, bias, and security risks. Organizations may consider internal risk controls for these technology sources and build up practices for evaluating third-party material prior to deployment.
                - id: D-MAP_4.2-1
                  name: guidance
                  class: documentation
                  prose: Can the AI system be audited by independent third parties?
                - id: D-MAP_4.2-2
                  name: guidance
                  class: documentation
                  prose: To what extent do these policies foster public trust and confidence in the use of the AI system?
                - id: D-MAP_4.2-3
                  name: guidance
                  class: documentation
                  prose: Are mechanisms established to facilitate the AI system’s auditability(e.g., traceability of the development process, the sourcing of training data and the logging of the AI system’s processes, outcomes, positive and negative impact)?
        - id: MAP_5
          class: category
          title: MAP 5
          props:
            - name: sort-id
              value: "00003.00005"
          parts:
            - id: MAP_5_smt
              name: statement
              prose: Impacts to individuals, groups, communities, organizations, and society are characterized.
          controls:
            - id: MAP_5.1
              class: subcategory
              title: MAP 5.1
              props:
                - name: sort-id
                  value: 00003.00005.00001
              links:
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#d4aa415b-96e4-4423-953d-1632dba1e73f'
                  rel: reference
                - href: '#5080df14-0029-426e-b69a-4ae18ad1859a'
                  rel: reference
                - href: '#893f3e45-d9bc-4a6a-b22e-795aa931ce0e'
                  rel: reference
                - href: '#4292da18-3e69-478c-ae75-8b56bb6542da'
                  rel: reference
                - href: '#e9dd11ac-4b80-406a-8203-f1313d1b9ee9'
                  rel: reference
              parts:
                - id: MAP_5.1_ovw
                  name: overview
                  prose: Likelihood and magnitude of each identified impact (both potentially beneficial and harmful) based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback from those external to the team that developed or deployed the AI system, or other data are identified and documented.
                - id: SA-MAP_5.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_5.1-1
                      name: item
                      class: suggested_action
                      prose: Establish assessment scales for measuring AI systems’ impact. Scales may be qualitative, such as red-amber-green (RAG), or may entail simulations or econometric approaches. Document and apply scales uniformly across the organization’s AI portfolio.
                    - id: SA-MAP_5.1-2
                      name: item
                      class: suggested_action
                      prose: Apply TEVV regularly at key stages in the AI lifecycle, connected to system impacts and frequency of system updates.
                    - id: SA-MAP_5.1-3
                      name: item
                      class: suggested_action
                      prose: Identify and document likelihood and magnitude of system benefits and negative impacts in relation to trustworthiness characteristics.
                - id: A-MAP_5.1
                  name: guidance
                  class: about
                  prose: AI actors can evaluate, document and triage the likelihood of AI system impacts identified in Map 5.1 Likelihood estimates may then be assessed and judged for go/no-go decisions about deploying an AI system. If an organization decides to proceed with deploying the system, the likelihood and magnitude estimates can be used to assign TEVV resources appropriate for the risk level.
                - id: D-MAP_5.1-1
                  name: guidance
                  class: documentation
                  prose: Which population(s) does the AI system impact?
                - id: D-MAP_5.1-2
                  name: guidance
                  class: documentation
                  prose: What assessments has the entity conducted on trustworthiness characteristics for example data security and privacy impacts associated with the AI system?
                - id: D-MAP_5.1-3
                  name: guidance
                  class: documentation
                  prose: Can the AI system be tested by independent third parties?
            - id: MAP_5.2
              class: subcategory
              title: MAP 5.2
              props:
                - name: sort-id
                  value: 00003.00005.00002
              links:
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#cfdc1c8a-5d57-415e-8c72-88f9c8ea9fa0'
                  rel: reference
                - href: '#5a83b9ce-de4e-4f7d-9710-d39e63b032ca'
                  rel: reference
                - href: '#a988fcec-e452-4949-b995-4b362a5d1190'
                  rel: reference
                - href: '#0c187227-7a34-4fcc-bf07-82f506ef8b35'
                  rel: reference
                - href: '#0772bb26-cae7-4128-bc6f-9068f48e5383'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#dc607e51-a5ca-46ec-8068-5daad60d9df1'
                  rel: reference
                - href: '#1daddacb-e601-498d-93cb-1137831beeec'
                  rel: reference
                - href: '#2641f5c5-3f2f-4855-88b7-7c6c29cfa871'
                  rel: reference
                - href: '#06414091-d0d0-4dd1-bf88-4e7b97b8de43'
                  rel: reference
                - href: '#5fea5db0-8954-4e99-a758-635376305221'
                  rel: reference
                - href: '#0380cbdb-aa25-46ca-ae7c-6a533d7d2b7b'
                  rel: reference
                - href: '#7e15d4d1-ce99-4ca0-9cec-f7745fe519d8'
                  rel: reference
              parts:
                - id: MAP_5.2_ovw
                  name: overview
                  prose: Practices and personnel for supporting regular engagement with relevant AI actors and integrating feedback about positive, negative, and unanticipated impacts are in place and documented.
                - id: SA-MAP_5.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_5.2-1
                      name: item
                      class: suggested_action
                      prose: Establish and document stakeholder engagement processes at the earliest stages of system formulation to identify potential impacts from the AI system on individuals, groups, communities, organizations, and society.
                    - id: SA-MAP_5.2-2
                      name: item
                      class: suggested_action
                      prose: Employ methods such as value sensitive design (VSD) to identify misalignments between organizational and societal values, and system implementation and impact.
                    - id: SA-MAP_5.2-3
                      name: item
                      class: suggested_action
                      prose: Identify approaches to engage, capture, and incorporate input from system end users and other key stakeholders to assist with continuous monitoring for potential impacts and emergent risks.
                    - id: SA-MAP_5.2-4
                      name: item
                      class: suggested_action
                      prose: Incorporate quantitative, qualitative, and mixed methods in the assessment and documentation of potential impacts to individuals, groups, communities, organizations, and society.
                    - id: SA-MAP_5.2-5
                      name: item
                      class: suggested_action
                      prose: Identify a team (internal or external) that is independent of AI design and development functions to assess AI system benefits, positive and negative impacts and their likelihood and magnitude.
                    - id: SA-MAP_5.2-6
                      name: item
                      class: suggested_action
                      prose: Evaluate and document stakeholder feedback to assess potential impacts for actionable insights regarding trustworthiness characteristics and changes in design approaches and principles.
                    - id: SA-MAP_5.2-7
                      name: item
                      class: suggested_action
                      prose: Develop TEVV procedures that incorporate socio-technical elements and methods and plan to normalize across organizational culture. Regularly review and refine TEVV processes.
                - id: A-MAP_5.2
                  name: guidance
                  class: about
                  prose: AI systems are socio-technical in nature and can have positive, neutral, or negative implications that extend beyond their stated purpose. Negative impacts can be wide- ranging and affect individuals, groups, communities, organizations, and society, as well as the environment and national security. Organizations can create a baseline for system monitoring to increase opportunities for detecting emergent risks. After an AI system is deployed, engaging different stakeholder groups – who may be aware of, or experience, benefits or negative impacts that are unknown to AI actors involved in the design, development and deployment activities – allows organizations to understand and monitor system benefits and potential negative impacts more readily.
                - id: D-MAP_5.2-1
                  name: guidance
                  class: documentation
                  prose: If the AI system relates to people, does it unfairly advantage or disadvantage a particular social group? In what ways? How was this managed?
                - id: D-MAP_5.2-2
                  name: guidance
                  class: documentation
                  prose: If the AI system relates to other ethically protected groups, have appropriate obligations been met? (e.g., medical data might include information collected from animals)
                - id: D-MAP_5.2-3
                  name: guidance
                  class: documentation
                  prose: If the AI system relates to people, could this dataset expose people to harm or legal action? (e.g., financial social or otherwise) What was done to mitigate or reduce the potential for harm?
    - id: MEASURE
      class: function
      title: MEASURE
      props:
        - name: sort-id
          value: "00004"
      parts:
        - id: MEASURE_ovw
          name: overview
          prose: Identified risks are assessed, analyzed, or tracked.
      controls:
        - id: MEASURE_1
          class: category
          title: MEASURE 1
          props:
            - name: sort-id
              value: "00004.00001"
          parts:
            - id: MEASURE_1_smt
              name: statement
              prose: Appropriate methods and metrics are identified and applied.
          controls:
            - id: MEASURE_1.1
              class: subcategory
              title: MEASURE 1.1
              props:
                - name: sort-id
                  value: 00004.00001.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#a24fa115-24f1-4845-b5e4-35b733052610'
                  rel: reference
                - href: '#d35f5742-d30a-4d48-922a-5331b0dc650e'
                  rel: reference
                - href: '#7f792182-3c7c-4ada-8611-3401eeceb74b'
                  rel: reference
                - href: '#456db5c3-d3cb-4b0f-b124-5478d8d68a56'
                  rel: reference
                - href: '#4292da18-3e69-478c-ae75-8b56bb6542da'
                  rel: reference
                - href: '#96a61451-bb04-4016-9351-02604aed617c'
                  rel: reference
                - href: '#577ddd09-052f-4cd7-9a76-2b0ea8e5b058'
                  rel: reference
              parts:
                - id: MEASURE_1.1_ovw
                  name: overview
                  prose: Approaches and metrics for measurement of AI risks enumerated during the Map function are selected for implementation starting with the most significant AI risks. The risks or trustworthiness characteristics that will not –or cannot – be measured are properly documented.
                - id: SA-MEASURE_1.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_1.1-1
                      name: item
                      class: suggested_action
                      prose: Establish approaches for detecting, tracking and measuring known risks, errors, incidents or negative impacts.
                    - id: SA-MEASURE_1.1-2
                      name: item
                      class: suggested_action
                      prose: Identify testing procedures and metrics to demonstrate whether or not the system is fit for purpose and functioning as claimed.
                    - id: SA-MEASURE_1.1-3
                      name: item
                      class: suggested_action
                      prose: Identify testing procedures and metrics to demonstrate AI system trustworthiness.
                    - id: SA-MEASURE_1.1-4
                      name: item
                      class: suggested_action
                      prose: Define acceptable limits for system performance (e.g., distribution of errors) and include course correction suggestions if/when the system performs beyond acceptable limits.
                    - id: SA-MEASURE_1.1-5
                      name: item
                      class: suggested_action
                      prose: Define metrics for, and regularly assess, AI actor competency for effective system operation,
                    - id: SA-MEASURE_1.1-6
                      name: item
                      class: suggested_action
                      prose: Identify transparency metrics to assess whether stakeholders have access to necessary information about system design, development, deployment, use, and evaluation.
                    - id: SA-MEASURE_1.1-7
                      name: item
                      class: suggested_action
                      prose: Utilize accountability metrics to determine whether AI designers, developers, and deployers maintain clear and transparent lines of responsibility and are open to inquiries.
                    - id: SA-MEASURE_1.1-8
                      name: item
                      class: suggested_action
                      prose: Document metric selection criteria and include considered but unused metrics.
                    - id: SA-MEASURE_1.1-9
                      name: item
                      class: suggested_action
                      prose: Monitor AI system external inputs including training data, models developed for other contexts, system components reused from other contexts, and third-party tools and resources.
                    - id: SA-MEASURE_1.1-10
                      name: item
                      class: suggested_action
                      prose: Report metrics to inform assessments of system generalizability and reliability.
                    - id: SA-MEASURE_1.1-11
                      name: item
                      class: suggested_action
                      prose: Assess and document pre- vs post-deployment system performance. Include existing and emergent risks.
                    - id: SA-MEASURE_1.1-12
                      name: item
                      class: suggested_action
                      prose: Document risks or trustworthiness characteristics identified in the Map function that will not be measured, including justification for non-measurement.
                - id: A-MEASURE_1.1
                  name: guidance
                  class: about
                  prose: The development and utility of trustworthy AI systems depends on reliable measurements and evaluations of underlying technologies and their use. Compared with traditional software systems, AI technologies bring new failure modes, inherent dependence on training data and methods which directly tie to data quality and representativeness. Additionally, AI systems are inherently socio-technical in nature, meaning they are influenced by societal dynamics and human behavior. AI risks – and benefits – can emerge from the interplay of technical aspects combined with societal factors related to how a system is used, its interactions with other AI systems, who operates it, and the social context in which it is deployed. In other words, what should be measured depends on the purpose, audience, and needs of the evaluations. These two factors influence selection of approaches and metrics for measurement of AI risks enumerated during the Map function. The AI landscape is evolving and so are the methods and metrics for AI measurement. The evolution of metrics is key to maintaining efficacy of the measures.
                - id: D-MEASURE_1.1-1
                  name: guidance
                  class: documentation
                  prose: How will the appropriate performance metrics, such as accuracy, of the AI be monitored after the AI is deployed?
                - id: D-MEASURE_1.1-2
                  name: guidance
                  class: documentation
                  prose: What corrective actions has the entity taken to enhance the quality, accuracy, reliability, and representativeness of the data?
                - id: D-MEASURE_1.1-3
                  name: guidance
                  class: documentation
                  prose: Are there recommended data splits or evaluation measures? (e.g., training, development, testing; accuracy/AUC)
                - id: D-MEASURE_1.1-4
                  name: guidance
                  class: documentation
                  prose: Did your organization address usability problems and test whether user interfaces served their intended purposes?
                - id: D-MEASURE_1.1-5
                  name: guidance
                  class: documentation
                  prose: What testing, if any, has the entity conducted on the AI system to identify errors and limitations (i.e., manual vs automated, adversarial and stress testing)?
            - id: MEASURE_1.2
              class: subcategory
              title: MEASURE 1.2
              props:
                - name: sort-id
                  value: 00004.00001.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#7f792182-3c7c-4ada-8611-3401eeceb74b'
                  rel: reference
                - href: '#3f36ecf1-c0e6-4ef1-9643-32059c7f37ac'
                  rel: reference
                - href: '#e9fc48f3-f53a-415d-9063-19bd3e7638cc'
                  rel: reference
                - href: '#6157308a-bbc8-4248-8629-7e5d7432971a'
                  rel: reference
                - href: '#643ab889-c45a-4d77-8825-7636e1df5162'
                  rel: reference
              parts:
                - id: MEASURE_1.2_ovw
                  name: overview
                  prose: Appropriateness of AI metrics and effectiveness of existing controls is regularly assessed and updated including reports of errors and impacts on affected communities.
                - id: SA-MEASURE_1.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_1.2-1
                      name: item
                      class: suggested_action
                      prose: Assess external validity of all measurements (e.g., the degree to which measurements taken in one context can generalize to other contexts).
                    - id: SA-MEASURE_1.2-2
                      name: item
                      class: suggested_action
                      prose: Assess effectiveness of existing metrics and controls on a regular basis throughout the AI system lifecycle.
                    - id: SA-MEASURE_1.2-3
                      name: item
                      class: suggested_action
                      prose: Document reports of errors, incidents and negative impacts and assess sufficiency and efficacy of existing metrics for repairs, and upgrades.
                    - id: SA-MEASURE_1.2-4
                      name: item
                      class: suggested_action
                      prose: Develop new metrics when existing metrics are insufficient or ineffective for implementing repairs and upgrades.
                    - id: SA-MEASURE_1.2-5
                      name: item
                      class: suggested_action
                      prose: Develop and utilize metrics to monitor, characterize and track external inputs, including any third-party tools.
                    - id: SA-MEASURE_1.2-6
                      name: item
                      class: suggested_action
                      prose: Determine frequency and scope for sharing metrics and related information with stakeholders and impacted communities.
                    - id: SA-MEASURE_1.2-7
                      name: item
                      class: suggested_action
                      prose: Utilize stakeholder feedback processes established in the Map function to capture, act upon and share feedback from end users and potentially impacted communities.
                    - id: SA-MEASURE_1.2-8
                      name: item
                      class: suggested_action
                      prose: Collect and report software quality metrics such as rates of bug occurrence and severity, time to response, and time to repair (See manage 4.3).
                - id: A-MEASURE_1.2
                  name: guidance
                  class: about
                  prose: Different AI tasks, such as neural networks or natural language processing, benefit from different evaluation techniques. Use-case and particular settings in which the AI system is used also affects appropriateness of the evaluation techniques. Changes in the operational settings, data drift, model drift are among factors that suggest regularly assessing and updating appropriateness of AI metrics and their effectiveness can enhance reliability of AI system measurements.
                - id: D-MEASURE_1.2-1
                  name: guidance
                  class: documentation
                  prose: What metrics has the entity developed to measure performance of the AI system?
                - id: D-MEASURE_1.2-2
                  name: guidance
                  class: documentation
                  prose: To what extent do the metrics provide accurate and useful measure of performance?
                - id: D-MEASURE_1.2-3
                  name: guidance
                  class: documentation
                  prose: What corrective actions has the entity taken to enhance the quality, accuracy, reliability, and representativeness of the data?
                - id: D-MEASURE_1.2-4
                  name: guidance
                  class: documentation
                  prose: How will the accuracy or appropriate performance metrics be assessed?
                - id: D-MEASURE_1.2-5
                  name: guidance
                  class: documentation
                  prose: What is the justification for the metrics selected?
            - id: MEASURE_1.3
              class: subcategory
              title: MEASURE 1.3
              props:
                - name: sort-id
                  value: 00004.00001.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#adcd057c-2f98-472d-9444-efa7cbbcabdd'
                  rel: reference
                - href: '#a0533216-6db0-47ef-b88d-5a44f675cb08'
                  rel: reference
                - href: '#5e66db3b-5610-44d4-85f5-defcdd98b95e'
                  rel: reference
                - href: '#ce2b2ce1-3c5a-4968-86d5-e733ba5bd53a'
                  rel: reference
              parts:
                - id: MEASURE_1.3_ovw
                  name: overview
                  prose: Internal experts who did not serve as front-line developers for the system and/or independent assessors are involved in regular assessments and updates. Domain experts, users, AI actors external to the team that developed or deployed the AI system, and affected communities are consulted in support of assessments as necessary per organizational risk tolerance.
                - id: SA-MEASURE_1.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_1.3-1
                      name: item
                      class: suggested_action
                      prose: Evaluate TEVV processes regarding incentives to identify risks and impacts.
                    - id: SA-MEASURE_1.3-2
                      name: item
                      class: suggested_action
                      prose: Utilize separate testing teams established in the Govern function (2.1and 4.1) to enable independent decisions and course-correction for AI systems. Track processes and measure and document change in performance.
                    - id: SA-MEASURE_1.3-3
                      name: item
                      class: suggested_action
                      prose: Plan and evaluate AI system prototypes with end user populations early and continuously in the AI lifecycle. Document test outcomes and course correct.
                    - id: SA-MEASURE_1.3-4
                      name: item
                      class: suggested_action
                      prose: Assess independence and stature of TEVV and oversight AI actors, to ensure they have the required levels of independence and resources to perform assurance, compliance, and feedback tasks effectively.
                    - id: SA-MEASURE_1.3-5
                      name: item
                      class: suggested_action
                      prose: Evaluate interdisciplinary and demographically diverse internal team established in Map 1.2.
                    - id: SA-MEASURE_1.3-6
                      name: item
                      class: suggested_action
                      prose: Evaluate effectiveness of external stakeholder feedback mechanisms, specifically related to processes for eliciting, evaluating and integrating input from diverse groups.
                    - id: SA-MEASURE_1.3-7
                      name: item
                      class: suggested_action
                      prose: Evaluate effectiveness of external stakeholder feedback mechanisms for enhancing AI actor visibility and decision-making regarding AI system risks and trustworthy characteristics.
                - id: A-MEASURE_1.3
                  name: guidance
                  class: about
                  prose: The current AI systems are brittle, the failure modes are not well described, and the systems are dependent on the context in which they were developed and do not transfer well outside of the training environment. A reliance on local evaluations will be necessary along with a continuous monitoring of these systems. measurements that extend beyond classical measures (which average across test cases) or expand to focus on pockets of failures where there are potentially significant costs can improve the reliability of risk management activities. Feedback from affected communities about how AI systems are being used can make AI evaluation purposeful. Involving internal experts who did not serve as front-line developers for the system and/or independent assessor's regular assessments of AI systems helps a fulsome characterization of AI systems’ performance and trustworthiness.
                - id: D-MEASURE_1.3-1
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-MEASURE_1.3-2
                  name: guidance
                  class: documentation
                  prose: How easily accessible and current is the information available to external stakeholders?
                - id: D-MEASURE_1.3-3
                  name: guidance
                  class: documentation
                  prose: To what extent does the entity communicate its AI strategic goals and objectives to the community of stakeholders?
                - id: D-MEASURE_1.3-4
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
                - id: D-MEASURE_1.3-5
                  name: guidance
                  class: documentation
                  prose: To what extent is this information sufficient and appropriate to promote transparency? Do external stakeholders have access to information on the design, operation, and limitations of the AI system?
                - id: D-MEASURE_1.3-6
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
        - id: MEASURE_2
          class: category
          title: MEASURE 2
          props:
            - name: sort-id
              value: "00004.00002"
          parts:
            - id: MEASURE_2_smt
              name: statement
              prose: AI systems are evaluated for trustworthy characteristics.
          controls:
            - id: MEASURE_2.1
              class: subcategory
              title: MEASURE 2.1
              props:
