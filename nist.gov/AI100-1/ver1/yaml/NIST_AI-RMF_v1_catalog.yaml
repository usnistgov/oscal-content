              parts:
                - id: MEASURE_2.1_ovw
                  name: overview
                  prose: Test sets, metrics, and details about the tools used during test, evaluation, validation, and verification (TEVV) are documented.
                - id: SA-MEASURE_2.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.1-1
                      name: item
                      class: suggested_action
                      prose: 'Leverage existing industry best practices for transparency and documentation of all possible aspects of measurements. Examples include: data sheet for data sets, model cards, (commenters provided examples).'
                    - id: SA-MEASURE_2.1-2
                      name: item
                      class: suggested_action
                      prose: Regularly assess the effectiveness of tools used to document measurement approaches, test sets, metrics, processes and materials used.
                    - id: SA-MEASURE_2.1-3
                      name: item
                      class: suggested_action
                      prose: Update the tools as needed.
                - id: A-MEASURE_2.1
                  name: guidance
                  class: about
                  prose: Documenting measurement approaches, test sets, metrics, processes and materials used, and associated details builds foundation upon which to build a valid, reliable measurement process. Documentation enables repeatability and consistency, and can enhance AI risk management decisions.
                - id: D-MEASURE_2.1-1
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
                - id: D-MEASURE_2.1-2
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the AI system's development, testing methodology, metrics, and performance outcomes?
            - id: MEASURE_2.2
              class: subcategory
              title: MEASURE 2.2
              props:
                - name: sort-id
                  value: 00004.00002.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
