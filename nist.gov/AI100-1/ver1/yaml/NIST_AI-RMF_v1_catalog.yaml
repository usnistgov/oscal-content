                - href: '#f49d9b15-78db-4850-a3ce-850b9128e83c'
                  rel: reference
                - href: '#c8fba743-d448-41f6-b35a-e811dd64aa26'
                  rel: reference
                - href: '#64d9bc4f-0f96-410d-b8a0-16cd9d4ddff5'
                  rel: reference
                - href: '#20953eb1-bcc7-4d1a-a858-d4188d94dfd7'
                  rel: reference
              parts:
                - id: MEASURE_2.3_ovw
                  name: overview
                  prose: AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s). measures are documented.
                - id: SA-MEASURE_2.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.3-1
                      name: item
                      class: suggested_action
                      prose: Conduct regular and sustained engagement with potentially impacted communities.
                    - id: SA-MEASURE_2.3-2
                      name: item
                      class: suggested_action
                      prose: Maintain a demographically diverse and multidisciplinary and collaborative internal team.
                    - id: SA-MEASURE_2.3-3
                      name: item
                      class: suggested_action
                      prose: Regularly test and evaluate systems in non-optimized conditions, and in collaboration with AI actors in user interaction and user experience(UI/UX) roles.
                    - id: SA-MEASURE_2.3-4
                      name: item
                      class: suggested_action
                      prose: Evaluate feedback from stakeholder engagement activities, in collaboration with human factors and socio-technical experts.
                    - id: SA-MEASURE_2.3-5
                      name: item
                      class: suggested_action
                      prose: Collaborate with socio-technical, human factors, and UI/UX experts to identify notable characteristics in context of use that can be translated into system testing scenarios.
                    - id: SA-MEASURE_2.3-6
                      name: item
                      class: suggested_action
                      prose: measure AI systems prior to deployment in conditions similar to expected scenarios.
                    - id: SA-MEASURE_2.3-7
                      name: item
                      class: suggested_action
                      prose: measure and document performance criteria such as validity (false positive rate, false negative rate, etc.) and efficiency (training times, prediction latency, etc.) related to ground truth within the deployment context of use.
                    - id: SA-MEASURE_2.3-8
                      name: item
                      class: suggested_action
                      prose: measure assurance criteria such as AI actor competency and experience.
                    - id: SA-MEASURE_2.3-9
                      name: item
                      class: suggested_action
                      prose: Document differences between measurement setting and the deployment environment(s).
                - id: A-MEASURE_2.3
                  name: guidance
                  class: about
                  prose: The current risk and impact environment suggests AI system performance estimates are insufficient and require a deeper understanding of deployment context of use. Computationally focused performance testing and evaluation schemes are restricted to test data sets and in silico techniques. These approaches do not directly evaluate risks and impacts in real world environments and can only predict what might create impact based on an approximation of expected AI use. To properly manage risks, more direct information is necessary to understand how and under what conditions deployed AI creates impacts, who is most likely to be impacted, and what that experience is like.
                - id: D-MEASURE_2.3-1
                  name: guidance
                  class: documentation
                  prose: What experiments were initially run on this dataset? To what extent have experiments on the AI system been documented?
                - id: D-MEASURE_2.3-2
                  name: guidance
                  class: documentation
                  prose: To what extent does the system/entity consistently measure progress towards stated goals and objectives?
                - id: D-MEASURE_2.3-3
                  name: guidance
                  class: documentation
                  prose: How will the appropriate performance metrics, such as accuracy, of the AI be monitored after the AI is deployed? How much distributional shift or model drift from baseline performance is acceptable?
                - id: D-MEASURE_2.3-4
                  name: guidance
                  class: documentation
                  prose: As time passes and conditions change, is the training data still representative of the operational environment?
                - id: D-MEASURE_2.3-5
                  name: guidance
                  class: documentation
                  prose: What testing, if any, has the entity conducted on the AI system to identify errors and limitations (i.e., adversarial or stress testing)?
            - id: MEASURE_2.4
              class: subcategory
              title: MEASURE 2.4
              props:
                - name: sort-id
                  value: 00004.00002.00004
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#c6b3a390-b4be-4cdd-a016-b3b6484f7242'
                  rel: reference
                - href: '#f8de7163-d316-4547-a02f-72167c7d28aa'
                  rel: reference
              parts:
                - id: MEASURE_2.4_ovw
                  name: overview
                  prose: The functionality and behavior of the AI system and its components – as identified in the MAP function – are monitored when in production.
                - id: SA-MEASURE_2.4
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MEASURE_2.4-1
                      name: item
                      class: suggested_action
                      prose: Monitor and document how metrics and performance indicators observed in production differ from the same metrics collected during pre-deployment testing. When differences are observed, consider error propagation and feedback loop risks.
                    - id: SA-MEASURE_2.4-2
                      name: item
                      class: suggested_action
                      prose: Utilize hypothesis testing or human domain expertise to measure monitored distribution differences in new input or output data relative to test environments
                    - id: SA-MEASURE_2.4-3
                      name: item
                      class: suggested_action
                      prose: Monitor for anomalies using approaches such as control limits, confidence intervals, integrity constraints and ML algorithms. When anomalies are observed, consider error propagation and feedback loop risks.
                    - id: SA-MEASURE_2.4-4
                      name: item
                      class: suggested_action
                      prose: Verify alerts are in place for when distributions in new input data or generated predictions observed in production differ from pre-deployment test outcomes, or when anomalies are detected.
                    - id: SA-MEASURE_2.4-5
                      name: item
                      class: suggested_action
                      prose: Assess the accuracy and quality of generated outputs against new collected ground-truth information as it becomes available.
                    - id: SA-MEASURE_2.4-6
                      name: item
                      class: suggested_action
                      prose: Utilize human review to track processing of unexpected data and reliability of generated outputs; warn system users when outputs maybe unreliable. Verify that human overseers responsible for these processes have clearly defined responsibilities and training for specified tasks.
                    - id: SA-MEASURE_2.4-7
                      name: item
                      class: suggested_action
                      prose: Collect uses cases from the operational environment for system testing and monitoring activities in accordance with organizational policies and regulatory or disciplinary requirements (e.g., informed consent, institutional review board approval, human research protections),
                - id: A-MEASURE_2.4
                  name: guidance
                  class: about
                  prose: AI systems may encounter new issues and risks while in production as the environment evolves over time. This effect, often referred to as “drift\", means AI systems no longer meet the assumptions and limitations of the original design. Regular monitoring allows AI Actors to monitor the functionality and behavior of the AI system and its components – as identified in the MAP function - and enhance the speed and efficacy of necessary system interventions.
                - id: D-MEASURE_2.4-1
                  name: guidance
                  class: documentation
                  prose: To what extent is the output of each component appropriate for the operational context?
                - id: D-MEASURE_2.4-2
                  name: guidance
                  class: documentation
                  prose: What justifications, if any, has the entity provided for the assumptions, boundaries, and limitations of the AI system?
                - id: D-MEASURE_2.4-3
                  name: guidance
                  class: documentation
                  prose: How will the appropriate performance metrics, such as accuracy, of the AI be monitored after the AI is deployed?
                - id: D-MEASURE_2.4-4
                  name: guidance
                  class: documentation
                  prose: As time passes and conditions change, is the training data still representative of the operational environment?
            - id: MEASURE_2.5
              class: subcategory
              title: MEASURE 2.5
              props:
                - name: sort-id
                  value: 00004.00002.00005
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#612a4a38-2219-409b-b2bd-fffe4e125d79'
