                  rel: reference
              parts:
                - id: MAP_1.3_ovw
                  name: overview
                  prose: The organization’s mission and relevant goals for the AI technology are understood and documented.
                - id: SA-MAP_1.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_1.3-1
                      name: item
                      class: suggested_action
                      prose: Build transparent practices into AI system development processes.
                    - id: SA-MAP_1.3-2
                      name: item
                      class: suggested_action
                      prose: Review the documented system purpose from a socio-technical perspective and in consideration of societal values.
                    - id: SA-MAP_1.3-3
                      name: item
                      class: suggested_action
                      prose: Determine possible misalignment between societal values and stated organizational principles and code of ethics.
                    - id: SA-MAP_1.3-4
                      name: item
                      class: suggested_action
                      prose: Flag latent incentives that may contribute to negative impacts.
                    - id: SA-MAP_1.3-5
                      name: item
                      class: suggested_action
                      prose: Evaluate AI system purpose in consideration of potential risks, societal values, and stated organizational principles.
                - id: A-MAP_1.3
                  name: guidance
                  class: about
                  prose: Defining and documenting the specific business purpose of an AI systemin a broader context of societal values helps teams to evaluate risks and increases the clarity of “go/no-go” decisions about whether to deploy. Trustworthy AI technologies may present a demonstrable business benefit beyond implicit or explicit costs, provide added value, and don't lead to wasted resources. Organizations can feel confident in performing risk avoidance if the implicit or explicit risks outweigh the advantages of AI systems, and not implementing an AI solution whose risks surpass potential benefits. For example, making AI systems more equitable can result in better managed risk, and can help enhance consideration of the business value of making inclusively designed, accessible and more equitable AI systems.
                - id: D-MAP_1.3-1
                  name: guidance
                  class: documentation
                  prose: How does the AI system help the entity meet its goals and objectives?
                - id: D-MAP_1.3-2
                  name: guidance
                  class: documentation
                  prose: How do the technical specifications and requirements align with the AI system's goals and objectives?
                - id: D-MAP_1.3-3
                  name: guidance
                  class: documentation
                  prose: To what extent is the output appropriate for the operational context?
            - id: MAP_1.4
              class: subcategory
              title: MAP 1.4
              props:
                - name: sort-id
                  value: 00003.00001.00004
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#c00dd7ea-dabc-4ae8-9ada-2ff3f30a2075'
                  rel: reference
                - href: '#c7a0b99f-58c8-4d52-a739-2bf6ef567a8f'
                  rel: reference
                - href: '#af2e763a-4beb-4e87-bc43-2a9f1f5750c3'
                  rel: reference
                - href: '#3e09b58c-9cb5-426f-95f7-8803ddb77eba'
                  rel: reference
                - href: '#e733f527-df46-400d-9723-2f377f190cc4'
                  rel: reference
              parts:
                - id: MAP_1.4_ovw
                  name: overview
                  prose: The business value or context of business use has been clearly defined or– in the case of assessing existing AI systems – re-evaluated.
                - id: SA-MAP_1.4
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_1.4-1
                      name: item
                      class: suggested_action
                      prose: Document business value or context of business use
                    - id: SA-MAP_1.4-2
                      name: item
                      class: suggested_action
                      prose: Reconcile documented concerns about the system’s purpose within the business context of use compared to the organization’s stated values, mission statements, social responsibility commitments, and AI principles.
                    - id: SA-MAP_1.4-3
                      name: item
                      class: suggested_action
                      prose: Reconsider the design, implementation strategy, or deployment of AI systems with potential impacts that do not reflect institutional values.
                - id: A-MAP_1.4
                  name: guidance
                  class: about
                  prose: Socio-technical AI risks emerge from the interplay between technical development decisions and how a system is used, who operates it, and the social context into which it is deployed. Addressing these risks is complex and requires a commitment to understanding how contextual factors may interact with AI lifecycle actions. One such contextual factor is how organizational mission and identified system purpose create incentives within AI system design, development, and deployment tasks that may result in positive and negative impacts. By establishing comprehensive and explicit enumeration of AI systems’ context of business use and expectations, organizations can identify and manage these types of risks.
                - id: D-MAP_1.4-1
                  name: guidance
                  class: documentation
                  prose: What goals and objectives does the entity expect to achieve by designing, developing, and/or deploying the AI system?
                - id: D-MAP_1.4-2
                  name: guidance
                  class: documentation
                  prose: To what extent are the system outputs consistent with the entity's values and principles to foster public trust and equity?
                - id: D-MAP_1.4-3
                  name: guidance
                  class: documentation
                  prose: To what extent are the metrics consistent with system goals, objectives, and constraints, including ethical and compliance considerations?
            - id: MAP_1.5
              class: subcategory
              title: MAP 1.5
              props:
                - name: sort-id
                  value: 00003.00001.00005
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#d97c1447-ebc5-40ff-8a8f-65c7829be747'
                  rel: reference
                - href: '#eb301bbf-8cdd-4658-87c8-2d7968b5326e'
                  rel: reference
                - href: '#77d26dce-c267-4d09-aa97-8395d3e6e8a6'
                  rel: reference
                - href: '#ad15b47a-bc3e-4c34-89b0-8678ccf6ca28'
                  rel: reference
                - href: '#c5d6c284-5526-407c-9f9b-22b6df14c24f'
                  rel: reference
              parts:
                - id: MAP_1.5_ovw
                  name: overview
                  prose: Organizational risk tolerances are determined and documented.
                - id: SA-MAP_1.5
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_1.5-1
                      name: item
                      class: suggested_action
                      prose: Utilize existing regulations and guidelines for risk criteria, tolerance and response established by organizational, domain, discipline, sector, or professional requirements.
                    - id: SA-MAP_1.5-2
                      name: item
                      class: suggested_action
                      prose: Establish risk tolerance levels for AI systems and allocate the appropriate oversight resources to each level.
                    - id: SA-MAP_1.5-3
                      name: item
                      class: suggested_action
                      prose: Establish risk criteria in consideration of different sources of risk, (e.g., financial, operational, safety and wellbeing, business, reputational, and model risks) and different levels of risk (e.g., from negligible to critical).
                    - id: SA-MAP_1.5-4
                      name: item
                      class: suggested_action
                      prose: Identify maximum allowable risk tolerance above which the system will not be deployed, or will need to be prematurely decommissioned, within the contextual or application setting.
                    - id: SA-MAP_1.5-5
                      name: item
                      class: suggested_action
                      prose: 'Articulate and analyze tradeoffs across trustworthiness characteristics as relevant to proposed context of use. When tradeoffs arise, document them and plan for traceable actions (e.g.: impact mitigation, removal of system from development or use) to inform management decisions.'
                    - id: SA-MAP_1.5-6
                      name: item
                      class: suggested_action
                      prose: Review uses of AI systems for “off-label” purposes, especially insetting's that organizations have deemed as high-risk. Document decisions, risk-related trade-offs, and system limitations.
                - id: A-MAP_1.5
                  name: guidance
                  class: about
                  prose: Risk tolerance reflects the level and type of risk the organization is willing to accept while conducting its mission and carrying out its strategy. Organizations can follow existing regulations and guidelines for risk criteria, tolerance and response established by organizational, domain, discipline, sector, or professional requirements. Some sectors or industries may have established definitions of harm or may have established documentation, reporting, and disclosure requirements. Within sectors, risk management may depend on existing guidelines for specific applications and use case settings. Where established guidelines do not exist, organizations will want to define reasonable risk tolerance inconsideration of different sources of risk (e.g., financial, operational, safety and wellbeing, business, reputational, and model risks) and different levels of risk (e.g., from negligible to critical). Risk tolerances inform and support decisions about whether to continue with development or deployment - termed “go/no-go”. Go/no-go decisions related to AI system risks can take stakeholder feedback into account but remain independent from stakeholders’ vested financial or reputational interests. If mapping risk is prohibitively difficult, a "no-go" decision may be considered for the specific system.
                - id: D-MAP_1.5-1
                  name: guidance
                  class: documentation
                  prose: Which existing regulations and guidelines apply, and the entity has followed, in the development of system risk tolerances?
                - id: D-MAP_1.5-2
                  name: guidance
                  class: documentation
                  prose: What criteria and assumptions has the entity utilized when developing system risk tolerances?
                - id: D-MAP_1.5-3
                  name: guidance
                  class: documentation
                  prose: How has the entity identified maximum allowable risk tolerance?
                - id: D-MAP_1.5-4
                  name: guidance
                  class: documentation
                  prose: What conditions and purposes are considered “off-label” for system use?
            - id: MAP_1.6
              class: subcategory
              title: MAP 1.6
              props:
                - name: sort-id
                  value: 00003.00001.00006
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#4898b93b-f87a-4a85-89c9-bbd7bd06c2ac'
                  rel: resource
                - href: '#0a72c54e-8fc6-4c7e-9764-4a0a62e0f5a0'
                  rel: resource
                - href: '#b9166920-88de-45d5-a426-7b01ceab7559'
                  rel: reference
                - href: '#fc49e665-f3bf-408c-80a6-c7b25804f0c5'
                  rel: reference
                - href: '#0579462a-0804-4474-8837-1874099f4535'
                  rel: reference
                - href: '#43cb10f3-1039-4fb3-9afe-b470a09a7eb2'
                  rel: reference
                - href: '#e561f689-0d85-4dbb-bd28-e3d7173ef28a'
                  rel: reference
                - href: '#57bbca56-7854-4405-98b8-a631464bd893'
                  rel: reference
                - href: '#aec942cb-8f94-4f6a-955e-02e194bbca53'
                  rel: reference
                - href: '#01b875a6-a4c7-4988-86e6-e909b9607ad3'
                  rel: reference
              parts:
                - id: MAP_1.6_ovw
                  name: overview
                  prose: System requirements (e.g., “the system shall respect the privacy of its users”) are elicited from and understood by relevant AI actors. Design decisions take socio-technical implications into account to address AI risks.
                - id: SA-MAP_1.6
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_1.6-1
                      name: item
                      class: suggested_action
                      prose: Proactively incorporate trustworthy characteristics into system requirements.
                    - id: SA-MAP_1.6-2
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms for regular communication and feedback between relevant AI actors and internal or external stakeholders related to system design or deployment decisions.
                    - id: SA-MAP_1.6-3
                      name: item
                      class: suggested_action
                      prose: Develop and standardize practices to assess potential impacts at all stages of the AI lifecycle, and in collaboration with interdisciplinary experts, actors external to the team that developed or deployed the AI system, and potentially impacted communities .
                    - id: SA-MAP_1.6-4
                      name: item
                      class: suggested_action
                      prose: Include potentially impacted groups, communities and external entities(e.g., civil society organizations, research institutes, local community groups, and trade associations) in the formulation of priorities, definitions and outcomes during impact assessment activities.
                    - id: SA-MAP_1.6-5
                      name: item
                      class: suggested_action
                      prose: Conduct qualitative interviews with end user(s) to regularly evaluate expectations and design plans related to Human-AI configurations and tasks.
                    - id: SA-MAP_1.6-6
                      name: item
                      class: suggested_action
                      prose: Analyze dependencies between contextual factors and system requirements. List potential impacts that may arise from not fully considering the importance of trustworthiness characteristics in any decision making.
                    - id: SA-MAP_1.6-7
                      name: item
                      class: suggested_action
                      prose: Follow responsible design techniques in tasks such as software engineering, product management, and participatory engagement. Some examples for eliciting and documenting stakeholder requirements include product requirement documents (PRDs), user stories, user interaction/user experience (UI/UX) research, systems engineering, ethnography and related field methods.
                    - id: SA-MAP_1.6-8
                      name: item
                      class: suggested_action
                      prose: Conduct user research to understand individuals, groups and communities that will be impacted by the AI, their values & context, and the role of systemic and historical biases. Integrate learnings into decisions about data selection and representation.
                - id: A-MAP_1.6
                  name: guidance
                  class: about
                  prose: AI system development requirements may outpace documentation processes for traditional software. When written requirements are unavailable or incomplete, AI actors may inadvertently overlook business and stakeholder needs, over-rely on implicit human biases such as confirmation bias and groupthink, and maintain exclusive focus on computational requirements. Eliciting system requirements, designing for end users, and considering societal impacts early in the design phase is a priority that can enhance AI systems’ trustworthiness.
                - id: D-MAP_1.6-1
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
                - id: D-MAP_1.6-2
                  name: guidance
                  class: documentation
                  prose: To what extent is this information sufficient and appropriate to promote transparency? Promote transparency by enabling external stakeholders to access information on the design, operation, and limitations of the AI system.
                - id: D-MAP_1.6-3
                  name: guidance
                  class: documentation
                  prose: To what extent has relevant information been disclosed regarding the use of AI systems, such as (a) what the system is for, (b) what it is not for, (c) how it was designed, and (d) what its limitations are?(Documentation and external communication can offer a way for entities to provide transparency.)
                - id: D-MAP_1.6-4
                  name: guidance
                  class: documentation
                  prose: How will the relevant AI actor(s) address changes in accuracy and precision due to either an adversary’s attempts to disrupt the AI system or unrelated changes in the operational/business environment, which may impact the accuracy of the AI system?
                - id: D-MAP_1.6-5
                  name: guidance
                  class: documentation
                  prose: What metrics has the entity developed to measure performance of the AI system?
                - id: D-MAP_1.6-6
                  name: guidance
                  class: documentation
                  prose: What justifications, if any, has the entity provided for the assumptions, boundaries, and limitations of the AI system?
        - id: MAP_2
          class: category
          title: MAP 2
          props:
            - name: sort-id
              value: "00003.00002"
          parts:
            - id: MAP_2_smt
              name: statement
              prose: Categorization of the AI system is performed.
          controls:
            - id: MAP_2.1
              class: subcategory
              title: MAP 2.1
              props:
                - name: sort-id
                  value: 00003.00002.00001
              links:
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
