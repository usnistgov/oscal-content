                  rel: reference
                - href: '#a610b404-a8e1-4839-9268-5db82c39ff7c'
                  rel: reference
              parts:
                - id: MAP_2.1_ovw
                  name: overview
                  prose: The specific task, and methods used to implement the task, that the AI system will support is defined (e.g., classifiers, generative models, recommenders).
                - id: SA-MAP_2.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_2.1-1
                      name: item
                      class: suggested_action
                      prose: Define and document AI system’s existing and potential learning task(s) along with known assumptions and limitations.
                - id: A-MAP_2.1
                  name: guidance
                  class: about
                  prose: AI actors define the technical learning or decision-making task(s) an AI system is designed to accomplish, or the benefits that the system will provide. The clearer and narrower the task definition, the easier it is to map its benefits and risks, leading to more fulsome risk management.
                - id: D-MAP_2.1-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clearly defined technical specifications and requirements for the AI system?
                - id: D-MAP_2.1-2
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the AI system's development, testing methodology, metrics, and performance outcomes?
                - id: D-MAP_2.1-3
                  name: guidance
                  class: documentation
                  prose: How do the technical specifications and requirements align with the AI system's goals and objectives?
                - id: D-MAP_2.1-4
                  name: guidance
                  class: documentation
                  prose: Did your organization implement accountability-based practices in data management and protection (e.g., the PDPA and OECD Privacy Principles)?
                - id: D-MAP_2.1-5
                  name: guidance
                  class: documentation
                  prose: How are outputs marked to clearly show that they came from an AI?
            - id: MAP_2.2
              class: subcategory
              title: MAP 2.2
              props:
                - name: sort-id
                  value: 00003.00002.00002
              links:
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
