                  rel: reference
                - href: '#9f951617-cdf0-4698-a3b4-12017151a3ff'
                  rel: reference
                - href: '#2214e51c-337a-4b9b-8755-fa8fee41afe1'
                  rel: reference
                - href: '#a588cbdf-4779-4ebc-ba72-839c334782a3'
                  rel: reference
                - href: '#144e97a2-5404-469b-8fcd-12309e468ad8'
                  rel: reference
                - href: '#444335c5-f83c-4878-aced-f88660b8f0c4'
                  rel: reference
                - href: '#073a14f2-8fe6-47d4-ac34-cb8ec0eed1f1'
                  rel: reference
              parts:
                - id: MAP_2.2_ovw
                  name: overview
                  prose: Information about the AI system’s knowledge limits and how system output may be utilized and overseen by humans is documented. Documentation provides sufficient information to assist relevant AI actors when making informed decisions and taking subsequent actions.
                - id: SA-MAP_2.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MAP_2.2-1
                      name: item
                      class: suggested_action
                      prose: Document settings, environments and conditions that are outside the AI system’s intended use.
                    - id: SA-MAP_2.2-2
                      name: item
                      class: suggested_action
                      prose: Design for end user workflows and toolsets, concept of operations, and explain ability and interpretability criteria in conjunction with end user(s)and associated qualitative feedback.
                    - id: SA-MAP_2.2-3
                      name: item
                      class: suggested_action
                      prose: Plan and test human-AI configurations under close to real-world conditions and document results.
                    - id: SA-MAP_2.2-4
                      name: item
                      class: suggested_action
                      prose: Follow stakeholder feedback processes to determine whether a system achieved its documented purpose within a given use context, and whether end users can correctly comprehend system outputs or results.
                    - id: SA-MAP_2.2-5
                      name: item
                      class: suggested_action
                      prose: Document dependencies on upstream data and other AI systems, including if the specified system is an upstream dependency for another AI system or other data.
                    - id: SA-MAP_2.2-6
                      name: item
                      class: suggested_action
                      prose: Document connections the AI system or data will have to external networks (including the internet), financial markets, and critical infrastructure that have potential for negative externalities. Identify and document negative impacts as part of considering the broader risk thresholds and subsequent go/no-go deployment as well as post-deployment decommissioning decisions.
                - id: A-MAP_2.2
                  name: guidance
                  class: about
                  prose: An AI lifecycle consists of many interdependent activities involving a diverse set of actors that often do not have full visibility or control over other parts of the lifecycle and its associated contexts or risks. The interdependencies between these activities, and among the relevant AI actors and organizations, can make it difficult to reliably anticipate potential impacts of AI systems. For example, early decisions in identifying the purpose and objective of an AI system can alter its behavior and capabilities, and the dynamics of deployment setting (such as end users or impacted individuals) can shape the positive or negative impacts of AI system decisions. As a result, the best intentions within one dimension of the AI lifecycle can be undermined via interactions with decisions and conditions in other, later activities. This complexity and varying levels of visibility can introduce uncertainty. And, once deployed and in use, AI systems may sometimes perform poorly, manifest unanticipated negative impacts, or violate legal or ethical norms. These risks and incidents can result from a variety of factors. For example, downstream decisions can be influenced by end user over-trust or under-trust, and other complexities related to AI-supported decision-making. Anticipating, articulating, assessing and documenting AI systems' knowledge limits and how system output may be utilized and overseen by humans can help mitigate the uncertainty associated with the realities of AI system deployments. Rigorous design processes include defining system knowledge limits, which are confirmed and refined based on TEVV processes.
                - id: D-MAP_2.2-1
                  name: guidance
                  class: documentation
                  prose: Does the AI system provide sufficient information to assist the personnel to make an informed decision and take actions accordingly?
                - id: D-MAP_2.2-2
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
                - id: D-MAP_2.2-3
                  name: guidance
                  class: documentation
                  prose: Based on the assessment, did your organization implement the appropriate level of human involvement in AI-augmented decision-making?
