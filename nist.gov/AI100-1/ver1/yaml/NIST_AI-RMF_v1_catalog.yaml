                  rel: reference
                - href: '#ce82bc01-e00e-4e8e-931a-8f021cce1f83'
                  rel: reference
                - href: '#9fa65dda-6aca-40e6-881e-a4c5a8f48605'
                  rel: reference
                - href: '#b57f2f65-d4cb-49b0-88de-a43717a2eef8'
                  rel: reference
                - href: '#ca7eb1b6-eb64-493e-906f-0d0a38b53c0e'
                  rel: reference
                - href: '#e0d3aaa2-b736-4f21-b4e2-e8432361283f'
                  rel: reference
                - href: '#a15541df-57e5-42f0-ab26-a0e478e85dd7'
                  rel: reference
              parts:
                - id: GOVERN_1.4_ovw
                  name: overview
                  prose: The risk management process and its outcomes are established through transparent policies, procedures, and other controls based on organizational risk priorities.
                - id: SA-GOVERN_1.4
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.4-1
                      name: item
                      class: suggested_action
                      prose: 'Establish and regularly review documentation policies that, among others, address information related to:'
                    - id: SA-GOVERN_1.4-1.1
                      name: item
                      class: suggested_action
                      prose: AI actors contact information
                    - id: SA-GOVERN_1.4-1.2
                      name: item
                      class: suggested_action
                      prose: Business justification
                    - id: SA-GOVERN_1.4-1.3
                      name: item
                      class: suggested_action
                      prose: Scope and usages
                    - id: SA-GOVERN_1.4-1.4
                      name: item
                      class: suggested_action
                      prose: Expected and potential risks and impacts
                    - id: SA-GOVERN_1.4-1.5
                      name: item
                      class: suggested_action
                      prose: Assumptions and limitations
                    - id: SA-GOVERN_1.4-1.6
                      name: item
                      class: suggested_action
                      prose: Description and characterization of training data
                    - id: SA-GOVERN_1.4-1.7
                      name: item
                      class: suggested_action
                      prose: Algorithmic methodology
                    - id: SA-GOVERN_1.4-1.8
                      name: item
                      class: suggested_action
                      prose: Evaluated alternative approaches
                    - id: SA-GOVERN_1.4-1.9
                      name: item
                      class: suggested_action
                      prose: Description of output data
                    - id: SA-GOVERN_1.4-1.10
                      name: item
                      class: suggested_action
                      prose: Testing and validation results (including explanatory visualizations and information)
                    - id: SA-GOVERN_1.4-1.11
                      name: item
                      class: suggested_action
                      prose: Down- and up-stream dependencies
                    - id: SA-GOVERN_1.4-1.12
                      name: item
                      class: suggested_action
                      prose: Plans for deployment, monitoring, and change management
                    - id: SA-GOVERN_1.4-1.13
                      name: item
                      class: suggested_action
                      prose: Stakeholder engagement Plans
                    - id: SA-GOVERN_1.4-2
                      name: item
                      class: suggested_action
                      prose: Verify documentation policies for AI systems are standardized across the organization and remain current.
                    - id: SA-GOVERN_1.4-3
                      name: item
                      class: suggested_action
                      prose: Establish policies for a model documentation inventory system and regularly review its completeness, usability, and efficacy.
                    - id: SA-GOVERN_1.4-4
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms to regularly review the efficacy of risk management processes.
                    - id: SA-GOVERN_1.4-5
                      name: item
                      class: suggested_action
                      prose: Identify AI actors responsible for evaluating efficacy of risk management processes and approaches, and for course-correction based on results.
                    - id: SA-GOVERN_1.4-6
                      name: item
                      class: suggested_action
                      prose: Establish policies and processes regarding public disclosure of the use of AI and risk management material such as impact assessments, audits, model documentation and validation and testing results.
                    - id: SA-GOVERN_1.4-7
                      name: item
                      class: suggested_action
                      prose: Document and review the use and efficacy of different types of transparency tools and follow industry standards at the time a model is in use.
                - id: A-GOVERN_1.4
                  name: guidance
                  class: about
                  prose: Clear policies and procedures relating to documentation and transparency facilitate and enhance efforts to communicate roles and responsibilities for the Map, measure and manage functions across the AI lifecycle. Standardized documentation can help organizations systematically integrate AI risk management processes and enhance accountability efforts. For example, by adding their contact information to a work product document, AI actors can improve communication, increase ownership of work products, and potentially enhance consideration of product quality. Documentation may generate downstream benefits related to improved system replicability and robustness. Proper documentation storage and access procedures allow for quick retrieval of critical information during a negative incident. Explainable machine learning efforts (models and explanatory methods) may bolster technical documentation practices by introducing additional information for review and interpretation by AI Actors.
                - id: D-GOVERN_1.4-1
                  name: guidance
                  class: documentation
                  prose: How do system performance metrics inform risk tolerance decisions?
                - id: D-GOVERN_1.4-2
                  name: guidance
                  class: documentation
                  prose: What policies has the entity developed to ensure the use of the AI system is consistent with organizational risk tolerance?
                - id: D-GOVERN_1.4-3
                  name: guidance
                  class: documentation
                  prose: How do the entity’s data security and privacy assessments inform risk tolerance decisions?
            - id: GOVERN_1.5
              class: subcategory
              title: GOVERN 1.5
              props:
                - name: sort-id
                  value: 00001.00001.00005
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#f036a208-bfc1-4fd3-809e-8f689c8d1bb0'
                  rel: reference
                - href: '#0a7daffc-cde8-4192-9874-b7851e993ed7'
                  rel: reference
              parts:
                - id: GOVERN_1.5_ovw
                  name: overview
                  prose: Ongoing monitoring and periodic review of the risk management process and its outcomes are planned, organizational roles and responsibilities are clearly defined, including determining the frequency of periodic review.
                - id: SA-GOVERN_1.5
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.5-1
                      name: item
                      class: suggested_action
                      prose: Establish policies to allocate appropriate resources and capacity for assessing impacts of AI systems on individuals, communities and society.
                    - id: SA-GOVERN_1.5-2
                      name: item
                      class: suggested_action
                      prose: Establish policies and procedures for monitoring and addressing AI system performance and trustworthiness, including bias and security problems, across the lifecycle of the system.
                    - id: SA-GOVERN_1.5-3
                      name: item
                      class: suggested_action
                      prose: Establish policies for AI system incident response or confirm that existing incident response policies apply to AI systems.
                    - id: SA-GOVERN_1.5-4
                      name: item
                      class: suggested_action
                      prose: Establish policies to define organizational functions and personnel responsible for AI system monitoring and incident response activities.
                    - id: SA-GOVERN_1.5-5
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms to enable the sharing of feedback from impacted individuals or communities about negative impacts from AI systems.
                    - id: SA-GOVERN_1.5-6
                      name: item
                      class: suggested_action
                      prose: Establish mechanisms to provide recourse for impacted individuals or communities to contest problematic AI system outcomes.
                    - id: SA-GOVERN_1.5-7
                      name: item
                      class: suggested_action
                      prose: Establish opt-out mechanisms.
                - id: A-GOVERN_1.5
                  name: guidance
                  class: about
                  prose: AI systems are dynamic and may perform in unexpected ways once deployed or after deployment. Continuous monitoring is a risk management process for tracking unexpected issues and performance changes, in real-time or at a specific frequency, across the AI system lifecycle. Incident response and “appeal and override” are commonly used processes in information technology management. These processes enable real-time flagging of potential incidents, and human adjudication of system outcomes. Establishing and maintaining incident response plans can reduce the likelihood of additive impacts during an AI incident. Smaller organizations which may not have fulsome governance programs, can utilize incident response plans for addressing system failures, abuse or misuse.
                - id: D-GOVERN_1.5-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the system/entity consistently measure progress towards stated goals and objectives?
                - id: D-GOVERN_1.5-2
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-GOVERN_1.5-3
                  name: guidance
                  class: documentation
                  prose: Did your organization address usability problems and test whether user interfaces served their intended purposes?
            - id: GOVERN_1.6
              class: subcategory
              title: GOVERN 1.6
              props:
                - name: sort-id
                  value: 00001.00001.00006
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#731a2f75-8752-4a4a-b816-80d31925f694'
                  rel: reference
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
                - href: '#5fa977aa-0f93-45bc-bc44-81631358a476'
                  rel: reference
              parts:
                - id: GOVERN_1.6_ovw
                  name: overview
                  prose: Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities.
                - id: SA-GOVERN_1.6
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.6-1
                      name: item
                      class: suggested_action
                      prose: Establish policies that define the creation and maintenance of AI system inventories.
                    - id: SA-GOVERN_1.6-2
                      name: item
                      class: suggested_action
                      prose: Establish policies that define a specific individual or team that is responsible for maintaining the inventory.
                    - id: SA-GOVERN_1.6-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that define which models or systems are inventoried, with preference to inventorying all models or systems, or minimally, to high-risk models or systems, or systems deployed in high-stakes settings.
                    - id: SA-GOVERN_1.6-4
                      name: item
                      class: suggested_action
                      prose: Establish policies that define model or system attributes to be inventoried, e.g., documentation, links to source code, incident response plans, data dictionaries, AI actor contact information.
                - id: A-GOVERN_1.6
                  name: guidance
                  class: about
                  prose: 'An AI system inventory is an organized database of artifacts relating to an AI system or model. It may include system documentation, incident response plans, data dictionaries, links to implementation software or source code, names and contact information for relevant AI actors, or other information that may be helpful for model or system maintenance and incident response purposes. AI system inventories also enable a holistic view of organizational AI assets. A serviceable AI system inventory may allow for the quick resolution of: - specific queries for single models, such as “when was this model last refreshed?”- high-level queries across all models, such as, “how many models are currently deployed within our organization?” or “how many users are impacted by our models?” AI system inventories are a common element of traditional model risk management approaches and can provide technical, business and risk management benefits. Typically inventories capture all organizational models or systems, as partial inventories may not provide the value of a full inventory.'
                - id: D-GOVERN_1.6-1
                  name: guidance
                  class: documentation
                  prose: Who is responsible for documenting and maintaining the AI system inventory details?
                - id: D-GOVERN_1.6-2
                  name: guidance
                  class: documentation
                  prose: What processes exist for data generation, acquisition/collection, ingestion, staging/storage, transformations, security, maintenance, and dissemination?
                - id: D-GOVERN_1.6-3
                  name: guidance
                  class: documentation
                  prose: Given the purpose of this AI, what is an appropriate interval for checking whether it is still accurate, unbiased, explainable, etc.? What are the checks for this model?
            - id: GOVERN_1.7
              class: subcategory
              title: GOVERN 1.7
              props:
                - name: sort-id
                  value: 00001.00001.00007
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#e5e604e2-3016-43a9-b1ef-f727ae87645d'
                  rel: reference
                - href: '#f99f27df-d487-4d9d-bda1-b800b1611d53'
                  rel: reference
                - href: '#ce2b2ce1-3c5a-4968-86d5-e733ba5bd53a'
                  rel: reference
                - href: '#dd70c26e-24d7-42ef-9f28-517a214a5470'
                  rel: reference
              parts:
                - id: GOVERN_1.7_ovw
                  name: overview
                  prose: Processes and procedures are in place for decommissioning and phasing out of AI systems safely and in a manner that does not increase risks or decrease the organization’s trustworthiness.
                - id: SA-GOVERN_1.7
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_1.7-1
                      name: item
                      class: suggested_action
                      prose: 'Establish policies for decommissioning AI systems. Such policies typically address:'
                    - id: SA-GOVERN_1.7-1.1
                      name: item
                      class: suggested_action
                      prose: User and community concerns, and reputational risks.
                    - id: SA-GOVERN_1.7-1.2
                      name: item
                      class: suggested_action
                      prose: Business continuity and financial risks.
                    - id: SA-GOVERN_1.7-1.3
                      name: item
                      class: suggested_action
                      prose: Up and downstream system dependencies.
                    - id: SA-GOVERN_1.7-1.4
                      name: item
                      class: suggested_action
                      prose: Regulatory requirements (e.g., data retention).
                    - id: SA-GOVERN_1.7-1.5
                      name: item
                      class: suggested_action
                      prose: Potential future legal, Regulatory, security or forensic investigations.
                    - id: SA-GOVERN_1.7-1.6
                      name: item
                      class: suggested_action
                      prose: Migration to the replacement system, if appropriate.
                    - id: SA-GOVERN_1.7-2
                      name: item
                      class: suggested_action
                      prose: Establish policies that delineate where and for how long decommissioned systems, models and related artifacts are stored.
                    - id: SA-GOVERN_1.7-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that address ancillary data or artifacts that must be preserved for fulsome understanding or execution of the decommissioned AI system, e.g., predictions, explanations, intermediate input feature representations, usernames and passwords, etc.
                - id: A-GOVERN_1.7
                  name: guidance
                  class: about
                  prose: Irregular or indiscriminate termination or deletion of models or AI systems may be inappropriate and increase organizational risk. For example, AI systems may be subject to regulatory requirements or implicated in future security or legal investigations. To maintain trust, organizations may consider establishing policies and processes for the systematic and deliberate decommissioning of AI systems. Typically, such policies consider user and community concerns, risks in dependent and linked systems, and security, legal or regulatory concerns. Decommissioned models or systems may be stored in a model inventory along with active models, for an established length of time.
                - id: D-GOVERN_1.7-1
                  name: guidance
                  class: documentation
                  prose: What processes exist for data generation, acquisition/collection, ingestion, staging/storage, transformations, security, maintenance, and dissemination?
                - id: D-GOVERN_1.7-2
                  name: guidance
                  class: documentation
                  prose: To what extent do these policies foster public trust and confidence in the use of the AI system?
                - id: D-GOVERN_1.7-3
                  name: guidance
                  class: documentation
                  prose: If anyone believes that the AI no longer meets this ethical framework, who will be responsible for receiving the concern and as appropriate investigating and remediating the issue? Do they have authority to modify, limit, or stop the use of the AI?
                - id: D-GOVERN_1.7-4
                  name: guidance
                  class: documentation
                  prose: If it relates to people, were there any ethical review applications/reviews/approvals? (e.g., Institutional Review Board applications)
        - id: GOVERN_2
          class: category
          title: GOVERN 2
          props:
            - name: sort-id
              value: "00001.00002"
          parts:
            - id: GOVERN_2_smt
              name: statement
              prose: Accountability structures are in place so that the appropriate teams and individuals are empowered, responsible, and trained for mapping, measuring, and managing AI risks.
          controls:
            - id: GOVERN_2.1
              class: subcategory
              title: GOVERN 2.1
              props:
                - name: sort-id
                  value: 00001.00002.00001
              links:
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#fb747a75-ee50-4a80-ad10-051e227881f3'
                  rel: reference
                - href: '#688c7b23-9bf9-492a-b9ca-8b84b9570df0'
                  rel: reference
                - href: '#598a8273-90d9-4581-91f1-fc1029c12efc'
                  rel: reference
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
                - href: '#03c29f6e-d121-4554-8f62-8506d52c210e'
                  rel: reference
              parts:
                - id: GOVERN_2.1_ovw
                  name: overview
                  prose: Roles and responsibilities and lines of communication related to mapping, measuring, and managing AI risks are documented and are clear to individuals and teams throughout the organization.
                - id: SA-GOVERN_2.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_2.1-1
                      name: item
                      class: suggested_action
                      prose: Establish policies that define the AI risk management roles and responsibilities for positions directly and indirectly related to AI systems, including, but not limited to - Boards of directors or advisory committees - Senior management - AI audit functions - Product management - Project management - AI design - AI development - Human-AI interaction - AI testing and evaluation - AI acquisition and procurement - Impact assessment functions - Oversight functions
                    - id: SA-GOVERN_2.1-2
                      name: item
                      class: suggested_action
                      prose: Establish policies that promote regular communication among AI actors participating in AI risk management efforts.
                    - id: SA-GOVERN_2.1-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that separate management of AI system development functions from AI system testing functions, to enable independent course-correction of AI systems.
                    - id: SA-GOVERN_2.1-4
                      name: item
                      class: suggested_action
                      prose: Establish policies to identify, increase the transparency of, and prevent conflicts of interest in AI risk management efforts.
                    - id: SA-GOVERN_2.1-5
                      name: item
                      class: suggested_action
                      prose: Establish policies to counteract confirmation bias and market incentives that may hinder AI risk management efforts.
                    - id: SA-GOVERN_2.1-6
                      name: item
                      class: suggested_action
                      prose: Establish policies that incentivize AI actors to collaborate with existing legal, oversight, compliance, or enterprise risk functions in their AI risk management activities.
                - id: A-GOVERN_2.1
                  name: guidance
                  class: about
                  prose: The development of a risk-aware organizational culture starts with defining responsibilities. For example, under some risk management structures, professionals carrying out test and evaluation tasks are independent from AI system developers and report through risk management functions or directly to executives. This kind of structure may help counter implicit biases such as groupthink or sunk cost fallacy and bolster risk management functions, so efforts are not easily bypassed or ignored. Instilling a culture where AI system design and implementation decisions can be questioned and course- corrected by empowered AI actors can enhance organizations’ abilities to anticipate and effectively manage risks before they become ingrained.
                - id: D-GOVERN_2.1-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clarified the roles, responsibilities, and delegated authorities to relevant stakeholders?
                - id: D-GOVERN_2.1-2
                  name: guidance
                  class: documentation
                  prose: Who is ultimately responsible for the decisions of the AI and is this person aware of the intended uses and limitations of the analytic?
                - id: D-GOVERN_2.1-3
                  name: guidance
                  class: documentation
                  prose: Are the responsibilities of the personnel involved in the various AI governance processes clearly defined?
                - id: D-GOVERN_2.1-4
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-GOVERN_2.1-5
                  name: guidance
                  class: documentation
                  prose: Did your organization implement accountability-based practices in data management and protection (e.g. the PDPA and OECD Privacy Principles)?
            - id: GOVERN_2.2
              class: subcategory
              title: GOVERN 2.2
              props:
                - name: sort-id
                  value: 00001.00002.00002
              links:
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
                - href: '#af03c5fe-d1c3-4a97-89a6-f24ba1b2a1af'
                  rel: reference
              parts:
                - id: GOVERN_2.2_ovw
                  name: overview
                  prose: The organization’s personnel and partners receive AI risk management training to enable them to perform their duties and responsibilities consistent with related policies, procedures, and agreements.
                - id: SA-GOVERN_2.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_2.2-1
                      name: item
                      class: suggested_action
                      prose: 'Establish policies for personnel addressing ongoing education about: Applicable laws and regulations for AI systems. Potential negative impacts that may arise from AI systems. Organizational AI policies. Trustworthy AI characteristics.'
                    - id: SA-GOVERN_2.2-1.1
                      name: item
                      class: suggested_action
                      prose: Applicable laws and regulations for AI systems.
                    - id: SA-GOVERN_2.2-1.2
                      name: item
                      class: suggested_action
                      prose: Potential negative impacts that may arise from AI systems.
                    - id: SA-GOVERN_2.2-1.3
                      name: item
                      class: suggested_action
                      prose: Organizational AI policies.
                    - id: SA-GOVERN_2.2-1.4
                      name: item
                      class: suggested_action
                      prose: Trustworthy AI characteristics.
                    - id: SA-GOVERN_2.2-2
                      name: item
                      class: suggested_action
                      prose: Ensure that trainings are suitable across AI actor sub-groups - for AI actors carrying out technical tasks (e.g., developers, operators, etc.) as compared to AI actors in oversight roles (e.g., legal, compliance, audit, etc.).
                    - id: SA-GOVERN_2.2-3
                      name: item
                      class: suggested_action
                      prose: Ensure that trainings comprehensively address technical and socio- technical aspects of AI risk management.
                    - id: SA-GOVERN_2.2-4
                      name: item
                      class: suggested_action
                      prose: Verify that organizational AI policies include mechanisms for internal AI personnel to acknowledge and commit to their roles and responsibilities.
                    - id: SA-GOVERN_2.2-5
                      name: item
                      class: suggested_action
                      prose: Verify that organizational policies address change management and include mechanisms to communicate and acknowledge substantial AI system changes.
                    - id: SA-GOVERN_2.2-6
                      name: item
                      class: suggested_action
                      prose: Define paths along internal and external chains of accountability to escalate risk concerns.
                - id: A-GOVERN_2.2
                  name: guidance
                  class: about
                  prose: 'To enhance AI risk management adoption and effectiveness, organizations are encouraged to identify and integrate appropriate training curricula into enterprise learning requirements. Through regular training, AI actors can maintain awareness of: AI risk management goals and their role in achieving them. Organizational policies, applicable laws and regulations, and industry best practices and norms. See MAP 3.4 and 3.5 for additional relevant information.'
                - id: D-GOVERN_2.2-1
                  name: guidance
                  class: documentation
                  prose: Are the relevant staff dealing with AI systems properly trained to interpret AI model output and decisions as well as to detect and manage bias in data?
                - id: D-GOVERN_2.2-2
                  name: guidance
                  class: documentation
                  prose: How does the entity determine the necessary skills and experience needed to design, develop, deploy, assess, and monitor the AI system?
                - id: D-GOVERN_2.2-3
                  name: guidance
                  class: documentation
                  prose: How does the entity assess whether personnel have the necessary skills, training, resources, and domain knowledge to fulfill their assigned responsibilities?
                - id: D-GOVERN_2.2-4
                  name: guidance
                  class: documentation
                  prose: What efforts has the entity undertaken to recruit, develop, and retain a workforce with backgrounds, experience, and perspectives that reflect the community impacted by the AI system?
            - id: GOVERN_2.3
              class: subcategory
              title: GOVERN 2.3
              props:
                - name: sort-id
                  value: 00001.00002.00003
              links:
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#598a8273-90d9-4581-91f1-fc1029c12efc'
                  rel: reference
                - href: '#688c7b23-9bf9-492a-b9ca-8b84b9570df0'
                  rel: reference
              parts:
                - id: GOVERN_2.3_ovw
                  name: overview
                  prose: Executive leadership of the organization takes responsibility for decisions about risks associated with AI system development and deployment.
                - id: SA-GOVERN_2.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_2.3-1
                      name: item
                      class: suggested_action
                      prose: Declare risk tolerances for developing or using AI systems.
                    - id: SA-GOVERN_2.3-2
                      name: item
                      class: suggested_action
                      prose: Support AI risk management efforts and play an active role in such efforts.
                    - id: SA-GOVERN_2.3-3
                      name: item
                      class: suggested_action
                      prose: Integrate a risk and harm prevention mindset throughout the AI lifecycle as part of organizational culture.
                    - id: SA-GOVERN_2.3-4
                      name: item
                      class: suggested_action
                      prose: Support competent risk management executives.
                    - id: SA-GOVERN_2.3-5
                      name: item
                      class: suggested_action
                      prose: Delegate the power, resources, and authorization to perform risk management to each appropriate level throughout the management chain.
                    - id: SA-GOVERN_2.3-6
                      name: item
                      class: suggested_action
                      prose: Organizations can establish board committees for AI risk management and oversight functions and integrate those functions within the organization’s broader enterprise risk management approaches.
                - id: A-GOVERN_2.3
                  name: guidance
                  class: about
                  prose: Senior leadership and members of the C-Suite in organizations that maintain an AI portfolio, should maintain awareness of AI risks, affirm the organizational appetite for such risks, and be responsible for managing those risks. Accountability ensures that a specific team and individual is responsible for AI risk management efforts. Some organizations grant authority and resources (human and budgetary) to a designated officer who ensures adequate performance of the institution’s AI portfolio (e.g., predictive modeling, machine learning).
                - id: D-GOVERN_2.3-1
                  name: guidance
                  class: documentation
                  prose: Did your organization’s board and/or senior management sponsor, support and participate in your organization’s AI governance?
                - id: D-GOVERN_2.3-2
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-GOVERN_2.3-3
                  name: guidance
                  class: documentation
                  prose: Do AI solutions provide sufficient information to assist the personnel to make an informed decision and take actions accordingly?
                - id: D-GOVERN_2.3-4
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clarified the roles, responsibilities, and delegated authorities to relevant stakeholders?
        - id: GOVERN_3
          class: category
          title: GOVERN 3
          props:
            - name: sort-id
              value: "00001.00003"
          parts:
            - id: GOVERN_3_smt
              name: statement
              prose: Workforce diversity, equity, inclusion, and accessibility processes are prioritized in the mapping, measuring, and managing of AI risks throughout the lifecycle.
          controls:
            - id: GOVERN_3.1
              class: subcategory
              title: GOVERN 3.1
              props:
                - name: sort-id
                  value: 00001.00003.00001
              links:
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#8c261e8b-f9ff-48f5-84c2-26f995adbe5b'
                  rel: reference
                - href: '#40304270-9e0b-450e-82e9-611eee381c25'
                  rel: reference
                - href: '#5fe49cc5-3535-4b39-9150-68ba7b559f69'
                  rel: reference
                - href: '#f055ecd7-3198-48d1-9a0f-f23ea27399d6'
                  rel: reference
                - href: '#9e290f4a-35e5-408f-89d1-6cf6bda44696'
                  rel: reference
                - href: '#60a789ae-b7c3-4f98-a892-f14d8bee0e64'
                  rel: reference
                - href: '#28d7955e-1de6-491b-ac31-44496fe0a509'
                  rel: reference
                - href: '#56da2b71-106f-4ecd-b2f1-3bfbf2d5c42f'
                  rel: reference
                - href: '#7c16f2f4-4a6a-4e2d-a9d7-463690a3e0b5'
                  rel: reference
              parts:
                - id: GOVERN_3.1_ovw
                  name: overview
                  prose: Decision-makings related to mapping, measuring, and managing AI risks throughout the lifecycle is informed by a diverse team (e.g., diversity of demographics, disciplines, experience, expertise, and backgrounds).
                - id: SA-GOVERN_3.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_3.1-1
                      name: item
                      class: suggested_action
                      prose: Define policies and hiring practices at the outset that promote interdisciplinary roles, competencies, skills, and capacity for AI efforts.
                    - id: SA-GOVERN_3.1-2
                      name: item
                      class: suggested_action
                      prose: Define policies and hiring practices that lead to demographic and domain expertise diversity; empower staff with necessary resources and support, and facilitate the contribution of staff feedback and concerns without fear of reprisal.
                    - id: SA-GOVERN_3.1-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that facilitate inclusivity and the integration of new insights into existing practice.
                    - id: SA-GOVERN_3.1-4
                      name: item
                      class: suggested_action
                      prose: Seek external expertise to supplement organizational diversity, equity, inclusion, and accessibility where internal expertise is lacking.
                    - id: SA-GOVERN_3.1-5
                      name: item
                      class: suggested_action
                      prose: Establish policies that incentivize AI actors to collaborate with existing nondiscrimination, accessibility and accommodation, and human resource functions, employee resource group (ERGs), and diversity, equity, inclusion, and accessibility (DEIA) initiatives.
                - id: A-GOVERN_3.1
                  name: guidance
                  class: about
                  prose: A diverse team that includes AI actors with diversity of experience, disciplines, and backgrounds to enhance organizational capacity and capability for anticipating risks is better equipped to carry out risk management. Consultation with external personnel may be necessary when internal teams lack a diverse range of lived experiences or disciplinary expertise. To extend the benefits of diversity, equity, and inclusion to both the users and AI actors, it is recommended that teams are composed of a diverse group of individuals who reflect a range of backgrounds, perspectives and expertise. Without commitment from senior leadership, beneficial aspects of team diversity and inclusion can be overridden by unstated organizational incentives that inadvertently conflict with the broader values of a diverse workforce.
                - id: D-GOVERN_3.1-1
                  name: guidance
                  class: documentation
                  prose: Are the relevant staff dealing with AI systems properly trained to interpret AI model output and decisions as well as to detect and manage bias in data?
                - id: D-GOVERN_3.1-2
                  name: guidance
                  class: documentation
                  prose: Entities include diverse perspectives from technical and non-technical communities throughout the AI life cycle to anticipate and mitigate unintended consequences including potential bias and discrimination.
                - id: D-GOVERN_3.1-3
                  name: guidance
                  class: documentation
                  prose: 'Stakeholder involvement: Include diverse perspectives from a community of stakeholders throughout the AI life cycle to mitigate risks.'
                - id: D-GOVERN_3.1-4
                  name: guidance
                  class: documentation
                  prose: Strategies to incorporate diverse perspectives include establishing collaborative processes and multidisciplinary teams that involve subject matter experts in data science, software development, civil liberties, privacy and security, legal counsel, and risk management.
                - id: D-GOVERN_3.1-5
                  name: guidance
                  class: documentation
                  prose: To what extent are the established procedures effective in mitigating bias, inequity, and other concerns resulting from the system?
            - id: GOVERN_3.2
              class: subcategory
              title: GOVERN 3.2
              props:
                - name: sort-id
                  value: 00001.00003.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#0fb6a8ac-6c51-4caa-955b-faaa40148147'
                  rel: reference
                - href: '#098d48c3-32fa-4425-b9c7-ffeb377eb04a'
                  rel: reference
                - href: '#a20568ac-25f3-4781-90fa-145a40610815'
                  rel: reference
                - href: '#e0d3aaa2-b736-4f21-b4e2-e8432361283f'
                  rel: reference
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
              parts:
                - id: GOVERN_3.2_ovw
                  name: overview
                  prose: Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight of AI systems.
                - id: SA-GOVERN_3.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_3.2-1
                      name: item
                      class: suggested_action
                      prose: Establish policies and procedures that define and differentiate the various human roles and responsibilities when using, interacting with, or monitoring AI systems.
                    - id: SA-GOVERN_3.2-2
                      name: item
                      class: suggested_action
                      prose: Establish procedures for capturing and tracking risk information related to human-AI configurations and associated outcomes.
                    - id: SA-GOVERN_3.2-3
                      name: item
                      class: suggested_action
                      prose: Establish policies for the development of proficiency standards for AI actors carrying out system operation tasks and system oversight tasks.
                    - id: SA-GOVERN_3.2-4
                      name: item
                      class: suggested_action
                      prose: Establish specified risk management training protocols for AI actors carrying out system operation tasks and system oversight tasks.
                    - id: SA-GOVERN_3.2-5
                      name: item
                      class: suggested_action
                      prose: Establish policies and procedures regarding AI actor roles, and responsibilities for human oversight of deployed systems.
                    - id: SA-GOVERN_3.2-6
                      name: item
                      class: suggested_action
                      prose: Establish policies and procedures defining human-AI configurations (configurations where AI systems are explicitly designated and treated as team members in primarily human teams) in relation to organizational risk tolerances, and associated documentation.
                    - id: SA-GOVERN_3.2-7
                      name: item
                      class: suggested_action
                      prose: Establish policies to enhance the explanation, interpretation, and overall transparency of AI systems.
                    - id: SA-GOVERN_3.2-8
                      name: item
                      class: suggested_action
                      prose: Establish policies for managing risks regarding known difficulties in human-AI configurations, human-AI teaming, and AI system user experience and user interactions (UI/UX).
                - id: A-GOVERN_3.2
                  name: guidance
                  class: about
                  prose: 'Identifying and managing AI risks and impacts are enhanced when a broad set of perspectives and actors across the AI lifecycle, including technical, legal, compliance, social science, and human factors expertise is engaged. AI actors include those who operate, use, or interact with AI systems for downstream tasks, or monitor AI system performance. Effective risk management efforts include: clear definitions and differentiation of the various human roles and responsibilities for AI system oversight and governance recognizing and clarifying differences between AI system overseers and those using or interacting with AI systems.'
                - id: D-GOVERN_3.2-1
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
                - id: D-GOVERN_3.2-2
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the appropriate level of human involvement in AI-augmented decision-making?
                - id: D-GOVERN_3.2-3
                  name: guidance
                  class: documentation
                  prose: How will the accountable human(s) address changes in accuracy and precision due to either an adversary’s attempts to disrupt the AI or unrelated changes in operational/business environment, which may impact the accuracy of the AI?
                - id: D-GOVERN_3.2-4
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clarified the roles, responsibilities, and delegated authorities to relevant stakeholders?
                - id: D-GOVERN_3.2-5
                  name: guidance
                  class: documentation
                  prose: How does the entity assess whether personnel have the necessary skills, training, resources, and domain knowledge to fulfill their assigned responsibilities?
        - id: GOVERN_4
          class: category
          title: GOVERN 4
          props:
            - name: sort-id
              value: "00001.00004"
          parts:
            - id: GOVERN_4_smt
              name: statement
              prose: Organizational teams are committed to a culture that considers and communicates AI risk.
          controls:
            - id: GOVERN_4.1
              class: subcategory
              title: GOVERN 4.1
              props:
                - name: sort-id
                  value: 00001.00004.00001
              links:
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#598a8273-90d9-4581-91f1-fc1029c12efc'
                  rel: reference
                - href: '#e1e6a5a4-e686-4eef-acfd-979de46fdb3f'
                  rel: reference
                - href: '#688c7b23-9bf9-492a-b9ca-8b84b9570df0'
                  rel: reference
                - href: '#dc5cbec4-53f2-4204-972a-6e882458b06a'
                  rel: reference
                - href: '#d3f63135-fa90-4f5f-8196-b3d258aef77b'
                  rel: reference
                - href: '#44598a34-b995-44e1-a3ad-5a4134f4249b'
                  rel: reference
                - href: '#e9dd11ac-4b80-406a-8203-f1313d1b9ee9'
                  rel: reference
              parts:
                - id: GOVERN_4.1_ovw
                  name: overview
                  prose: Organizational policies, and practices are in place to foster a critical thinking and safety-first mindset in the design, development, deployment, and uses of AI systems to minimize negative impacts.
                - id: SA-GOVERN_4.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_4.1-1
                      name: item
                      class: suggested_action
                      prose: Establish policies that require inclusion of oversight functions (legal, compliance, risk management) from the outset of the system design process.
                    - id: SA-GOVERN_4.1-2
                      name: item
                      class: suggested_action
                      prose: Establish policies that promote effective challenge of AI system design, implementation, and deployment decisions, via mechanisms such as the three lines of defense, model audits, or red-teaming – to minimize workplace risks such as groupthink.
                    - id: SA-GOVERN_4.1-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that incentivize safety-first mindset and general critical thinking and review at an organizational and procedural level.
                    - id: SA-GOVERN_4.1-4
                      name: item
                      class: suggested_action
                      prose: Establish whistleblower protections for insiders who report on perceived serious problems with AI systems.
                    - id: SA-GOVERN_4.1-5
                      name: item
                      class: suggested_action
                      prose: Establish policies to integrate a harm and risk prevention mindset throughout the AI lifecycle.
                - id: A-GOVERN_4.1
                  name: guidance
                  class: about
                  prose: A risk culture and accompanying practices can help organizations effectively triage the most critical risks. Organizations in some industries implement three (or more) “lines of defense,” where separate teams are held accountable for different aspects of the system lifecycle, such as development, risk management, and auditing. While a traditional three-lines approach may be impractical for smaller organizations, leadership can commit to cultivating a strong risk culture through other means. For example, “effective challenge,” is a culture- based practice that encourages critical thinking and questioning of important design and implementation decisions by experts with the authority and stature to make such changes. Red-teaming is another risk measurement and management approach. This practice consists of adversarial testing of AI systems under stress conditions to seek out failure modes or vulnerabilities in the system. Red-teams are composed of external experts or personnel who are independent from internal AI actors.
                - id: D-GOVERN_4.1-1
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented the AI system's development, testing methodology, metrics, and performance outcomes?
                - id: D-GOVERN_4.1-2
                  name: guidance
                  class: documentation
                  prose: Are organizational information sharing practices widely followed and transparent, such that related past failed designs can be avoided?
                - id: D-GOVERN_4.1-3
                  name: guidance
                  class: documentation
                  prose: Are training manuals and other resources for carrying out incident response documented and available?
                - id: D-GOVERN_4.1-4
                  name: guidance
                  class: documentation
                  prose: Are processes for operator reporting of incidents and near-misses documented and available?
            - id: GOVERN_4.2
              class: subcategory
              title: GOVERN 4.2
              props:
                - name: sort-id
                  value: 00001.00004.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#4f247d15-91e1-4b30-a5ee-2ce7c6131e7e'
                  rel: reference
                - href: '#f400480a-4db9-4894-afc4-e0397f846928'
                  rel: reference
                - href: '#6e268250-0bb5-4f19-9b77-a76bd016d53f'
                  rel: reference
                - href: '#893f3e45-d9bc-4a6a-b22e-795aa931ce0e'
                  rel: reference
                - href: '#b2238ec9-f499-4e0b-ba15-9a1b6295fdca'
                  rel: reference
                - href: '#0c187227-7a34-4fcc-bf07-82f506ef8b35'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#2641f5c5-3f2f-4855-88b7-7c6c29cfa871'
                  rel: reference
                - href: '#06414091-d0d0-4dd1-bf88-4e7b97b8de43'
                  rel: reference
                - href: '#189a1089-19f7-469e-8915-9ebbffba83d7'
                  rel: reference
                - href: '#65ac3f7c-3fa0-45ad-8529-9715dad29b64'
                  rel: reference
                - href: '#68701079-336b-4b27-9b15-6f899ad355ca'
                  rel: reference
                - href: '#1daddacb-e601-498d-93cb-1137831beeec'
                  rel: reference
                - href: '#44598a34-b995-44e1-a3ad-5a4134f4249b'
                  rel: reference
                - href: '#a104aa9e-0d85-4a7b-a27d-13aedd43374e'
                  rel: reference
              parts:
                - id: GOVERN_4.2_ovw
                  name: overview
                  prose: Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate and use, and communicate about the impacts more broadly.
                - id: SA-GOVERN_4.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_4.2-1
                      name: item
                      class: suggested_action
                      prose: Establish impact assessment policies and processes for AI systems used by the organization.
                    - id: SA-GOVERN_4.2-2
                      name: item
                      class: suggested_action
                      prose: Align organizational impact assessment activities with relevant regulatory or legal requirements.
                    - id: SA-GOVERN_4.2-3
                      name: item
                      class: suggested_action
                      prose: Verify that impact assessment activities are appropriate to evaluate the potential negative impact of a system and how quickly a system changes, and that assessments are applied on a regular basis.
                    - id: SA-GOVERN_4.2-4
                      name: item
                      class: suggested_action
                      prose: Utilize impact assessments to inform broader evaluations of AI system risk.
                - id: A-GOVERN_4.2
                  name: guidance
                  class: about
                  prose: 'Impact assessments are one approach for driving responsible technology development practices. And, within a specific use case, these assessments can provide a high-level structure for organizations to frame risks of a given algorithm or deployment. Impact assessments can also serve as a mechanism for organizations to articulate risks and generate documentation for managing and oversight activities when harms do arise. Impact assessments may: be applied at the beginning of a process but also iteratively and regularly since goals and outcomes can evolve over time. include perspectives from AI actors, including operators, users, and potentially impacted communities (including historically marginalized communities, those with disabilities, and individuals impacted by the digital divide), assist in “go/no-go” decisions for an AI system. consider conflicts of interest, or undue influence, related to the organizational team being assessed. See the MAP function playbook guidance for more information relating to impact assessments.'
                - id: D-GOVERN_4.2-1
                  name: guidance
                  class: documentation
                  prose: How has the entity identified and mitigated potential impacts of bias in the data, including inequitable or discriminatory outcomes?
                - id: D-GOVERN_4.2-2
                  name: guidance
                  class: documentation
                  prose: How has the entity documented the AI system’s data provenance, including sources, origins, transformations, augmentations, labels, dependencies, constraints, and metadata?
                - id: D-GOVERN_4.2-3
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clearly defined technical specifications and requirements for the AI system?
                - id: D-GOVERN_4.2-4
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity documented and communicated the AI system's development, testing methodology, metrics, and performance outcomes?
                - id: D-GOVERN_4.2-5
                  name: guidance
                  class: documentation
                  prose: Have you documented and explained that machine errors may differ from human errors?
            - id: GOVERN_4.3
              class: subcategory
              title: GOVERN 4.3
              props:
                - name: sort-id
                  value: 00001.00004.00003
              links:
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#dd496287-e047-4bfc-8d67-69277a76be0d'
                  rel: reference
                - href: '#ccc3a637-4728-4bb9-a456-276cab72fb89'
                  rel: reference
                - href: '#86cf33d4-fb84-497d-9bd2-7e73b73c65e0'
                  rel: reference
                - href: '#6e268250-0bb5-4f19-9b77-a76bd016d53f'
                  rel: reference
                - href: '#e727c410-2cfc-49d4-8647-184f0e8bc5a1'
                  rel: reference
              parts:
                - id: GOVERN_4.3_ovw
                  name: overview
                  prose: Organizational practices are in place to enable AI testing, identification of incidents, and information sharing.
                - id: SA-GOVERN_4.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_4.3-1
                      name: item
                      class: suggested_action
                      prose: Establish policies and procedures to facilitate and equip AI system testing.
                    - id: SA-GOVERN_4.3-2
                      name: item
                      class: suggested_action
                      prose: Establish organizational commitment to identifying AI system limitations and sharing of insights about limitations within appropriate AI actor groups.
                    - id: SA-GOVERN_4.3-3
                      name: item
                      class: suggested_action
                      prose: Establish policies for reporting and documenting incident response.
                    - id: SA-GOVERN_4.3-4
                      name: item
                      class: suggested_action
                      prose: Establish policies and processes regarding public disclosure of incidents and information sharing.
                    - id: SA-GOVERN_4.3-5
                      name: item
                      class: suggested_action
                      prose: Establish guidelines for incident handling related to AI system risks and performance.
                - id: A-GOVERN_4.3
                  name: guidance
                  class: about
                  prose: 'Identifying AI system limitations, detecting and tracking negative impacts and incidents, and sharing information about these issues with appropriate AI actors will improve risk management. Issues such as concept drift, AI bias and discrimination, shortcut learning or under specification are difficult to identify using current standard AI testing processes. Organizations can institute in-house use and testing policies and procedures to identify and manage such issues. Efforts can take the form of pre-alpha or pre-beta testing, or deploying internally developed systems or products within the organization. Testing may entail limited and controlled in-house, or publicly available, AI system testbeds, and accessibility of AI system interfaces and outputs. Without policies and procedures that enable consistent testing practices, risk management efforts may be bypassed or ignored, exacerbating risks or leading to inconsistent risk management activities. Information sharing about impacts or incidents detected during testing or deployment can: draw attention to AI system risks, failures, abuses or misuses, allow organizations to benefit from insights based on a wide range of AI applications and implementations, and allow organizations to be more proactive in avoiding known failure modes. Organizations may consider sharing incident information with the AI Incident Database, the AIAAIC, users, impacted communities, or with traditional cyber vulnerability databases, such as the MITRE CVE list.'
                - id: D-GOVERN_4.3-1
                  name: guidance
                  class: documentation
                  prose: Did your organization address usability problems and test whether user interfaces served their intended purposes? Consulting the community or end users at the earliest stages of development to ensure there is transparency on the technology used and how it is deployed.
                - id: D-GOVERN_4.3-2
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-GOVERN_4.3-3
                  name: guidance
                  class: documentation
                  prose: To what extent can users or parties affected by the outputs of the AI system test the AI system and provide feedback?
        - id: GOVERN_5
          class: category
          title: GOVERN 5
          props:
            - name: sort-id
              value: "00001.00005"
          parts:
            - id: GOVERN_5_smt
              name: statement
              prose: Processes are in place for robust engagement with relevant AI actors.
          controls:
            - id: GOVERN_5.1
              class: subcategory
              title: GOVERN 5.1
              props:
                - name: sort-id
                  value: 00001.00005.00001
              links:
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#4898b93b-f87a-4a85-89c9-bbd7bd06c2ac'
                  rel: resource
                - href: '#df5155d6-eeb0-4684-b594-1a6bb8fe3936'
                  rel: reference
                - href: '#b2e44d38-e0c9-4b1f-9678-3a69744bdccf'
                  rel: reference
                - href: '#ed019458-fce3-4582-9f72-c8a6fd5cd38c'
                  rel: reference
                - href: '#5a266cfb-5ddf-4ba8-84b6-7752f3c54404'
                  rel: reference
                - href: '#ef412b4e-eed2-48b7-9ed0-3f0805e02fad'
                  rel: reference
                - href: '#adcd057c-2f98-472d-9444-efa7cbbcabdd'
                  rel: reference
              parts:
                - id: GOVERN_5.1_ovw
                  name: overview
                  prose: Organizational policies and practices are in place to collect, consider, prioritize, and integrate feedback from those external to the team that developed or deployed the AI system regarding the potential individual and societal impacts related to AI risks.
                - id: SA-GOVERN_5.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_5.1-1
                      name: item
                      class: suggested_action
                      prose: 'Establish AI risk management policies that explicitly address mechanisms for collecting, evaluating, and incorporating stakeholder and user feedback that could include:'
                    - id: SA-GOVERN_5.1-1.1
                      name: item
                      class: suggested_action
                      prose: Recourse mechanisms for faulty AI system outputs.
                    - id: SA-GOVERN_5.1-1.2
                      name: item
                      class: suggested_action
                      prose: Bug bounties.
                    - id: SA-GOVERN_5.1-1.3
                      name: item
                      class: suggested_action
                      prose: Human-centered design.
                    - id: SA-GOVERN_5.1-1.4
                      name: item
                      class: suggested_action
                      prose: User-interaction and experience research.
                    - id: SA-GOVERN_5.1-1.5
                      name: item
                      class: suggested_action
                      prose: Participatory stakeholder engagement with individuals and communities that may experience negative impacts.
                    - id: SA-GOVERN_5.1-2
                      name: item
                      class: suggested_action
                      prose: Verify that stakeholder feedback is considered and addressed, including environmental concerns, and across the entire population of intended users, including historically excluded populations, people with disabilities, older people, and those with limited access to the internet and other basic technologies.
                    - id: SA-GOVERN_5.1-3
                      name: item
                      class: suggested_action
                      prose: Clarify the organization’s principles as they apply to AI systems – considering those which have been proposed publicly – to inform external stakeholders of the organization’s values. Consider publishing or adopting AI principles.
                - id: A-GOVERN_5.1
                  name: guidance
                  class: about
                  prose: Beyond internal and laboratory-based system testing, organizational policies and practices may consider AI system fitness-for-purpose related to the intended context of use. Participatory stakeholder engagement is one type of qualitative activity to help AI actors answer questions such as whether to pursue a project or how to design with impact in mind. This type of feedback, with domain expert input, can also assist AI actors to identify emergent scenarios and risks in certain AI applications. The consideration of when and how to convene a group and the kinds of individuals, groups, or community organizations to include is an iterative process connected to the system's purpose and its level of risk. Other factors relate to how to collaboratively and respectfully capture stakeholder feedback and insight that is useful, without being a solely perfunctory exercise. These activities are best carried out by personnel with expertise in participatory practices, qualitative methods, and translation of contextual feedback for technical audiences. Participatory engagement is not a one-time exercise and is best carried out from the very beginning of AI system commissioning through the end of the lifecycle. Organizations can consider how to incorporate engagement when beginning a project and as part of their monitoring of systems. Engagement is often utilized as a consultative practice, but this perspective may inadvertently lead to “participation washing.” Organizational transparency about the purpose and goal of the engagement can help mitigate that possibility. Organizations may also consider targeted consultation with subject matter experts as a complement to participatory findings. Experts may assist internal staff in identifying and conceptualizing potential negative impacts that were previously not considered.
                - id: D-GOVERN_5.1-1
                  name: guidance
                  class: documentation
                  prose: What type of information is accessible on the design, operations, and limitations of the AI system to external stakeholders, including end users, consumers, regulators, and individuals impacted by use of the AI system?
                - id: D-GOVERN_5.1-2
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity clarified the roles, responsibilities, and delegated authorities to relevant stakeholders?
                - id: D-GOVERN_5.1-3
                  name: guidance
                  class: documentation
                  prose: How easily accessible and current is the information available to external stakeholders?
                - id: D-GOVERN_5.1-4
                  name: guidance
                  class: documentation
                  prose: What was done to mitigate or reduce the potential for harm?
                - id: D-GOVERN_5.1-5
                  name: guidance
                  class: documentation
                  prose: 'Stakeholder involvement: Include diverse perspectives from a community of stakeholders throughout the AI life cycle to mitigate risks.'
            - id: GOVERN_5.2
              class: subcategory
              title: GOVERN 5.2
              props:
                - name: sort-id
                  value: 00001.00005.00002
              links:
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#4898b93b-f87a-4a85-89c9-bbd7bd06c2ac'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#598a8273-90d9-4581-91f1-fc1029c12efc'
                  rel: reference
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
                - href: '#d97c1447-ebc5-40ff-8a8f-65c7829be747'
                  rel: reference
              parts:
                - id: GOVERN_5.2_ovw
                  name: overview
                  prose: Mechanisms are established to enable AI actors to regularly incorporate adjudicated feedback from relevant AI actors into system design and implementation.
                - id: SA-GOVERN_5.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_5.2-1
                      name: item
                      class: suggested_action
                      prose: Explicitly acknowledge that AI systems, and the use of AI, present inherent costs and risks along with potential benefits.
                    - id: SA-GOVERN_5.2-2
                      name: item
                      class: suggested_action
                      prose: Define reasonable risk tolerances for AI systems informed by laws, regulation, best practices, or industry standards.
                    - id: SA-GOVERN_5.2-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that ensure all relevant AI actors are provided with meaningful opportunities to provide feedback on system design and implementation.
                    - id: SA-GOVERN_5.2-4
                      name: item
                      class: suggested_action
                      prose: 'Establish policies that define how to assign AI systems to established risk tolerance levels by combining system impact assessments with the likelihood that an impact occurs. Such assessment often entails some combination of:'
                    - id: SA-GOVERN_5.2-4.1
                      name: item
                      class: suggested_action
                      prose: Econometric evaluations of impacts and impact likelihoods to assess AI system risk.
                    - id: SA-GOVERN_5.2-4.2
                      name: item
                      class: suggested_action
                      prose: Red-amber-green (RAG) scales for impact severity and likelihood to assess AI system risk.
                - id: A-GOVERN_5.2
                  name: guidance
                  class: about
                  prose: Organizational policies and procedures that equip AI actors with the processes, knowledge, and expertise needed to inform collaborative decisions about system deployment improve risk management. These decisions are closely tied to AI systems and organizational risk tolerance. Risk tolerance, established by organizational leadership, reflects the level and type of risk the organization will accept while conducting its mission and carrying out its strategy. When risks arise, resources are allocated based on the assessed risk of a given AI system. Organizations typically apply a risk tolerance approach where higher risk systems receive larger allocations of risk management resources and lower risk systems receive less resources.
                - id: D-GOVERN_5.2-1
                  name: guidance
                  class: documentation
                  prose: Who is ultimately responsible for the decisions of the AI and is this person aware of the intended uses and limitations of the analytic?
                - id: D-GOVERN_5.2-2
                  name: guidance
                  class: documentation
                  prose: Who will be responsible for maintaining, re-verifying, monitoring, and updating this AI once deployed?
                - id: D-GOVERN_5.2-3
                  name: guidance
                  class: documentation
                  prose: Who is accountable for the ethical considerations during all stages of the AI lifecycle?
                - id: D-GOVERN_5.2-4
                  name: guidance
                  class: documentation
                  prose: To what extent are the established procedures effective in mitigating bias, inequity, and other concerns resulting from the system?
                - id: D-GOVERN_5.2-5
                  name: guidance
                  class: documentation
                  prose: Does the AI solution provide sufficient information to assist the personnel to make an informed decision and take actions accordingly?
        - id: GOVERN_6
          class: category
          title: GOVERN 6
          props:
            - name: sort-id
              value: "00001.00006"
          parts:
            - id: GOVERN_6_smt
              name: statement
              prose: Policies and procedures are in place to address AI risks and benefits arising from third-party software and data and other supply chain issues.
          controls:
            - id: GOVERN_6.1
              class: subcategory
              title: GOVERN 6.1
              props:
                - name: sort-id
                  value: 00001.00006.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#502b3e4c-00f7-4d08-8b2a-3989887817dc'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#51187672-3b75-44b9-8a99-e5309fff1c88'
                  rel: resource
                - href: '#598a8273-90d9-4581-91f1-fc1029c12efc'
                  rel: reference
                - href: '#eed92d1a-3479-4d3b-a106-a5771c0b5af3'
                  rel: reference
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
              parts:
                - id: GOVERN_6.1_ovw
                  name: overview
                  prose: Policies and procedures are in place that address AI risks associated with third-party entities, including risks of infringement of a third party's intellectual property or other rights.
                - id: SA-GOVERN_6.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_6.1-1
                      name: item
                      class: suggested_action
                      prose: Collaboratively establish policies that address third-party AI systems and data.
                    - id: SA-GOVERN_6.1-2
                      name: item
                      class: suggested_action
                      prose: 'Establish policies related to: Transparency into third-party system functions, including knowledge about training data, training and inference algorithms, and assumptions and limitations. Thorough testing of third-party AI systems. (See measure for more detail) Requirements for clear and complete instructions for third-party system usage. Evaluate policies for third-party technology.'
                    - id: SA-GOVERN_6.1-3
                      name: item
                      class: suggested_action
                      prose: Establish policies that address supply chain, full product lifecycle and associated processes, including legal, ethical, and other issues concerning procurement and use of third-party software or hardware systems and data.
                - id: A-GOVERN_6.1
                  name: guidance
                  class: about
                  prose: Risk measurement and management can be complicated by how customers use or integrate third-party data or systems into AI products or services, particularly without sufficient internal governance structures and technical safeguards. Organizations usually engage multiple third parties for external expertise, data, software packages (both open source and commercial), and software and hardware platforms across the AI lifecycle. This engagement has beneficial uses and can increase complexities of risk management efforts. Organizational approaches to managing third-party (positive and negative)risk may be tailored to the resources, risk profile, and use case for each system. Organizations can apply governance approaches to third-party AI systems and data as they would for internal resources — including open- source software, publicly available data, and commercially available models.
                - id: D-GOVERN_6.1-1
                  name: guidance
                  class: documentation
                  prose: Did you establish mechanisms that facilitate the AI system’s auditability(e.g., traceability of the development process, the sourcing of training data and the logging of the AI system’s processes, outcomes, positive and negative impact)?
                - id: D-GOVERN_6.1-2
                  name: guidance
                  class: documentation
                  prose: If a third party created the AI, how will you ensure a level of explain ability or interpretability?
                - id: D-GOVERN_6.1-3
                  name: guidance
                  class: documentation
                  prose: Did you ensure that the AI system can be audited by independent third parties?
                - id: D-GOVERN_6.1-4
                  name: guidance
                  class: documentation
                  prose: Did you establish a process for third parties (e.g., suppliers, end users, subjects, distributors/vendors or workers) to report potential vulnerabilities, risks or biases in the AI system?
                - id: D-GOVERN_6.1-5
                  name: guidance
                  class: documentation
                  prose: To what extent does the plan specifically address risks associated with acquisition, procurement of packaged software from vendors, cybersecurity controls, computational infrastructure, data, data science, deployment mechanics, and system failure?
            - id: GOVERN_6.2
              class: subcategory
              title: GOVERN 6.2
              props:
                - name: sort-id
                  value: 00001.00006.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f85ad04c-0d4d-4ad7-b06e-7d5ab621c4d3'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#d9c54ba5-23b7-4eb0-ad12-f64c93187b57'
                  rel: resource
                - href: '#598a8273-90d9-4581-91f1-fc1029c12efc'
                  rel: reference
                - href: '#eed92d1a-3479-4d3b-a106-a5771c0b5af3'
                  rel: reference
                - href: '#697be293-3f51-4ae4-93f6-aef7c22dec1e'
                  rel: reference
              parts:
                - id: GOVERN_6.2_ovw
                  name: overview
                  prose: Contingency processes are in place to handle failures or incidents in third-party data or AI systems deemed to be high-risk.
                - id: SA-GOVERN_6.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-GOVERN_6.2-1
                      name: item
                      class: suggested_action
                      prose: Establish policies for handling third-party system failures to include consideration of redundancy mechanisms for vital third-party AI systems.
                    - id: SA-GOVERN_6.2-2
                      name: item
                      class: suggested_action
                      prose: Verify that incident response plans address third-party AI systems.
                - id: A-GOVERN_6.2
                  name: guidance
                  class: about
                  prose: To mitigate the potential harms of third-party system failures, organizations may implement policies and procedures that include redundancies forcovering third-party functions.
                - id: D-GOVERN_6.2-1
                  name: guidance
                  class: documentation
                  prose: To what extent does the plan specifically address risks associated with acquisition, procurement of packaged software from vendors, cybersecurity controls, computational infrastructure, data, data science, deployment mechanics, and system failure?
                - id: D-GOVERN_6.2-2
                  name: guidance
                  class: documentation
                  prose: Did you establish a process for third parties (e.g., suppliers, end users, subjects, distributors/vendors or workers) to report potential vulnerabilities, risks or biases in the AI system?
                - id: D-GOVERN_6.2-3
                  name: guidance
                  class: documentation
                  prose: If your organization obtained datasets from a third party, did your organization assess and manage the risks of using such datasets?
    - id: MANAGE
      class: function
      title: MANAGE
      props:
        - name: sort-id
          value: "00002"
      parts:
        - id: MANAGE_ovw
          name: overview
          prose: Risks are prioritized and acted upon based on a projected impact.
      controls:
        - id: MANAGE_1
          class: category
          title: MANAGE 1
          props:
            - name: sort-id
              value: "00002.00001"
          parts:
            - id: MANAGE_1_smt
              name: statement
              prose: AI risks based on assessments and other analytical output from the Map and measure functions are prioritized, responded to, and managed.
          controls:
            - id: MANAGE_1.1
              class: subcategory
              title: MANAGE 1.1
              props:
                - name: sort-id
                  value: 00002.00001.00001
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#5fbec1da-24ff-4dcd-992b-4b102b08c52e'
                  rel: reference
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#8f8b6962-34f7-4c0b-bed0-23aeebf17d01'
                  rel: reference
                - href: '#2641f5c5-3f2f-4855-88b7-7c6c29cfa871'
                  rel: reference
                - href: '#59f905af-7275-488f-98e5-29021f5376ca'
                  rel: reference
                - href: '#aba5bb4f-3bc9-4c19-9950-fbed2b46cecb'
                  rel: reference
              parts:
                - id: MANAGE_1.1_ovw
                  name: overview
                  prose: A determination is made as to whether the AI system achieves its intended purpose and stated objectives and whether its development or deployment should proceed.
                - id: SA-MANAGE_1.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_1.1-1
                      name: item
                      class: suggested_action
                      prose: Consider trustworthiness characteristics when evaluating AI systems' negative risks and benefits.
                    - id: SA-MANAGE_1.1-2
                      name: item
                      class: suggested_action
                      prose: Utilize TEVV outputs from map and measure functions when considering risk treatment.
                    - id: SA-MANAGE_1.1-3
                      name: item
                      class: suggested_action
                      prose: Regularly track and monitor negative risks and benefits throughout the AI system lifecycle including in post-deployment monitoring.
                    - id: SA-MANAGE_1.1-4
                      name: item
                      class: suggested_action
                      prose: Regularly assess and document system performance relative to trustworthiness characteristics and tradeoffs between negative risks and opportunities.
                    - id: SA-MANAGE_1.1-5
                      name: item
                      class: suggested_action
                      prose: Evaluate tradeoffs in connection with real-world use cases and impacts and as enumerated in Map function outcomes.
                - id: A-MANAGE_1.1
                  name: guidance
                  class: about
                  prose: AI systems may not necessarily be the right solution for a given business task or problem. A standard risk management practice is to formally weigh an AI system’s negative risks against its benefits, and to determine if the AI system is an appropriate solution. Tradeoffs among trustworthiness characteristics —such as deciding to deploy a system based on system performance vs system transparency–may require regular assessment throughout the AI lifecycle.
                - id: D-MANAGE_1.1-1
                  name: guidance
                  class: documentation
                  prose: How do the technical specifications and requirements align with the AI system's goals and objectives?
                - id: D-MANAGE_1.1-2
                  name: guidance
                  class: documentation
                  prose: To what extent are the metrics consistent with system goals, objectives, and constraints, including ethical and compliance considerations?
                - id: D-MANAGE_1.1-3
                  name: guidance
                  class: documentation
                  prose: What goals and objectives does the entity expect to achieve by designing, developing, and/or deploying the AI system?
            - id: MANAGE_1.2
              class: subcategory
              title: MANAGE 1.2
              props:
                - name: sort-id
                  value: 00002.00001.00002
              links:
                - href: '#86499445-55df-49a3-ab97-440dd161b16f'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#5fbec1da-24ff-4dcd-992b-4b102b08c52e'
                  rel: reference
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#8f8b6962-34f7-4c0b-bed0-23aeebf17d01'
                  rel: reference
                - href: '#2641f5c5-3f2f-4855-88b7-7c6c29cfa871'
                  rel: reference
                - href: '#59f905af-7275-488f-98e5-29021f5376ca'
                  rel: reference
                - href: '#aba5bb4f-3bc9-4c19-9950-fbed2b46cecb'
                  rel: reference
              parts:
                - id: MANAGE_1.2_ovw
                  name: overview
                  prose: Treatment of documented AI risks is prioritized based on impact, likelihood, or available resources or methods.
                - id: SA-MANAGE_1.2
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_1.2-1
                      name: item
                      class: suggested_action
                      prose: Assign risk management resources relative to established risk tolerance. AI systems with lower risk tolerances receive greater oversight, mitigation and management resources.
                    - id: SA-MANAGE_1.2-2
                      name: item
                      class: suggested_action
                      prose: Document AI risk tolerance determination practices and resource decisions.
                    - id: SA-MANAGE_1.2-3
                      name: item
                      class: suggested_action
                      prose: Regularly review risk tolerances and re-calibrate, as needed, in accordance with information from AI system monitoring and assessment.
                - id: A-MANAGE_1.2
                  name: guidance
                  class: about
                  prose: Risk refers to the composite measure of an event’s probability of occurring and the magnitude (or degree) of the consequences of the corresponding events. The impacts, or consequences, of AI systems can be positive, negative, or both and can result in opportunities or risks. Organizational risk tolerances are often informed by several internal and external factors, including existing industry practices, organizational values, and legal or regulatory requirements. Since risk management resources are often limited, organizations usually assign them based on risk tolerance. AI risks that are deemed more serious receive more oversight attention and risk management resources.
                - id: D-MANAGE_1.2-1
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
                - id: D-MANAGE_1.2-2
                  name: guidance
                  class: documentation
                  prose: What assessments has the entity conducted on data security and privacy impacts associated with the AI system?
                - id: D-MANAGE_1.2-3
                  name: guidance
                  class: documentation
                  prose: Does your organization have an existing governance structure that can be leveraged to oversee the organization’s use of AI?
            - id: MANAGE_1.3
              class: subcategory
              title: MANAGE 1.3
              props:
                - name: sort-id
                  value: 00002.00001.00003
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#5fbec1da-24ff-4dcd-992b-4b102b08c52e'
                  rel: reference
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#8f8b6962-34f7-4c0b-bed0-23aeebf17d01'
                  rel: reference
                - href: '#2641f5c5-3f2f-4855-88b7-7c6c29cfa871'
                  rel: reference
                - href: '#59f905af-7275-488f-98e5-29021f5376ca'
                  rel: reference
                - href: '#aba5bb4f-3bc9-4c19-9950-fbed2b46cecb'
                  rel: reference
              parts:
                - id: MANAGE_1.3_ovw
                  name: overview
                  prose: Responses to the AI risks deemed high priority as identified by the Map function, are developed, planned, and documented. Risk response options can include mitigating, transferring, avoiding, or accepting.
                - id: SA-MANAGE_1.3
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_1.3-1
                      name: item
                      class: suggested_action
                      prose: Observe regulatory and established organizational, sector, discipline, or professional standards and requirements for applying risk tolerances within the organization.
                    - id: SA-MANAGE_1.3-2
                      name: item
                      class: suggested_action
                      prose: Document procedures for acting on AI system risks related to trustworthiness characteristics.
                    - id: SA-MANAGE_1.3-3
                      name: item
                      class: suggested_action
                      prose: Prioritize risks involving physical safety, legal liabilities, regulatory compliance, and negative impacts on individuals, groups, or society.
                    - id: SA-MANAGE_1.3-4
                      name: item
                      class: suggested_action
                      prose: Identify risk response plans and resources and organizational teams for carrying out response functions.
                    - id: SA-MANAGE_1.3-5
                      name: item
                      class: suggested_action
                      prose: Store risk management and system documentation in an organized, secure repository that is accessible by relevant AI Actors and appropriate personnel.
                - id: A-MANAGE_1.3
                  name: guidance
                  class: about
                  prose: Outcomes from GOVERN-1, MAP-5 and measure-2, can be used to address and document identified risks based on established risk tolerances. Organizations can follow existing regulations and guidelines for risk criteria, tolerances and responses established by organizational, domain, discipline, sector, or professional requirements. In lieu of such guidance, organizations can develop risk response plans based on strategies such as accepted model risk management, enterprise risk management, and information sharing and disclosure practices.
                - id: D-MANAGE_1.3-1
                  name: guidance
                  class: documentation
                  prose: Has the system been reviewed to ensure the AI system complies with relevant laws, regulations, standards, and guidance?
                - id: D-MANAGE_1.3-2
                  name: guidance
                  class: documentation
                  prose: To what extent has the entity defined and documented the regulatory environment—including minimum requirements in laws and regulations?
                - id: D-MANAGE_1.3-3
                  name: guidance
                  class: documentation
                  prose: Did your organization implement a risk management system to address risks involved in deploying the identified AI solution (e.g., personnel risk or changes to commercial objectives)?
            - id: MANAGE_1.4
              class: subcategory
              title: MANAGE 1.4
              props:
                - name: sort-id
                  value: 00002.00001.00004
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#5fbec1da-24ff-4dcd-992b-4b102b08c52e'
                  rel: reference
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#2a8cb204-f69f-4f51-a470-16bdba03cdf4'
                  rel: reference
                - href: '#8f8b6962-34f7-4c0b-bed0-23aeebf17d01'
                  rel: reference
                - href: '#2641f5c5-3f2f-4855-88b7-7c6c29cfa871'
                  rel: reference
                - href: '#59f905af-7275-488f-98e5-29021f5376ca'
                  rel: reference
                - href: '#aba5bb4f-3bc9-4c19-9950-fbed2b46cecb'
                  rel: reference
              parts:
                - id: MANAGE_1.4_ovw
                  name: overview
                  prose: Negative residual risks (defined as the sum of all unmitigated risks) to both downstream acquirers of AI systems and end users are documented.
                - id: SA-MANAGE_1.4
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_1.4-1
                      name: item
                      class: suggested_action
                      prose: Document residual risks within risk response plans, denoting risks that have been accepted, transferred, or subject to minimal mitigation.
                    - id: SA-MANAGE_1.4-2
                      name: item
                      class: suggested_action
                      prose: Establish procedures for disclosing residual risks to relevant downstream AI actors.
                    - id: SA-MANAGE_1.4-3
                      name: item
                      class: suggested_action
                      prose: Inform relevant downstream AI actors of requirements for safe operation, known limitations, and suggested warning labels as identified in MAP 3.4.
                - id: A-MANAGE_1.4
                  name: guidance
                  class: about
                  prose: Organizations may choose to accept or transfer some of the documented risks from MAP and manage 1.3 and 2.1. Such risks, known as residual risk, may affect downstream AI actors such as those engaged in system procurement or use. Transparent monitoring and managing residual risks enable cost benefit analysis and the examination of potential values of AI systems versus its potential negative impacts.
                - id: D-MANAGE_1.4-1
                  name: guidance
                  class: documentation
                  prose: What are the roles, responsibilities, and delegation of authorities of personnel involved in the design, development, deployment, assessment and monitoring of the AI system?
                - id: D-MANAGE_1.4-2
                  name: guidance
                  class: documentation
                  prose: Who will be responsible for maintaining, re-verifying, monitoring, and updating this AI once deployed?
                - id: D-MANAGE_1.4-3
                  name: guidance
                  class: documentation
                  prose: How will updates/revisions be documented and communicated? How often and by whom?
                - id: D-MANAGE_1.4-4
                  name: guidance
                  class: documentation
                  prose: How easily accessible and current is the information available to external stakeholders?
        - id: MANAGE_2
          class: category
          title: MANAGE 2
          props:
            - name: sort-id
              value: "00002.00002"
          parts:
            - id: MANAGE_2_smt
              name: statement
              prose: Strategies to maximize AI benefits and minimize negative impacts are planned, prepared, implemented, and documented, and informed by input from relevant AI actors.
          controls:
            - id: MANAGE_2.1
              class: subcategory
              title: MANAGE 2.1
              props:
                - name: sort-id
                  value: 00002.00002.00001
              links:
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
                - href: '#2b0a4dee-9dbd-413e-b192-ccd4af47a776'
                  rel: resource
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#f3b073ab-ec97-47a1-b59d-c14dee67dd26'
                  rel: reference
                - href: '#b2238ec9-f499-4e0b-ba15-9a1b6295fdca'
                  rel: reference
                - href: '#7875b077-3b63-44e9-ab32-ee9b952a9483'
                  rel: reference
                - href: '#59f905af-7275-488f-98e5-29021f5376ca'
                  rel: reference
                - href: '#1a46af1a-8c82-43e0-a758-2b6e3b5a192f'
                  rel: reference
              parts:
                - id: MANAGE_2.1_ovw
                  name: overview
                  prose: Resources required to manage AI risks are taken into account, along with viable non-AI alternative systems, approaches, or methods – to reduce the magnitude or likelihood of potential impacts.
                - id: SA-MANAGE_2.1
                  name: statement
                  class: suggested_action
                  parts:
                    - id: SA-MANAGE_2.1-1
                      name: item
                      class: suggested_action
                      prose: Plan and implement risk management practices in accordance with established organizational risk tolerances.
                    - id: SA-MANAGE_2.1-2
                      name: item
                      class: suggested_action
                      prose: 'Verify risk management teams are resourced to carry out functions, including:'
                    - id: SA-MANAGE_2.1-2.1
                      name: item
                      class: suggested_action
                      prose: Establishing processes for considering methods that are not automated; semi-automated; or other procedural alternatives for AI functions.
                    - id: SA-MANAGE_2.1-2.2
                      name: item
                      class: suggested_action
                      prose: Enhance AI system transparency mechanisms for AI teams.
                    - id: SA-MANAGE_2.1-2.3
                      name: item
                      class: suggested_action
                      prose: Enable exploration of AI system limitations by AI teams.
                    - id: SA-MANAGE_2.1-2.4
                      name: item
                      class: suggested_action
                      prose: Identify, assess, and catalog past failed designs and negative impacts or outcomes to avoid known failure modes.
                    - id: SA-MANAGE_2.1-3
                      name: item
                      class: suggested_action
                      prose: 'Identify resource allocation approaches for managing risks in systems:'
                    - id: SA-MANAGE_2.1-3.1
                      name: item
                      class: suggested_action
                      prose: deemed high-risk,
                    - id: SA-MANAGE_2.1-3.2
                      name: item
                      class: suggested_action
                      prose: that self-update (adaptive, online, reinforcement self-supervised learning or similar),
                    - id: SA-MANAGE_2.1-3.3
                      name: item
                      class: suggested_action
                      prose: with high uncertainty or where risk management is insufficient.
                    - id: SA-MANAGE_2.1-4
                      name: item
                      class: suggested_action
                      prose: Regularly seek and integrate external expertise and perspectives to supplement organizational diversity (e.g., demographic, disciplinary),equity, inclusion, and accessibility where internal capacity is lacking.
                    - id: SA-MANAGE_2.1-5
                      name: item
                      class: suggested_action
                      prose: Enable and encourage regular, open communication and feedback among AI actors and internal or external stakeholders related to system design or deployment decisions.
                    - id: SA-MANAGE_2.1-6
                      name: item
                      class: suggested_action
                      prose: Prepare and document plans for continuous monitoring and feedback mechanisms.
                - id: A-MANAGE_2.1
                  name: guidance
                  class: about
                  prose: Organizational risk response may entail identifying and analyzing alternative approaches, methods, processes or systems, and balancing tradeoffs between trustworthiness characteristics and how they relate to organizational principles and societal values. Analysis of these tradeoffs is informed by consulting with interdisciplinary organizational teams, independent domain experts, and engaging with individuals or community groups. These processes require sufficient resource allocation.
                - id: D-MANAGE_2.1-1
                  name: guidance
                  class: documentation
                  prose: Are mechanisms in place to evaluate whether internal teams are empowered and resourced to effectively carry out risk management functions?
                - id: D-MANAGE_2.1-2
                  name: guidance
                  class: documentation
                  prose: How will user and other forms of stakeholder engagement be integrated into risk management processes?
            - id: MANAGE_2.2
              class: subcategory
              title: MANAGE 2.2
              props:
                - name: sort-id
                  value: 00002.00002.00002
              links:
                - href: '#13f80f0c-2855-499f-be04-d937768b8f65'
                  rel: resource
                - href: '#99ff8c49-f615-41d7-a82f-a880eb62cc64'
                  rel: resource
